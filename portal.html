<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atividade</title>
<meta name="robots" content="noindex">
<style>
:root{
  color-scheme:light dark;
  --fonte:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Roboto,sans-serif;
  --fundo:#D8E0E2;--m1:#A7BCAD;--m2:#9EB1BC;--m3:#CFC7BA;
  --vidro:rgba(255,255,255,.58);--borda:rgba(255,255,255,.75);--brilho:rgba(255,255,255,.85);
  --sombra:0 1px 2px rgba(30,42,47,.06),0 14px 44px rgba(30,42,47,.14);--linha:rgba(31,42,47,.10);
  --tinta:#1F2A2F;--suave:#52626A;--fraco:#7A888E;--acento:#2E4853;--sobre:#F4F7F7;
  --musgo:#47705B;--ferrugem:#9C4F43;--fino:rgba(255,255,255,.34);
}
@media (prefers-color-scheme:dark){:root{
  --fundo:#1C2427;--m1:#2C4A40;--m2:#283D4B;--m3:#3A3530;
  --vidro:rgba(38,50,55,.55);--borda:rgba(255,255,255,.11);--brilho:rgba(255,255,255,.10);
  --sombra:0 1px 2px rgba(0,0,0,.25),0 14px 44px rgba(0,0,0,.4);--linha:rgba(255,255,255,.08);
  --tinta:#EDF1F0;--suave:#B3BFC2;--fraco:#85949A;--acento:#D8E3E6;--sobre:#1C2427;
  --musgo:#8FB59D;--ferrugem:#D69083;--fino:rgba(255,255,255,.05);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:16px/1.5 var(--fonte);color:var(--tinta);background:
  radial-gradient(60vmax 50vmax at 8% 6%,var(--m1) 0%,transparent 60%),
  radial-gradient(55vmax 45vmax at 96% 18%,var(--m2) 0%,transparent 62%),
  radial-gradient(50vmax 45vmax at 60% 100%,var(--m3) 0%,transparent 60%),var(--fundo);background-attachment:fixed;
  display:grid;place-items:center;padding:20px}
.cartao{width:100%;max-width:440px;border-radius:28px;padding:28px 26px;background:var(--vidro);
  -webkit-backdrop-filter:blur(28px) saturate(150%);backdrop-filter:blur(28px) saturate(150%);
  border:1px solid var(--borda);box-shadow:inset 0 1px 0 var(--brilho),var(--sombra)}
h1{font:600 24px/1.2 var(--fonte);letter-spacing:-.015em;margin:0 0 8px}
p{margin:0;color:var(--suave)}
.estado{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:14px;color:var(--suave)}
.giro{width:16px;height:16px;border-radius:50%;border:2px solid var(--linha);border-top-color:var(--acento);animation:g 1s linear infinite;flex:none}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:3s}}
.barra{height:6px;border-radius:99px;background:var(--linha);overflow:hidden;margin-top:18px}
.barra i{display:block;height:100%;width:0;background:var(--acento);border-radius:99px;transition:width .2s}
.lista{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.lista button{all:unset;cursor:pointer;display:block;padding:14px 18px;border-radius:18px;background:var(--fino);border:1px solid var(--linha);font-weight:600}
.lista button:hover,.lista button:focus-visible{border-color:var(--acento)}
.botao{all:unset;cursor:pointer;display:inline-block;margin-top:20px;padding:10px 22px;border-radius:999px;background:var(--acento);color:var(--sobre);font-weight:600}
.botao:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.erro p{color:var(--tinta)}
.dica{font-size:13.5px;color:var(--fraco);margin-top:12px}
iframe#quiz{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
body.aberto{padding:0;display:block;overflow:hidden}
body.aberto .cartao{display:none}
body.aberto iframe#quiz{display:block}
#aviso{position:fixed;left:12px;bottom:12px;z-index:5;display:none;align-items:center;gap:8px;font:500 12.5px var(--fonte);color:var(--tinta);
  padding:6px 12px;border-radius:999px;background:var(--vidro);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--borda);box-shadow:var(--sombra)}
#aviso i{width:8px;height:8px;border-radius:50%;background:var(--ferrugem)}
</style>
</head>
<body>
<main class="cartao" id="cartao" aria-live="polite">
  <h1 id="tit">Atividade</h1>
  <p id="txt">Conectando ao professor…</p>
  <div class="estado" id="est"><span class="giro"></span><span id="etapa">Preparando a conexão</span></div>
</main>
<iframe id="quiz" title="Atividade" allow="fullscreen; clipboard-write" allowfullscreen></iframe>
<div id="aviso" role="status"><i></i><span>Reconectando ao professor. Suas respostas ficam guardadas.</span></div>
<noscript><p style="padding:20px">Ative o JavaScript do navegador para abrir a atividade.</p></noscript>
<script>
(function(){
'use strict';
var MURAIS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081/mqtt'];
var STUN=[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun.nextcloud.com:443']}];
var $=function(i){return document.getElementById(i)};
var H={};location.hash.replace(/^#/,'').split('&').forEach(function(p){var i=p.indexOf('=');if(i>0)H[p.slice(0,i)]=decodeURIComponent(p.slice(i+1))});
if(H.m)MURAIS=H.m.split(',');
var SALA=H.s||'',QUIZ=H.q||'';
var te=new TextEncoder(),td=new TextDecoder();

function tela(tit,txt,etapa,extra){
  $('tit').textContent=tit;$('txt').textContent=txt;
  var e=$('est');e.innerHTML='';
  if(etapa){e.style.display='flex';e.innerHTML='<span class="giro"></span><span></span>';e.lastChild.textContent=etapa}else e.style.display='none';
  var velho=document.querySelector('.extra');if(velho)velho.remove();
  if(extra){extra.classList.add('extra');$('cartao').appendChild(extra)}
}
function botaoTentar(){var b=document.createElement('button');b.className='botao';b.textContent='Tentar de novo';b.onclick=function(){tentativas=0;conectar()};var d=document.createElement('div');d.appendChild(b);return d}

if(!/^[a-z0-9]{10,40}$/.test(SALA)){tela('Link incompleto','Este link não tem o código da sala. Peça ao professor o link ou o QR code da atividade.');return}
if(!window.RTCPeerConnection||!window.crypto||!crypto.subtle){tela('Navegador sem suporte','Abra este link no Chrome, Edge, Firefox ou Safari atualizados.');return}

/* ---------- recados embaralhados (AES-GCM) ---------- */
var CHAVE=null;
function b64(u){var s='';for(var i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
function deb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function cifrar(obj){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},CHAVE,te.encode(JSON.stringify(obj))).then(function(ct){var o=new Uint8Array(12+ct.byteLength);o.set(iv);o.set(new Uint8Array(ct),12);return b64(o)})}
function decifrar(txt){try{var raw=deb64(txt.trim());return crypto.subtle.decrypt({name:'AES-GCM',iv:raw.subarray(0,12)},CHAVE,raw.subarray(12)).then(function(p){return JSON.parse(td.decode(p))})}catch(e){return Promise.reject(e)}}

/* ---------- mural público (MQTT pelo navegador) ---------- */
function Mural(url){
  var self=this;this.url=url;this.ok=false;this.subs={};this.ws=null;this.espera=3000;this.pid=1;
  this.abrir=function(){
    var ws;try{ws=new WebSocket(url,['mqtt'])}catch(e){return}
    self.ws=ws;ws.binaryType='arraybuffer';var buf=new Uint8Array(0),ping;
    ws.onopen=function(){var id='sqp-'+Math.random().toString(36).slice(2,12);
      var vh=[0,4,77,81,84,84,4,2,0,60];self.env(0x10,vh.concat(str(id)))};
    ws.onmessage=function(ev){var d=new Uint8Array(ev.data),n=new Uint8Array(buf.length+d.length);n.set(buf);n.set(d,buf.length);buf=n;
      for(;;){if(buf.length<2)return;var mult=1,len=0,i=1,b;do{if(i>=buf.length)return;b=buf[i++];len+=(b&127)*mult;mult*=128}while(b&128);
        if(buf.length<i+len)return;var tipo=buf[0]>>4,fl=buf[0]&15,c=buf.subarray(i,i+len);buf=buf.slice(i+len);
        if(tipo===2){if(c[1]===0){self.ok=true;self.espera=3000;Object.keys(self.subs).forEach(function(t){self.sub(t)});
          ping=setInterval(function(){self.env(0xC0,[])},40000);aoMudar()}}
        else if(tipo===3){var tl=(c[0]<<8)|c[1],t=td.decode(c.subarray(2,2+tl)),p=2+tl;if((fl>>1)&3)p+=2;var cb=self.subs[t];if(cb)cb(td.decode(c.subarray(p)))}}};
    ws.onclose=function(){clearInterval(ping);var era=self.ok;self.ok=false;if(era)aoMudar();setTimeout(self.abrir,self.espera);self.espera=Math.min(self.espera*2,30000)};
    ws.onerror=function(){};
  };
  this.env=function(tipo,corpo){if(!self.ws||self.ws.readyState!==1)return;var l=corpo.length,rl=[];do{var x=l%128;l=Math.floor(l/128);if(l>0)x|=128;rl.push(x)}while(l>0);
    self.ws.send(new Uint8Array([tipo].concat(rl,corpo)))};
  this.sub=function(t){if(!self.ok)return;var id=self.pid++&0xffff||1;self.env(0x82,[id>>8,id&255].concat(str(t),[0]))};
  this.assinar=function(t,cb){self.subs[t]=cb;self.sub(t)};
  this.publicar=function(t,txt){if(!self.ok)return false;self.env(0x30,str(t).concat(Array.from(te.encode(txt))));return true};
  function str(s){var b=Array.from(te.encode(s));return[b.length>>8,b.length&255].concat(b)}
}
function topico(s){return 'sqz/v1/'+SALA+'/'+s}
var murais=[];
function algumMural(){return murais.some(function(m){return m.ok})}
var esperandoMural=null;
function aoMudar(){if(algumMural()&&esperandoMural){var f=esperandoMural;esperandoMural=null;f()}}

/* ---------- presença do professor ---------- */
var profOnline=null;
function verPresenca(txt){decifrar(txt).then(function(o){var agora=Date.now()/1000;profOnline=o.t>0&&Math.abs(agora-o.t)<900}).catch(function(){})}

/* ---------- conexão direta (WebRTC) ---------- */
var pc=null,dc=null,tentativas=0,emQuiz=false,fila=[],chunks=[],recebido=0,total=0,ultimoQuiz=QUIZ;
try{fila=JSON.parse(localStorage.getItem('__sqp_fila:'+SALA)||'[]')||[]}catch(e){}
function guardarFila(){try{localStorage.setItem('__sqp_fila:'+SALA,JSON.stringify(fila.slice(-300)))}catch(e){}}
function idAleat(){return Array.from(crypto.getRandomValues(new Uint8Array(12))).map(function(x){return('0'+x.toString(16)).slice(-2)}).join('')}

function conectar(){
  if(!algumMural()){if(!emQuiz)tela('Atividade','Conectando ao professor…','Procurando o ponto de encontro');esperandoMural=conectar;return}
  if(!emQuiz)tela('Atividade','Conectando ao professor…',profOnline===false?'O professor ainda não abriu a atividade. Aguardando…':'Abrindo a conexão direta');
  tentativas++;
  var id=idAleat(),meu=pc=new RTCPeerConnection({iceServers:STUN});
  var canal=meu.createDataChannel('q',{ordered:true});canal.binaryType='arraybuffer';
  var respondido=false,abriu=false;
  murais.forEach(function(m){m.assinar(topico('c/'+id),function(txt){if(respondido||meu!==pc)return;decifrar(txt).then(function(o){if(respondido)return;respondido=true;meu.setRemoteDescription({type:'answer',sdp:o.sdp}).catch(falhou)}).catch(function(){})})});
  canal.onopen=function(){abriu=true;tentativas=0;dc=canal;aberto()};
  canal.onmessage=receber;
  canal.onclose=function(){if(meu===pc){dc=null;caiu()}};
  meu.onconnectionstatechange=function(){if(meu!==pc)return;if(meu.connectionState==='failed'){dc=null;caiu()}};
  meu.createOffer().then(function(o){return meu.setLocalDescription(o)}).then(function(){
    return new Promise(function(ok){if(meu.iceGatheringState==='complete')return ok();var t=setTimeout(ok,3500);meu.addEventListener('icegatheringstatechange',function(){if(meu.iceGatheringState==='complete'){clearTimeout(t);ok()}})})
  }).then(function(){return cifrar({id:id,sdp:meu.localDescription.sdp,ua:navigator.userAgent.slice(0,200)})}).then(function(txt){
    murais.forEach(function(m){m.publicar(topico('x'),txt)});
  }).catch(falhou);
  setTimeout(function(){if(!abriu&&meu===pc)falhou()},respostaTempo());
  function falhou(){if(meu!==pc||abriu)return;try{meu.close()}catch(e){}pc=null;
    if(tentativas<4){setTimeout(conectar,1500*tentativas);return}
    if(emQuiz){setTimeout(conectar,15000);return}
    var semProf=profOnline===false;
    tela(semProf?'O professor ainda não abriu':'Não foi possível conectar',
      semProf?'O programa do professor precisa estar aberto. Esta página continua tentando sozinha.':'Esta rede pode estar bloqueando a conexão direta. Troque de rede (Wi-Fi ou dados móveis) e toque em Tentar de novo.',
      null,botaoTentar());
    if(semProf){tentativas=0;setTimeout(conectar,20000)}
  }
}
function respostaTempo(){return 22000}
function caiu(){if(emQuiz){$('aviso').style.display='flex';setTimeout(conectar,2000)}else{tentativas=Math.min(tentativas,3);conectar()}}
function mandar(o){if(dc&&dc.readyState==='open'){dc.send(JSON.stringify(o));return true}return false}
function aberto(){
  $('aviso').style.display='none';
  if(fila.length){if(mandar({op:'api',corpo:fila})){fila=[];guardarFila()}}
  if(emQuiz)return;
  if(QUIZ){mandar({op:'abrir',quiz:QUIZ});tela('Atividade','Recebendo a atividade…',null,barra())}
  else{mandar({op:'lista'});tela('Atividades','Carregando a lista…','Conectado ao professor')}
}
function barra(){var d=document.createElement('div');d.className='barra';d.innerHTML='<i id="prog"></i>';return d}
setInterval(function(){mandar({op:'ping'})},20000);

function receber(ev){
  if(typeof ev.data!=='string'){chunks.push(ev.data);recebido+=ev.data.byteLength;var p=$('prog');if(p&&total)p.style.width=Math.min(100,recebido*100/total)+'%';return}
  var m;try{m=JSON.parse(ev.data)}catch(e){return}
  if(m.op==='lista'){
    var l=m.quizzes||[];if(!l.length){tela('Atividades','Nenhuma atividade aberta agora. Aguarde o professor liberar.');return}
    var d=document.createElement('div');d.className='lista';
    l.forEach(function(q){var b=document.createElement('button');b.textContent=q.titulo;b.onclick=function(){QUIZ=q.arquivo;ultimoQuiz=QUIZ;mandar({op:'abrir',quiz:QUIZ});tela(q.titulo,'Recebendo a atividade…',null,barra())};d.appendChild(b)});
    tela('Atividades','Toque na atividade que o professor indicou.',null,d);
  }else if(m.op==='arquivo'){chunks=[];recebido=0;total=m.tam||0;$('tit').textContent=m.titulo||'Atividade';document.title=m.titulo||'Atividade'}
  else if(m.op==='fim'){
    var tam=chunks.reduce(function(a,c){return a+c.byteLength},0),u=new Uint8Array(tam),o=0;chunks.forEach(function(c){u.set(new Uint8Array(c),o);o+=c.byteLength});chunks=[];
    emQuiz=true;var f=$('quiz');f.srcdoc=td.decode(u);document.body.classList.add('aberto');
  }else if(m.op==='erro'){tela('Atividade indisponível',m.texto||'Confira o link com o professor.')}
  else if(m.op==='msg'){try{$('quiz').contentWindow.postMessage({sq:'msg',m:m.m},'*')}catch(e){}}
}
/* respostas vindas do quiz */
window.addEventListener('message',function(ev){
  var f=$('quiz');if(!f||ev.source!==f.contentWindow||!ev.data||ev.data.sq!=='api')return;
  var corpo=ev.data.corpo||[];
  if(!mandar({op:'api',corpo:fila.concat(corpo)})){fila=fila.concat(corpo);guardarFila()}else if(fila.length){fila=[];guardarFila()}
});

/* ---------- início ---------- */
crypto.subtle.digest('SHA-256',te.encode('sqz-v1:'+SALA)).then(function(h){return crypto.subtle.importKey('raw',h,'AES-GCM',false,['encrypt','decrypt'])}).then(function(k){
  CHAVE=k;
  murais=MURAIS.map(function(u){var m=new Mural(u);m.assinar(topico('on'),verPresenca);m.abrir();return m});
  setTimeout(function(){if(!algumMural()&&!emQuiz)tela('Atividade','Não foi possível alcançar o ponto de encontro. Confira a internet deste aparelho.','Tentando de novo')},12000);
  conectar();
});
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>O Pensador — Em construção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }

  :root{
    --gold:     #e9bd6a;
    --ink:      #eef2f9;
    --ink-soft: #9aa8bf;
  }

  body{
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: #05070d;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Em telas largas o texto fica à esquerda e o Pensador à direita */
  @media (min-width: 900px){
    body{ justify-content: flex-start; padding-left: clamp(32px, 6vw, 110px); }
    .card{ width: min(100%, 520px); }
  }

  #bg{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    display: block;
  }

  body::after{
    content: "";
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(120% 90% at 60% 45%, transparent 55%, rgba(0,0,0,.7) 100%),
      linear-gradient(180deg, rgba(5,7,13,.35) 0%, transparent 25%, transparent 75%, rgba(5,7,13,.55) 100%);
  }

  .card{
    position: relative;
    z-index: 2;
    width: min(100%, 680px);
    text-align: center;
    padding: clamp(28px, 5vw, 56px) clamp(22px, 4vw, 48px);
    border-radius: 26px;
    border: 1px solid rgba(233, 189, 106, .18);
    background: linear-gradient(155deg,
      rgba(5,7,13,.62) 0%,
      rgba(5,7,13,.48) 45%,
      rgba(5,7,13,.58) 100%);
    box-shadow:
      0 50px 90px -40px rgba(0,0,0,.95),
      0 1px 0 rgba(255,255,255,.06) inset;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    overflow: hidden;
  }

  .card::before{
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(233,189,106,.75), transparent);
  }

  .eyebrow{
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: .9;
  }
  .eyebrow::before{
    content: "";
    width: 28px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }

  h1{
    margin: 0 0 18px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(30px, 4.2vw, 46px);
    line-height: 1.12;
    letter-spacing: -.01em;
    background: linear-gradient(180deg, #ffffff 0%, #c3cfe4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p{
    margin: 0 auto;
    max-width: 46ch;
    font-size: clamp(14px, 1.5vw, 16px);
    font-weight: 300;
    line-height: 1.75;
    color: #b4c0d4;
  }

  .dots{
    display: flex;
    justify-content: center;
    gap: 9px;
    margin-top: 30px;
  }
  .dots span{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 12px rgba(233,189,106,.7);
    animation: pulse 1.5s ease-in-out infinite;
  }
  .dots span:nth-child(2){ animation-delay: .2s; }
  .dots span:nth-child(3){ animation-delay: .4s; }

  @keyframes pulse{
    0%, 100% { transform: scale(.55); opacity: .28; }
    50%      { transform: scale(1);   opacity: 1; }
  }

  .download{
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 3;
    padding: 10px 18px;
    background: rgba(233,189,106,.14);
    color: var(--gold);
    border: 1px solid rgba(233,189,106,.4);
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(8px);
    transition: background .2s;
  }
  .download:hover{ background: rgba(233,189,106,.26); }
  .download:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation: none !important; }
  }
</style>
</head>
<body>

  <canvas id="bg" aria-hidden="true"></canvas>

  <main class="card">
    <span class="eyebrow">Em construção</span>
    <h1>Aguarde só mais um pouquinho!</h1>
    <p>O professor de filosofia está trabalhando para finalizar o conteúdo deste site.</p>
    <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  </main>

  <button class="download" onclick="downloadBg()">Baixar imagem</button>

  const CONFIG = {
    rows:        135,      // linhas de dígitos na altura da tela (mais = mais detalhe)
    charWRatio:  0.62,
    charHRatio:  1.04,
    bgColor:     '#05070d',
    font:        "'JetBrains Mono', ui-monospace, 'Courier New', monospace",
    shadowColor: [ 34,  62, 128],   // tons escuros do relevo
    midColor:    [ 96, 150, 220],   // tons médios
    lightColor:  [255, 218, 140],   // realces dourados
    bgDigit:     [ 80, 130, 205],   // dígitos do fundo
    statueHeight: 0.97,             // altura da estátua em relação à tela
    gamma:       0.78,              // <1 clareia os meios-tons
    dprMax:      2
  };

  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  let ready = false;

  const mix = (a, b, t) => a + (b - a) * t;
  const smooth = (e0, e1, x) => {
    const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0)));
    return t * t * (3 - 2 * t);
  };
  // hash determinístico: define se a célula é 0 ou 1 (sem tremer ao redimensionar)
  const bit = (x, y) => {
    let h = (x * 374761393 + y * 668265263) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return ((h ^ (h >>> 16)) & 1) ? '1' : '0';
  };

  function render() {
    if (!ready) return;

    const W = Math.max(window.innerWidth, 360);
    const H = Math.max(window.innerHeight, 480);
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprMax);

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // tamanho da célula: define pela quantidade de linhas
    const ch = H / CONFIG.rows;
    const fs = ch / CONFIG.charHRatio;
    const cw = fs * CONFIG.charWRatio;
    const cols = Math.ceil(W / cw);
    const rows = CONFIG.rows;

    /* --- Amostra a imagem: 1 pixel por célula --- */
    const sc = document.createElement('canvas');
    sc.width = cols; sc.height = rows;
    const sx = sc.getContext('2d', { willReadFrequently: true });
    sx.fillStyle = '#000';
    sx.fillRect(0, 0, cols, rows);
    sx.imageSmoothingEnabled = true;
    sx.imageSmoothingQuality = 'high';

    const wide = W >= 900;
    const imgPx = H * CONFIG.statueHeight;            // lado da imagem em px
    const centerX = wide ? W * 0.70 : W * 0.5;
    const left = (centerX - imgPx / 2) / cw;          // em células
    const top  = (H - imgPx) / 2 / ch;
    sx.drawImage(img, left, top, imgPx / cw, imgPx / ch);
    const data = sx.getImageData(0, 0, cols, rows).data;

    /* --- Fundo --- */
    ctx.fillStyle = CONFIG.bgColor;
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = 'top';
    ctx.textAlign = 'left';

    const [sr, sg, sb] = CONFIG.shadowColor;
    const [mr, mg, mb] = CONFIG.midColor;
    const [lr, lg, lb] = CONFIG.lightColor;
    const [dr, dg, db] = CONFIG.bgDigit;

    let lastFont = '';
    const setFont = (w) => {
      const f = `${w} ${fs}px ${CONFIG.font}`;
      if (f !== lastFont) { ctx.font = f; lastFont = f; }
    };

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const lum = data[(y * cols + x) * 4] / 255;
        const cover = smooth(0.045, 0.11, lum);      // 0 = fundo, 1 = estátua
        const ch01 = bit(x, y);
        const px = x * cw, py = y * ch;

        if (cover < 0.5) {
          /* Fundo: dígitos azuis, esmaecendo nas bordas */
          const cx = x / cols - (wide ? 0.62 : 0.5);
          const cy = y / rows - 0.5;
          const fade = Math.max(0, 1 - Math.hypot(cx, cy) * 1.7);
          const k = fade * fade * 0.5;
          setFont(400);
          ctx.globalAlpha = 0.18 + fade * 0.5;
          ctx.fillStyle = `rgb(${dr * k | 0},${dg * k | 0},${db * k | 0})`;
          ctx.fillText(ch01, px, py);
        } else {
          /* Estátua: luminância da imagem = relevo 3D */
          let t = Math.min(1, Math.max(0, (lum - 0.05) / 0.62));
          t = Math.pow(t, CONFIG.gamma);

          let r, g, b;
          if (t < 0.55) {
            const u = t / 0.55;
            r = mix(sr, mr, u); g = mix(sg, mg, u); b = mix(sb, mb, u);
          } else {
            const u = (t - 0.55) / 0.45;
            r = mix(mr, lr, u); g = mix(mg, lg, u); b = mix(mb, lb, u);
          }

          setFont(t > 0.5 ? 700 : 500);
          ctx.globalAlpha = Math.min(1, 0.3 + t * 0.8) * (0.55 + 0.45 * cover);
          ctx.fillStyle = `rgb(${r | 0},${g | 0},${b | 0})`;
          ctx.fillText(ch01, px, py);
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  window.downloadBg = function () {
    const link = document.createElement('a');
    link.download = 'pensador-bits-3d.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 150);
  });

  img.onload = () => {
    ready = true;
    render();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  };
  img.src = IMG_SRC;
})();

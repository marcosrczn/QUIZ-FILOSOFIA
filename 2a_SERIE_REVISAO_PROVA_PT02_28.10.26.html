        fant.style.left = (e.clientX - fant.offsetWidth / 2) + "px"; fant.style.top = (e.clientY - fant.offsetHeight / 2) + "px";
        fant.style.visibility = "hidden";
        const el = document.elementFromPoint(e.clientX, e.clientY);
        fant.style.visibility = "";
        const l = el && el.closest ? el.closest(".lac") : null;
        if (alvo && alvo !== l) alvo.classList.remove("sobre");
        alvo = l && lacs.includes(l) ? l : null; if (alvo) alvo.classList.add("sobre");
      };
      const fim = () => {
        c.removeEventListener("pointermove", move); c.removeEventListener("pointerup", fim); c.removeEventListener("pointercancel", fim);
        c.classList.remove("arrastando");
        if (fant) { fant.remove(); arrastou = true; setTimeout(() => { arrastou = false; }, 0); if (alvo) { alvo.classList.remove("sobre"); coloca(+c.dataset.b, +alvo.dataset.l); } }
      };
      c.addEventListener("pointermove", move); c.addEventListener("pointerup", fim); c.addEventListener("pointercancel", fim);
    });
  });
  const leit = $("#q-leit");
  const libera = () => {
    limpaTick();
    S.leitRest = 0; if (!S.liberadaEm) S.liberadaEm = agora(); salva();
    liberado = true; leit.hidden = true; pinta();
  };
  const pintaLeit = () => {
    leit.hidden = false;
    leit.classList.toggle("pausado", document.hidden);
    leit.textContent = document.hidden ? "⏸ Página em segundo plano: o tempo de leitura está parado."
      : "🔒 Tempo mínimo de leitura: as respostas serão liberadas em " + S.leitRest + " s.";
  };
  pinta();
  if (!GUARD || S.leitRest <= 0) libera();
  else {
    pintaLeit();
    tick = setInterval(() => {
      if (!GUARD) return libera();
      if (document.hidden) return pintaLeit();
      S.leitRest--; salva();
      if (S.leitRest <= 0) libera(); else pintaLeit();
    }, 1000);
  }
  conf.onclick = () => {
    if (fill.some(x => x == null) || S.respondida) return;
    const certo = gab()[qi][0];
    const ok = fill.every((b,i) => b === certo[i]);
    const e = Math.round((agora() - (S.liberadaEm || agora())) / 1000);
    const rapida = GUARD && e < RAPIDA;
    const r = { f: fill.slice(), ok, t: agora(), e, r: rapida };
    (S.resp[qi] = S.resp[qi] || []).push(r);
    S.pendente = null; S.respondida = true;
    S.fs = rapida ? (S.fs||0) + 1 : 0;
    if (!ok){
      if (GUARD) S.pausaAte = agora() + PAUSA*1000;
      const nf = S.fila.length, min = nf > 0 ? 1 : 0;
      S.fila.splice(min + Math.floor(Math.random() * (nf - min + 1)), 0, qi);
    }
    if (GUARD && S.fs >= SEQ_RAPIDA){ S.fs = 0; S.rushN = (S.rushN||0) + 1; S.rushAte = agora() + PAUSA_RITMO*1000; }
    salva(); mostra();
  };
}

/* ---------- resultado ---------- */
function estat(){
  const prim = Q.map((_,qi) => { const r = (S.resp[qi]||[])[0]; return !!(r && r.ok); });
  const acertos1 = prim.filter(Boolean).length;
  const todas = todasResp(), total = todas.length;
  const acertos = todas.filter(r => r.ok).length, erros = total - acertos;
  const dominadas = Q.filter((_,qi) => (S.resp[qi]||[]).some(r => r.ok)).length;
  const tempos = todas.filter(r => typeof r.e === "number");
  const media = tempos.length ? Math.round(tempos.reduce((s,r)=>s+r.e,0)/tempos.length) : 0;
  const rapida = tempos.length ? Math.min(...tempos.map(r=>r.e)) : 0;
  const apressadas = tempos.filter(r => r.r).length;
  const pctAp = tempos.length ? Math.round(apressadas/tempos.length*100) : 0;
  const nota = (acertos1/Q.length*10).toFixed(1).replace(".",",");
  const dur = (S.fim||agora()) - S.inicio;
  let diag;
  if (pctAp === 0 && !S.rushN) diag = ["ok","Leitura consciente: ritmo adequado em todas as respostas."];
  else if (pctAp < 40 && (S.rushN||0) <= 1) diag = ["alerta","Ritmo irregular: algumas respostas foram dadas rápido demais."];
  else diag = ["ruim","Leitura apressada: muitas respostas sem tempo de reflexão."];
  const limpo = !apressadas && !S.rushN;
  return { prim, acertos1, total, acertos, erros, dominadas, media, rapida, apressadas, pctAp, nota, dur, diag, limpo, nTempos: tempos.length };
}
function resumo(){
  const E = estat();
  const registro = `${S.nome}|${S.turma}|${E.acertos1}|${E.total}|${S.infr.length}|${S.recargas}|${S.rushN||0}|${new Date(S.fim).toISOString()}`;
  const cod = cyrb(registro + "|" + CHAVE).slice(0,10).padEnd(10,"0");
  return Object.assign(E, { registro, codigo: cod.slice(0,5)+"-"+cod.slice(5) });
}
function linhaQuestao(qi){
  const rs = S.resp[qi]||[], sec = DATA.qsec[qi+1], p = rs[0];
  return { pos: S.seq.indexOf(qi), num: String(S.seq.indexOf(qi)+1).padStart(2,"0"), gab: String(qi+1).padStart(2,"0"), sec: `${sec}. ${DATA.secs[sec]}`, prim: p ? (p.ok ? "Acertou" : "Errou") : "Não respondida", ret: String(rs.length) };
}
function todasLinhas(){ return Q.map((_,qi) => linhaQuestao(qi)).sort((a,b) => a.pos - b.pos); }

}

async function relatorioPDF(R, linhas, b, aluno){

    conteudo.push(["h1","Verificação"], ["tb",["Item","Registro"],[["Código de verificação", R.codigo], ["Registro", R.registro]],[3600,6038]]);
    conteudo.push(["h1","Desempenho por questão"], ["tb",(aluno ? ["Questão","Seção da apostila","1ª tentativa","Tentativas"] : ["Questão","Nº no gabarito","Seção da apostila","1ª tentativa","Tentativas"]), (aluno ? linhas.map(l=>[l.num,l.sec,l.prim,l.ret]) : linhas.map(l=>[l.num,l.gab,l.sec,l.prim,l.ret])),(aluno ? [1100,4900,1800,1838] : [1000,1300,4100,1700,1538])]);
    if (S.infr.length) conteudo.push(["h1","Alertas em ordem cronológica"], ["tb",["Horário","Ocorrência"], S.infr.map(i=>[new Date(i.t).toLocaleTimeString("pt-BR"), i.tipo]),[2000,7638]]);
    const D = { cab: DATA.cab, sub: "Relatório do quiz", rod: "Relatório do quiz",
      cabLinhas: [`**Componente curricular:** ${DATA.cab.componente}. **Série/trimestre:** ${DATA.cab.serie}.`], conteudo };

  } catch(e){ console.error(e); alert("Não foi possível gerar o PDF neste navegador."); }
  b.disabled = false; b.textContent = txt;
}

      if (!f) return true;
      const sec = DATA.qsec[i+1];
      const txt = [q.t.join(" "), q.q, (q.a || q.b).join(" "), q.f || "", G[i][1], `seção ${sec}`, DATA.secs[sec], `questão ${i+1}`].join(" ").toLowerCase();
      return txt.includes(f);
    });
    $("#g-exib").textContent = itens.length;
    $("#g-lista").innerHTML = itens.length ? itens.map(({q,i}) => {
      const sec = DATA.qsec[i+1], c = G[i][0];
      return `<div class="gcard"><div class="ghead"><span class="gnum">Questão ${String(i+1).padStart(2,"0")}</span><span class="gtag">Seção ${sec}: ${esc(DATA.secs[sec])}</span><span class="gresp">✅ ${q.tipo==="arraste" ? "Completar" : "Correta: " + L[c]}</span></div>
        ${q.t.map(t=>`<p>${md(t)}</p>`).join("")}<p class="qcomando">${md(q.q)}</p>
        ${q.tipo==="arraste"
          ? `<div class="gopt certa">${q.f.split(/\{(\d)\}/).map((p,j)=> j%2 ? `<b>[(${+p+1}) ${md(q.b[c[+p]])}]</b>` : md(p)).join("")}</div><div class="gopt"><b>Respostas do quadro:</b> ${q.b.map((b,k)=> c.includes(k) ? `<strong>${md(b)}</strong>` : md(b)).join(" • ")}</div>`
          : q.a.map((a,k)=>`<div class="gopt${k===c?" certa":""}"><b>${L[k]})</b> ${md(a)}</div>`).join("")}
        <div class="gexp"><strong>Justificativa:</strong> ${md(G[i][1])}</div></div>`;
    }).join("") : `<p class="centro">Nenhuma questão encontrada com esse filtro.</p>`;
  };
  $("#g-busca").oninput = lista; lista();
}
function relAluno(){
  const el = $("#rel-area");
  if (!S){ el.innerHTML = `<h2 style="margin-top:0;color:var(--brand)">Relatório</h2><p>O relatório aparece aqui depois que você começar o quiz.</p>`; return; }
  const fim = S.fase === "fim";
  const R = fim ? resumo() : Object.assign(estat(), { codigo: "gerado ao concluir o quiz", registro: "" });
  const linhas = todasLinhas();
  el.innerHTML = `<h2 style="margin-top:0;color:var(--brand)">📊 Relatório de desempenho</h2>
    <div class="tstatus ${fim?"on":"off"}">${fim?"Atividade concluída":"Atividade em andamento"}</div>
    <div class="tw"><table><tbody><tr><th style="width:46%">Estudante</th><td>${esc(S.nome)}</td></tr><tr><th>Turma</th><td>${esc(S.turma)}</td></tr>
    <tr><th>Questões vistas</th><td>${vistas()} de ${Q.length}</td></tr><tr><th>Código de verificação</th><td>${fim?`<span class="codigo">${R.codigo}</span>`:esc(R.codigo)}</td></tr></tbody></table></div>
    <div class="diag ${R.diag[0]}">${esc(R.diag[1])}</div>
    ${tabelaRel(R, true)}
    <h3 class="rel-h">Desempenho por questão</h3>
    <div class="tw"><table><thead><tr><th>Questão</th><th>Seção da apostila</th><th>1ª tentativa</th><th>Tentativas</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${l.num}</td><td>${esc(l.sec)}</td><td class="${l.prim==="Acertou"?"ok-t":l.prim==="Errou"?"no-t":""}">${l.prim}</td><td>${l.ret}</td></tr>`).join("")}</tbody></table></div>
    ${S.infr.length?`<h3 class="rel-h">Alertas em ordem cronológica</h3><div class="tw"><table><tbody>${S.infr.map(i=>`<tr><td style="width:24%">${new Date(i.t).toLocaleTimeString("pt-BR")}</td><td>${esc(i.tipo)}</td></tr>`).join("")}</tbody></table></div>`:""}
    <div class="nav-q" style="margin-top:12px"><button class="btn sec" id="rel-quiz" type="button">${fim?"Ver resultado no quiz":"Voltar ao quiz"}</button><button class="btn" id="rel-pdf" type="button">⬇ Relatório em PDF</button></div>`;
  $("#rel-quiz").onclick = () => abre("#tab-qz","#p-qz");
  $("#rel-pdf").onclick = () => relatorioPDF(R, linhas, $("#rel-pdf"), true);
}
$("#tab-rel").addEventListener("click", relAluno);

function relProf(){
  if (!S) return;
  const R = S.fase === "fim" ? resumo() : Object.assign(estat(), { codigo: "gerado ao concluir", registro: "" });
  const linhas = todasLinhas();
  veu(`<div class="prof">${voltar()}<h2>📊 Relatório do estudante</h2>
    <div class="tstatus ${S.fase==="fim"?"on":"off"}">${S.fase==="fim"?"Atividade concluída":"Atividade em andamento"}</div>
    <div class="tw"><table><tbody><tr><th style="width:46%">Estudante</th><td>${esc(S.nome)}</td></tr><tr><th>Turma</th><td>${esc(S.turma)}</td></tr>
    <tr><th>Questões vistas</th><td>${vistas()} de ${Q.length}</td></tr><tr><th>Código de verificação</th><td>${esc(R.codigo)}</td></tr></tbody></table></div>
    <div class="diag ${R.diag[0]}">${esc(R.diag[1])}</div>
    ${tabelaRel(R)}
    <h3 class="rel-h">Desempenho por questão</h3>
    <div class="tw"><table><thead><tr><th>Questão</th><th>Nº no gabarito</th><th>Seção</th><th>1ª tentativa</th><th>Tentativas</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${l.num}</td><td>${l.gab}</td><td>${esc(l.sec)}</td><td class="${l.prim==="Acertou"?"ok-t":"no-t"}">${l.prim}</td><td>${l.ret}</td></tr>`).join("")}</tbody></table></div>
    ${S.infr.length?`<h3 class="rel-h">Alertas em ordem cronológica</h3><div class="tw"><table><tbody>${S.infr.map(i=>`<tr><td style="width:24%">${new Date(i.t).toLocaleTimeString("pt-BR")}</td><td>${esc(i.tipo)}</td></tr>`).join("")}</tbody></table></div>`:""}
    <div class="nav-q"><button class="btn" id="m-relpdf" type="button">⬇ Relatório em PDF</button></div></div>`, "prof");
  largo(); ligaVoltar();
  $("#m-relpdf").onclick = () => relatorioPDF(R, linhas, $("#m-relpdf"));
}
function conferirCodigo(){
  veu(`<div class="prof">${voltar()}<h2>🔎 Conferir código de um relatório</h2>
    <p style="font-size:.9rem">Cole a linha <em>Registro</em> e o <em>Código de verificação</em> que aparecem no relatório em PDF do estudante.</p>
    <input class="txt" id="v-reg" placeholder="Registro"><input class="txt" id="v-cod" placeholder="Código (ex.: AB12C-D34EF)" style="margin-top:8px">
    <p id="v-res"></p>
    <div class="nav-q"><button class="btn" id="v-ok" type="button">Conferir</button></div></div>`, "prof");
  ligaVoltar();
  $("#v-ok").onclick = () => {
    const reg = $("#v-reg").value.trim(), cod = $("#v-cod").value.trim().toUpperCase();
    const calc = cyrb(reg + "|" + CHAVE).slice(0,10).padEnd(10,"0"); const fmt = calc.slice(0,5)+"-"+calc.slice(5);
    $("#v-res").innerHTML = reg && cod === fmt ? `<span class="ok-t">Código válido: os dados do registro não foram alterados.</span>` : `<span class="no-t">Código não confere com o registro.</span>`;
  };
}

/* ---------- início ---------- */
function retomada(){
  const E = estat();
  veu(`<h2>💾 Você tem uma atividade em andamento</h2>
    <p>Encontramos o seu progresso salvo neste navegador. Continue de onde parou.</p>
    <div class="tw"><table><tbody>
      <tr><th style="width:46%">Estudante</th><td>${esc(S.nome)} (${esc(S.turma)})</td></tr>
      <tr><th>Início</th><td>${fmtData(S.inicio)}</td></tr>
      <tr><th>Questões vistas</th><td>${vistas()} de ${Q.length}</td></tr>
      <tr><th>Respostas dadas</th><td>${E.total}</td></tr>
    </tbody></table></div>
    <div id="res-senha" hidden><label class="campo" for="res-pw">Senha do professor para reiniciar</label><input class="txt" id="res-pw" type="password" autocomplete="off"><p id="res-erro" class="no-t" hidden>Senha incorreta.</p></div>
    <div class="nav-q"><button class="btn sec" id="res-reini" type="button">🔄 Reiniciar</button><button class="btn" id="res-ok" type="button">▶ Continuar</button></div>`, "retomada");
  $("#res-ok").onclick = () => { fechaVeu(); abre("#tab-qz","#p-qz"); };
  const reinicia = () => {
    const box = $("#res-senha");
    if (box.hidden){ box.hidden = false; $("#res-reini").textContent = "Confirmar reinício"; setTimeout(()=>{const f=$("#res-pw"); if (f) f.focus();},50); return; }
    if (cyrb($("#res-pw").value.trim()) !== SENHA_H){ $("#res-erro").hidden = false; $("#res-pw").value = ""; return; }
    try { localStorage.removeItem(ST_KEY); } catch(e){}
    S = null; limpaTick(); $("#veu-rush").hidden = true; atualizaAlertas(); fechaVeu(); telaInicio(); abre("#tab-qz","#p-qz");
  };
  $("#res-reini").onclick = reinicia;
  $("#res-pw").onkeydown = e => { if (e.key === "Enter") reinicia(); };
}
S = carrega();
atualizaAlertas();
if (S) mostra(); else telaInicio();
if (S && emQuiz()) retomada();
})();
</script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Quiz: Conflito de Gerações</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap');

        :root {
            --bg-color: #3b1070;
            --red: #e21b3c;
            --blue: #1368ce;
            --yellow: #d89e00;
            --green: #26890c;
            --correct-green: #28c745;
            --text-light: #ffffff;
            --text-dark: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #2a0845 0%, #6441A5 100%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            height: 60px;
        }

        .question-counter {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .feedback-badge {
            background-color: var(--correct-green);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 800;
            opacity: 0;
            transition: opacity 0.3s ease;
            box-shadow: 0 4px 15px rgba(40, 199, 69, 0.5);
        }

        .feedback-badge.show {
            opacity: 1;
        }
        
        .feedback-badge.wrong {
            background-color: var(--red);
            box-shadow: 0 4px 15px rgba(226, 27, 60, 0.5);
        }

        /* QUESTION CONTAINER */
        .question-container {
            background-color: #ffffff;
            color: var(--text-dark);
            margin: 0 40px;
            padding: 30px 40px;
            border-radius: 12px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        /* TIMER BAR (Relógio Visual Oculto) */
        .timer-container {
            margin: 15px 40px 0;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background-color: var(--yellow);
            width: 100%;
            transition: width 1s linear;
        }

        /* OPTIONS GRID */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 15px;
            margin: 20px 40px 40px; /* Margem inferior expandida pela ausência do rodapé */
            flex-grow: 1;
        }

        .option-btn {
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Montserrat', sans-serif;
            font-size: 22px;
            font-weight: 700;
            padding: 20px 20px 20px 60px;
            cursor: pointer;
            position: relative;
            text-align: left;
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            line-height: 1.3;
            display: flex;
            align-items: center;
        }

        .option-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        .opt-0 { background-color: var(--red); }
        .opt-1 { background-color: var(--blue); }
        .opt-2 { background-color: var(--yellow); }
        .opt-3 { background-color: var(--green); }

        .opt-0:hover { background-color: #f02a4b; }
        .opt-1:hover { background-color: #1c7bed; }
        .opt-2:hover { background-color: #f0b207; }
        .opt-3:hover { background-color: #2ea610; }

        /* SHAPES */
        .shape {
            position: absolute;
            left: 20px;
            width: 30px;
            height: 30px;
            background-color: white;
        }
        
        .shape-0 { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }
        .shape-1 { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); }
        .shape-2 { border-radius: 50%; }
        .shape-3 { border-radius: 4px; }

        /* ANSWER REVEAL STATES */
        .options-grid.answered .option-btn {
            cursor: default;
            pointer-events: none;
            opacity: 0.4;
            transform: scale(0.98);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        .options-grid.answered .option-btn.correct {
            opacity: 1;
            background-color: var(--correct-green);
            transform: scale(1.02);
            border: 4px solid white;
            box-shadow: 0 0 20px rgba(40, 199, 69, 0.8);
            z-index: 10;
        }

        .options-grid.answered .option-btn.wrong-selected {
            opacity: 0.8;
            border: 4px solid #ff4444;
        }

        .correct-tooltip {
            position: absolute;
            top: -15px;
            right: 10px;
            background: white;
            color: var(--correct-green);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .options-grid.answered .option-btn.correct .correct-tooltip {
            display: block;
        }

        /* SCORE SCREEN */
        #score-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        
        .trophy { font-size: 100px; margin-bottom: 20px; }
        .score-text { font-size: 40px; font-weight: 800; margin-bottom: 10px; }
        .score-sub { font-size: 24px; color: #ddd; margin-bottom: 40px; }
        .nav-btn {
            background-color: white;
            color: var(--bg-color);
            border: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 700;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .nav-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

                answer: 1

                options: [

            {
                q: "Por que as denominações das gerações (X, Y, Z) são importantes para o estudo sociológico?",
                options: [

                    "São usadas pelos governos para decidir quem pode votar nas eleições.",
                    "Definem com precisão matemática a personalidade de cada indivíduo."
                ],
                answer: 1
            },
            {
                q: "Se um pai da Geração X exige que o filho estude através de livros físicos, e o filho prefere videoaulas, a solução ideal é:",
                options: [
                    "O filho rasgar os livros para mostrar que a tecnologia venceu.",
                    "O pai confiscar o computador até o filho ler a biblioteca inteira.",
                    "Ambos reconhecerem que os dois métodos podem ser complementares.",
                    "O professor decidir qual dos dois está completamente errado na história."
                ],
                answer: 2
            },
            {
                q: "Qual é a principal consequência social positiva da diminuição do etarismo?",
                options: [
                    "Maior integração e aproveitamento da sabedoria das pessoas mais velhas.",
                    "Diminuição imediata da necessidade de hospitais para a terceira idade.",
                    "Aumento do número de idosos abandonados em asilos e casas de repouso.",
                    "Obrigatoriedade de os jovens trabalharem de graça para os mais velhos."
                ],
                answer: 0
            },
            {
                q: "Marta acha que seu pai 'trabalha demais e vive de menos'. O pai acha que Marta 'quer tudo fácil e não se esforça'. Esse é um choque clássico de:",
                options: [
                    "Prioridades de vida, onde estabilidade confronta o bem-estar mental.",
                    "Tecnologia, já que ambos não sabem utilizar planilhas financeiras.",
                    "Linguagem, visto que eles usam dialetos completamente diferentes.",
                    "Política, onde diferentes partidos governam as atitudes em casa."
                ],
                answer: 0
            },
            {
                q: "Para finalizar a discussão sobre gerações, qual afirmação resume o aprendizado sobre o convívio intergeracional?",
                options: [
                    "A tecnologia destruiu todas as pontes possíveis entre jovens e adultos.",
                    "O respeito mútuo surge quando reconhecemos que todos têm valor histórico.",
                    "As gerações mais antigas devem ceder totalmente espaço aos nativos digitais.",
                    "O conflito só terminará quando as pessoas passarem a pensar de forma igual."
                ],
                answer: 1

        ];

        let currentQuestion = 0;
        let score = 0;
        let hasAnswered = false;
        let questionTimer;
        let timeRemaining;
        
        const qCounter = document.getElementById('q-counter');
        const qText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const feedbackBadge = document.getElementById('feedback-badge');
        const timerBar = document.getElementById('timer-bar');
        const quizScreen = document.getElementById('quiz-screen');
        const scoreScreen = document.getElementById('score-screen');

        /* FUNÇÃO DO RELÓGIO OCULTO (Ajusta o tempo com base no horário das aulas) */
        function calculateTimeForQuestion() {
            const now = new Date();
            const currentMinutes = (now.getHours() * 60) + now.getMinutes();
            const remainingQuestions = questions.length - currentQuestion;
            
            let targetMinutes = 0;
            let subtractInterval = 0;

            // Aula 1: 07:00 (420) até 08:40 (520) -> Encerramento alvo 10 min antes: 08:30 (510)
            if (currentMinutes >= 420 && currentMinutes < 520) {
                targetMinutes = 510;
            }
            // Aula 2: 08:40 (520) até 10:40 (640) -> Encerramento alvo 10 min antes: 10:30 (630)
            // Intervalo das 09:30 (570) as 09:50 (590)
            else if (currentMinutes >= 520 && currentMinutes < 640) {
                targetMinutes = 630;
                if (currentMinutes < 570) {
                    subtractInterval = 20; // O intervalo de 20 minutos ainda vai acontecer durante o bloco
                }
            }
            // Aula 3: 10:40 (640) até 12:20 (740) -> Encerramento alvo 10 min antes: 12:10 (730)
            else if (currentMinutes >= 640 && currentMinutes <= 740) {
                targetMinutes = 730;
            } else {
                // Caso o arquivo seja aberto fora do horário de aula (ex: testes em casa ou à noite)
                return 15; // Retorna 15 segundos padrão
            }

            let totalRemainingMinutes = targetMinutes - currentMinutes - subtractInterval;

            if (totalRemainingMinutes <= 0) {
                return 8; // Se já passou do tempo alvo (ou está nos 10 min finais), acelera para 8s/questão
            }

            let totalRemainingSeconds = (totalRemainingMinutes * 60) - now.getSeconds();
            let secondsPerQuestion = Math.floor(totalRemainingSeconds / remainingQuestions);

            // Limites de sanidade para garantir que a questão seja legível
            if (secondsPerQuestion < 8) secondsPerQuestion = 8;
            if (secondsPerQuestion > 45) secondsPerQuestion = 45; // Evita tempo ocioso demais

            return secondsPerQuestion;
        }

        function startTimer() {
            clearInterval(questionTimer);
            let totalTime = calculateTimeForQuestion();
            timeRemaining = totalTime;
            
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';
            
            // Força reflow
            void timerBar.offsetWidth;
            
            timerBar.style.transition = 'width 1s linear';

            questionTimer = setInterval(() => {
                timeRemaining--;
                let percentage = (timeRemaining / totalTime) * 100;
                timerBar.style.width = percentage + '%';

                if (timeRemaining <= 0) {
                    clearInterval(questionTimer);
                    autoRevealAnswer();
                }
            }, 1000);
        }

        function loadQuestion(index) {
            hasAnswered = false;
            optionsGrid.classList.remove('answered');
            feedbackBadge.classList.remove('show', 'wrong');
            
            const q = questions[index];
            qCounter.innerText = `QUESTÃO ${index + 1} DE ${questions.length}`;
            qText.innerText = q.q;

            for (let i = 0; i < 4; i++) {
                const btn = document.querySelector(`.opt-${i}`);
                btn.classList.remove('correct', 'wrong-selected');
                document.getElementById(`opt-text-${i}`).innerText = q.options[i];
            }

            startTimer();
        }

        function checkAnswer(selectedIndex) {
            if (hasAnswered) return;
            hasAnswered = true;
            clearInterval(questionTimer);
            optionsGrid.classList.add('answered');

            const correctIndex = questions[currentQuestion].answer;
            const correctBtn = document.querySelector(`.opt-${correctIndex}`);
            correctBtn.classList.add('correct');

            if (selectedIndex === correctIndex) {
                feedbackBadge.innerText = '✓ RESPOSTA CORRETA!';
                feedbackBadge.classList.remove('wrong');
                feedbackBadge.classList.add('show');
                score++;
            } else {
                const wrongBtn = document.querySelector(`.opt-${selectedIndex}`);
                wrongBtn.classList.add('wrong-selected');
                feedbackBadge.innerText = '✗ RESPOSTA INCORRETA';
                feedbackBadge.classList.add('wrong', 'show');
            }

            // Avanço automático após 4 segundos de revelação
            setTimeout(nextQuestion, 4000);
        }

        function autoRevealAnswer() {
            if (hasAnswered) return;
            hasAnswered = true;
            optionsGrid.classList.add('answered');

            const correctIndex = questions[currentQuestion].answer;
            document.querySelector(`.opt-${correctIndex}`).classList.add('correct');
            
            feedbackBadge.innerText = 'TEMPO ESGOTADO!';
            feedbackBadge.classList.add('wrong', 'show');

            // Avanço automático
            setTimeout(nextQuestion, 4000);
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                showScore();
            }
        }

        function showScore() {
            quizScreen.style.display = 'none';
            scoreScreen.style.display = 'flex';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            scoreScreen.style.display = 'none';
            quizScreen.style.display = 'flex';
            loadQuestion(0);
        }

        // Init
        loadQuestion(0);
    </script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filosofia e Ciência</title>
<style>
:root{
  --bg:#fbf7f2; --surface:#ffffff; --surface2:#fdf1e7; --text:#1f1f1f; --muted:#5d5752;
  --brand:#7a3e12; --accent:#c8611e; --accent-soft:#f4d9c4; --border:#e3d6cb;
  --ok:#1f7a3f; --ok-bg:#e3f4e8; --err:#b3261e; --err-bg:#fbe4e2; --warn:#8a5a00; --warn-bg:#fff3d6;
  --shadow:0 1px 3px rgba(60,30,10,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16120f; --surface:#211b17; --surface2:#2c221b; --text:#efe8e2; --muted:#b5aaa1;
    --brand:#f0a56c; --accent:#e88a45; --accent-soft:#4a3020; --border:#3d322a;
    --ok:#7fd59a; --ok-bg:#183323; --err:#ff9c94; --err-bg:#3d1c1a; --warn:#ffd27a; --warn-bg:#3a2c10; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16120f; --surface:#211b17; --surface2:#2c221b; --text:#efe8e2; --muted:#b5aaa1;
  --brand:#f0a56c; --accent:#e88a45; --accent-soft:#4a3020; --border:#3d322a;
  --ok:#7fd59a; --ok-bg:#183323; --err:#ff9c94; --err-bg:#3d1c1a; --warn:#ffd27a; --warn-bg:#3a2c10; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
p,li,td,dd{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header.topo{background:var(--surface);border-bottom:3px solid var(--accent);box-shadow:var(--shadow)}
header.topo .wrap{padding-top:18px;padding-bottom:16px}
.linha-sup{display:flex;justify-content:space-between;align-items:center;gap:12px}
.selo{font-size:.78rem;font-weight:700;letter-spacing:.06em;color:var(--accent);text-transform:uppercase}
h1.titulo{margin:6px 0 4px;color:var(--brand);font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.2}
.sub{margin:0 0 10px;color:var(--muted)}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.93rem}
.meta dt{font-weight:700;color:var(--brand)}
.meta dd{margin:0}
.meta ul{margin:0;padding-left:18px}
.downloads{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
#tema{border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer;white-space:nowrap}
nav.abas{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--border)}
nav.abas .wrap{display:flex;gap:6px;padding-top:8px;align-items:flex-end}
nav.abas button{flex:1;max-width:220px;border:1px solid var(--border);border-bottom:none;background:var(--surface2);color:var(--muted);padding:10px 14px;border-radius:10px 10px 0 0;font:inherit;font-weight:600;cursor:pointer}
nav.abas button[aria-selected="true"]{background:var(--surface);color:var(--brand);border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
#alertas{margin-left:auto;align-self:center;font-size:.82rem;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);border-radius:999px;padding:3px 10px;white-space:nowrap}
main{padding:20px 0 40px}
.painel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:clamp(16px,4vw,32px);box-shadow:var(--shadow)}
.btn{border:none;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--surface2);color:var(--brand);border:1px solid var(--border)}
#apostila h2{color:var(--brand);font-size:1.45rem;margin:2em 0 .5em;padding-bottom:.25em;border-bottom:2px solid var(--accent-soft);scroll-margin-top:70px}
#apostila h2:first-child{margin-top:0}
#apostila h3{color:var(--accent);font-size:1.1rem;margin:1.4em 0 .4em}
#apostila ul{padding-left:22px}
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--border);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top;text-align:left}
th{background:var(--accent-soft);font-weight:700}
tr:last-child td{border-bottom:none}
td+td,th+th{border-left:1px solid var(--border)}
.tw.larga table{min-width:680px}
aside.lembrar{margin:20px 0;background:var(--surface2);border:1px solid var(--accent);border-left:6px solid var(--accent);border-radius:10px;padding:12px 16px}
aside.lembrar strong.rot{display:block;font-size:.78rem;letter-spacing:.08em;color:var(--brand);margin-bottom:4px}
aside.lembrar p{margin:0}
dl.glos dt{font-weight:700;color:var(--brand);margin-top:10px}
dl.glos dd{margin:2px 0 0}
/* quiz */
label.campo{display:block;font-weight:600;margin:12px 0 4px}
input.txt{width:100%;font:inherit;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text)}
.regras{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 16px 12px 34px;margin:14px 0}
.regras li{margin:4px 0}
.qtopo{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.qtopo b{color:var(--text)}
.progresso{height:10px;background:var(--surface2);border:1px solid var(--border);border-radius:999px;overflow:hidden;margin-bottom:20px}
.progresso div{height:100%;width:0;background:var(--accent);transition:width .3s}
.qnum{color:var(--accent);font-weight:800;letter-spacing:.05em;font-size:.85rem}
.qcomando{font-weight:700}
.leitura{font-size:.88rem;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:6px 10px;margin:10px 0}
.alts{display:flex;flex-direction:column;gap:10px;margin:16px 0}
.alt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer}
.alt:hover:not(:disabled){border-color:var(--accent);background:var(--surface2)}
.alt:disabled{cursor:default;opacity:.75}
.alt.sel{border-color:var(--accent);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--accent);opacity:1}
.alt .le{font-weight:800;min-width:1.6em}
.alt span.tx{flex:1;text-align:justify}
.alt.certa{border-color:var(--ok);background:var(--ok-bg);opacity:1}
.alt.errada{border-color:var(--err);background:var(--err-bg);opacity:1}
.feedback{border-radius:10px;padding:12px 16px;margin-bottom:14px}
.feedback.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.feedback.no{background:var(--err-bg);border:1px solid var(--err)}
.feedback strong{display:block;margin-bottom:4px}
.feedback.ok strong{color:var(--ok)} .feedback.no strong{color:var(--err)}
.feedback p{margin:4px 0 0}
.pausa{border:1px dashed var(--accent);border-radius:10px;padding:12px 16px;margin-bottom:14px;background:var(--surface2)}
.nav-q{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.nota{font-size:3.2rem;font-weight:800;color:var(--brand);margin:6px 0;text-align:center}
.centro{text-align:center}
.ok-t{color:var(--ok);font-weight:700} .no-t{color:var(--err);font-weight:700}
.codigo{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.1rem;font-weight:700;letter-spacing:.08em}
footer{padding:0 0 40px;text-align:center}
footer button{background:none;border:none;color:var(--muted);font:inherit;font-size:.82rem;text-decoration:underline;cursor:pointer}
/* sobreposições */
.veu{position:fixed;inset:0;z-index:50;background:rgba(20,10,5,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.veu .caixa{background:var(--surface);color:var(--text);border-radius:14px;max-width:560px;width:100%;padding:24px;border:2px solid var(--accent);max-height:90vh;overflow:auto}
.veu .caixa h2{margin-top:0;color:var(--brand)}
.prof table{font-size:.85rem}
.chip-guard{align-self:center;font-size:.78rem;font-weight:700;color:var(--warn);background:var(--warn-bg);border:2px solid var(--warn);border-radius:999px;padding:3px 10px;white-space:nowrap}
#chip-guard:not([hidden])+#alertas{margin-left:8px}
#chip-guard:not([hidden]){margin-left:auto}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.pill.erro{color:var(--err);border-color:var(--err);background:var(--err-bg)}
.pill.bom{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.alerta{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.pill.ruim{color:#fff;border-color:var(--err);background:var(--err)}
.retorno{display:inline-block;margin-left:8px;font-size:.72rem;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);border-radius:999px;padding:0 8px;vertical-align:middle}
.leitura.pausado{color:var(--muted);background:var(--surface2);border-color:var(--border)}
.ritmo{font-size:.85rem;margin-top:6px!important}
.prof-dica{margin-top:8px!important;padding:8px 12px;border-radius:8px;background:var(--warn-bg);border:1px solid var(--warn)}
.veu.rush{z-index:60}
.veu.rush .caixa{text-align:center}
.rush-tag{display:inline-block;font-size:.8rem;font-weight:800;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);border-radius:999px;padding:3px 12px}
.veu.rush p{text-align:left}
.veu blockquote{margin:14px 0;padding:12px 16px;border-left:5px solid var(--accent);background:var(--surface2);border-radius:8px;text-align:left;font-style:italic}
.veu blockquote span{display:block;margin-top:6px;font-size:.8rem;font-style:normal;color:var(--muted)}
.rush-num{font-size:3rem;font-weight:800;color:var(--brand);margin:6px 0}
.diag{border-radius:10px;padding:10px 14px;margin:14px 0;font-weight:600}
.diag.ok{background:var(--ok-bg);border:1px solid var(--ok);color:var(--ok)}
.diag.alerta{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn)}
.diag.ruim{background:var(--err-bg);border:1px solid var(--err);color:var(--err)}
h3.rel-h{color:var(--accent);margin:18px 0 0;font-size:1rem}
.tstatus{display:inline-block;border-radius:999px;padding:5px 14px;font-weight:800;font-size:.85rem;margin-bottom:12px}
.tstatus.on{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok)}
.tstatus.off{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.perigo{background:var(--err)}
.btn.bom{background:var(--ok)}
.tnota{font-size:.86rem;color:var(--muted)}
.gstats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.gstats div{flex:1;min-width:70px;text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px}
.gstats b{display:block;font-size:1.3rem;color:var(--brand)}
.gstats span{font-size:.75rem;color:var(--muted)}
.gcard{border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:14px 0;background:var(--surface)}
.ghead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.gnum{font-weight:800;color:var(--accent)}
.gtag{font-size:.78rem;background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.gresp{margin-left:auto;font-weight:800;color:var(--ok)}
.gopt{border:1px solid var(--border);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.92rem}
.gopt.certa{border-color:var(--ok);background:var(--ok-bg)}
.gexp{margin-top:8px;font-size:.9rem;background:var(--surface2);border-radius:8px;padding:8px 12px}
@media (max-width:560px){.tgrid{grid-template-columns:1fr}.pills{order:3;width:100%}}
.arr-txt{line-height:2.3}
.lac{display:inline-flex;align-items:center;gap:6px;min-width:9em;min-height:2em;vertical-align:middle;margin:0 3px;padding:1px 10px 1px 4px;border:2px dashed var(--accent);border-radius:8px;background:var(--surface2);cursor:pointer;line-height:1.3}
.lac-n{display:inline-block;min-width:1.5em;text-align:center;font-size:.75rem;font-weight:800;color:#fff;background:var(--accent);border-radius:999px}
.lac-v{font-weight:700;color:var(--brand)}
.lac.cheia{border-style:solid}
.lac.alvo{box-shadow:0 0 0 3px var(--accent-soft)}
.lac.sobre{background:var(--accent-soft);border-color:var(--brand)}
.lac.certa{border-color:var(--ok);background:var(--ok-bg)} .lac.certa .lac-n{background:var(--ok)}
.lac.errada{border-color:var(--err);background:var(--err-bg)} .lac.errada .lac-n{background:var(--err)}
.banco-rot{font-size:.8rem;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:14px}
.banco{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface2)}
.chip{border:1.5px solid var(--accent);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 16px;font:inherit;font-weight:600;cursor:grab;touch-action:none}
.chip:disabled{cursor:default;opacity:.55}
.chip.sel{background:var(--accent);color:#fff}
.chip.usada{opacity:.3;border-style:dashed}
.chip.arrastando{opacity:.4}
.chip.fantasma{position:fixed;z-index:70;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);background:var(--accent);color:#fff;cursor:grabbing}
[hidden]{display:none!important}
@media (max-width:560px){
  body{font-size:15px}
  .meta{grid-template-columns:1fr}
  .meta dt{margin-top:6px}
  #alertas{display:none}
}

</style>
</head>
<body>
<header class="topo">
  <div class="wrap">
    <div class="linha-sup">
      <div class="selo" id="selo"></div>
      <button id="tema" type="button" aria-label="Alternar modo claro e escuro">◐ Tema</button>
    </div>
    <h1 class="titulo" id="titulo"></h1>
    <p class="sub">Elaborado por Marcos Cesana - Direito & Filosofia</p>
    <dl class="meta" id="meta"></dl>
    <div class="downloads">
      <button class="btn" id="dl-ap" type="button">⬇ Apostila em PDF</button>
      <button class="btn" id="dl-qz" type="button">⬇ Quiz em PDF</button>
    </div>
  </div>
</header>
<nav class="abas"><div class="wrap" role="tablist">
  <button role="tab" id="tab-ap" aria-controls="p-ap" aria-selected="true">Apostila</button>
  <button role="tab" id="tab-qz" aria-controls="p-qz" aria-selected="false">Quiz</button>
  <button role="tab" id="tab-rel" aria-controls="p-rel" aria-selected="false">Relatório</button>
  <span id="chip-guard" class="chip-guard" hidden>Modo professor: travas desativadas</span>
  <span id="alertas" hidden></span>
</div></nav>
<main class="wrap">
  <section id="p-ap" role="tabpanel" aria-labelledby="tab-ap" class="painel"><article id="apostila"></article></section>
  <section id="p-qz" role="tabpanel" aria-labelledby="tab-qz" class="painel" hidden><div id="q-area"></div></section>
  <section id="p-rel" role="tabpanel" aria-labelledby="tab-rel" class="painel" hidden><div id="rel-area"></div></section>
</main>
<footer><button id="btn-prof" type="button">Área do professor</button></footer>
<div class="veu" id="veu" hidden><div class="caixa" id="veu-caixa"></div></div>
<div class="veu rush" id="veu-rush" hidden><div class="caixa"></div></div>

<script>
const DATA = {"cab":{"componente":"Filosofia","serie":"1ª série – 3º trimestre","titulo":"Filosofia e Ciência: método, paradigma e neutralidade","objetos":["Ciência e técnica","Filosofia e Ciência / Filosofia da Ciência","Método","Verificação","Paradigma","Crise de paradigma","A ciência como produção social","Neutralidade científica"],"objetivo":"Compreender como a Filosofia pensa a ciência, os critérios que distinguem o conhecimento científico da simples opinião e a ciência como produção social, para avaliar de forma crítica o uso da ciência e da técnica na sociedade atual."},"conteudo":[["h1","Apresentação"],["p","Todos os dias recebemos informações que dizem vir “da ciência”: no grupo da família, nas propagandas, nos vídeos de influenciadores. Algumas foram testadas com cuidado; outras são só opiniões repetidas com muita segurança. Como saber a diferença? E quem decide o que é pesquisado, com que dinheiro e para quê?"],["p","Nesta apostila, você vai estudar como a Filosofia pensa a ciência: a diferença entre opinião e conhecimento, a relação entre ciência e técnica, o método científico, os critérios de **verificação** e de **falseabilidade**, as ideias de **paradigma** e de **crise de paradigma**, e a ciência como **produção social**, que não está livre de valores e interesses. No fim, há um quadro-resumo e um glossário."],["h1","1. Filosofia e ciência: opinião, conhecimento e saber-fazer"],["h2","1.1 Por que a Filosofia pensa a ciência"],["p","Na Grécia Antiga, Filosofia e ciência nasceram juntas. Os primeiros filósofos queriam explicar a natureza por meio da razão, sem recorrer apenas aos mitos. Com o tempo, ciências como a Física, a Química e a Biologia ganharam métodos próprios. A Filosofia continuou fazendo perguntas sobre elas: o que torna um conhecimento científico? Como uma teoria é aceita ou abandonada? A ciência é neutra? Esse campo de estudo se chama **Filosofia da Ciência**."],["h2","1.2 Doxa e episteme (Platão)"],["p","O filósofo grego **Platão** (c. 428–348 a.C.) distinguiu dois modos de pensar:"],["ul",["**Doxa**: a opinião, a crença que a pessoa tem sem conseguir justificar. Pode até estar certa por acaso, mas não se apoia em razões. Frases como “todo mundo sabe”, “sempre ouvi dizer” ou “eu sinto que é assim” costumam indicar doxa.","**Episteme**: o conhecimento verdadeiro e justificado, apoiado em razões, demonstrações e provas. Quem tem episteme consegue explicar **por que** algo é assim."]],["p","Para Platão, a doxa muda com o gosto e o costume, enquanto a episteme se sustenta diante das perguntas. O que transforma uma afirmação em conhecimento são as razões apresentadas, e não a certeza de quem fala. Hoje, essa distinção ajuda a analisar boatos e notícias falsas que circulam nas redes."],["h2","1.3 Techné (Aristóteles)"],["p","**Aristóteles** (384–322 a.C.), aluno de Platão, chamou de **techné** o saber-fazer voltado a produzir algo: a arte do artesão, do construtor, do médico. A techné se aprende sobretudo na prática, com quem já domina o ofício, e se mostra no resultado: o muro levantado, a panela modelada, o remédio preparado. Um exemplo capixaba são as **paneleiras de Goiabeiras**, em Vitória, que aprendem com as mais velhas a fazer as panelas de barro, um saber reconhecido como patrimônio cultural do Brasil."],["box","Doxa é opinião sem justificativa; episteme é conhecimento apoiado em razões e provas (Platão). Techné é o saber-fazer prático, voltado a produzir algo (Aristóteles)."],["h1","2. Ciência e técnica"],["h2","2.1 Francis Bacon: “saber é poder”"],["p","O filósofo inglês **Francis Bacon** (1561–1626) viveu no início da ciência moderna. Ele criticava quem buscava a verdade só nos textos dos sábios antigos e defendia a observação e a experiência. Sua ideia mais conhecida é resumida na expressão **“saber é poder”**: conhecer as causas dos fenômenos permite **controlar e usar a natureza** em benefício dos seres humanos. Para Bacon, o objetivo principal da ciência é o **domínio da natureza**."],["p","Essa ideia está viva hoje. No Espírito Santo, pesquisadores do Incaper desenvolvem variedades de café conilon mais produtivas e resistentes à seca. Drones, sensores e sementes de laboratório são exemplos de como conhecer a natureza aumenta o poder de transformá-la."],["h2","2.2 Técnica e tecnologia"],["p","A **técnica** é o conjunto de procedimentos usados para produzir ou transformar algo. Quando a técnica passa a se apoiar no conhecimento científico, falamos em **tecnologia**. Ciência e técnica caminham juntas: a ciência explica, a técnica aplica, e novas técnicas, como microscópios e computadores, permitem novas descobertas."],["h2","2.3 A Escola de Frankfurt e a razão instrumental"],["p","No século XX, filósofos alemães da chamada **Escola de Frankfurt**, como **Max Horkheimer** e **Theodor Adorno**, autores de _Dialética do esclarecimento_ (1947), fizeram uma crítica a essa forma de pensar. Eles chamaram de **razão instrumental** o tipo de razão que busca apenas os **meios mais eficientes** para alcançar um resultado (mais lucro, mais produção, mais velocidade), **sem discutir os fins**, isto é, sem perguntar se aquilo é justo ou faz bem às pessoas."],["p","Um algoritmo que calcula a rota mais rápida de entrega e pune o entregador que atrasa, sem considerar jornadas de 12 horas, é um exemplo de razão instrumental. O mesmo vale para um aplicativo que envia notificações de madrugada só para aumentar o tempo de tela e a venda de anúncios."],["box","Para Bacon, saber é poder: conhecer a natureza permite dominá-la. Para Horkheimer e Adorno, a razão instrumental busca só a eficiência dos meios e deixa de discutir os fins."],["h1","3. Método"],["h2","3.1 O que é método científico"],["p","**Método** quer dizer “caminho”. O método científico é o conjunto de procedimentos que os cientistas usam para investigar um problema de forma organizada e que outras pessoas possam conferir. De modo simplificado, ele envolve:"],["ul",["**Observação** de um fenômeno e formulação de um problema;","**Hipótese**: uma explicação provisória que pode ser testada;","**Experimentação** ou coleta de dados para testar a hipótese;","**Análise dos resultados** e conclusão, que é comunicada a outros cientistas."]],["h2","3.2 Indução e o problema da indução"],["p","Bacon defendia o **método indutivo**: partir de muitas observações particulares para chegar a uma lei geral. O filósofo escocês **David Hume** (1711–1776) apontou o **problema da indução**: por mais casos que observemos, nada garante logicamente que o próximo caso será igual. Ver mil cisnes brancos não prova que todos os cisnes são brancos; basta um cisne negro, como os que existem na Austrália, para mostrar que a afirmação geral é falsa."],["box","Método é o caminho organizado da investigação: observação, hipótese, experimento e conclusão. O problema da indução mostra que muitas observações iguais não garantem uma lei geral."],["h1","4. Verificação e falseabilidade"],["h2","4.1 O critério de verificação"],["p","No início do século XX, um grupo de filósofos e cientistas conhecido como **Círculo de Viena** propôs o **critério de verificação**: uma afirmação só teria sentido científico se pudesse ser confirmada pela experiência, por meio da observação. Quanto mais observações confirmassem uma teoria, mais segura ela seria."],["h2","4.2 Karl Popper e a falseabilidade"],["p","O filósofo austríaco **Karl Popper** (1902–1994), autor de _A lógica da pesquisa científica_ (1934), criticou essa ideia por causa do problema da indução: confirmações nunca provam uma teoria de vez. Para Popper, o que torna uma teoria científica é a **falseabilidade**: ela precisa poder ser testada e, em princípio, **mostrada falsa** por algum resultado possível. Uma teoria científica “se arrisca”: diz o que **não** deve acontecer se ela for verdadeira."],["p","Afirmações que explicam qualquer resultado, dê certo ou dê errado, não podem ser refutadas e por isso não são científicas. É o caso do horóscopo que promete “dias de desafios e de oportunidades” ou de cursos que dizem: “se deu certo, foi a força do pensamento; se não deu, você não mentalizou o bastante”. Popper chamava esse tipo de saber de **pseudociência**: parece ciência, mas foge de qualquer teste."],["tb",["Critério","Quem defendeu","O que exige de uma teoria"],[["Verificação","Círculo de Viena","Ser confirmada pela observação e pela experiência."],["Falseabilidade","Karl Popper","Poder ser testada e mostrada falsa por algum resultado possível."]],[2400,2600,4638]],["box","Para Popper, uma teoria é científica quando é falseável: algum resultado possível poderia mostrar que ela está errada. O que explica qualquer resultado não é ciência."],["h1","5. Paradigma e ciência normal"],["h2","5.1 Thomas Kuhn e o paradigma"],["p","O físico e filósofo norte-americano **Thomas Kuhn** (1922–1996) estudou a história da ciência no livro _A estrutura das revoluções científicas_ (1962). Ele mostrou que os cientistas trabalham dentro de um **paradigma**: um **modelo compartilhado** por uma comunidade científica, que reúne teorias aceitas, métodos, problemas considerados importantes e exemplos de soluções. O paradigma aparece nos livros didáticos, nos exercícios e nas aulas práticas."],["p","A **teoria dos germes**, segundo a qual muitas doenças são causadas por microrganismos, é o paradigma da Medicina atual: orienta a higiene nos hospitais, a esterilização dos instrumentos e a pesquisa de vacinas. A **teoria da evolução** cumpre esse papel na Biologia."],["h2","5.2 Ciência normal e anomalias"],["p","Kuhn chama de **ciência normal** o período em que os cientistas resolvem problemas usando as regras do paradigma, **sem questioná-lo**. Às vezes surge uma **anomalia**: um fato que o paradigma não consegue explicar. No começo, as anomalias costumam ser tratadas como erro de medição ou como um problema a resolver mais tarde. Foi o que aconteceu com um pequeno desvio na órbita do planeta Mercúrio, que a física de Newton não explicava."],["box","Paradigma é o modelo compartilhado por uma comunidade científica. Na ciência normal, os cientistas resolvem problemas sem questionar o paradigma. Anomalia é um fato que o paradigma não consegue explicar."],["h1","6. Crise de paradigma e revolução científica"],["h2","6.1 A crise"],["p","Quando as anomalias se acumulam e resistem às tentativas de solução, a comunidade entra em **crise de paradigma**. Surgem versões rivais da teoria, cresce a insegurança e os cientistas passam a discutir os **fundamentos**, as bases do próprio paradigma. Antes de Copérnico, a astronomia que colocava a Terra parada no centro do universo precisava de cada vez mais ajustes para prever o movimento dos planetas, e as versões do modelo se multiplicavam sem funcionar bem."],["h2","6.2 A revolução científica"],["p","A crise termina com uma **revolução científica**: a comunidade abandona o antigo paradigma e adota um novo, que muda a forma de ver o mundo. Exemplos:"],["ul",["Do modelo com a Terra no centro ao modelo com o Sol no centro (Copérnico, século XVI);","Da química do “flogisto” à química do oxigênio, de Lavoisier (século XVIII);","Da física de Newton à teoria da relatividade de Einstein (1915), que explicou a órbita de Mercúrio e mudou as ideias de espaço e de tempo."]],["p","Para Kuhn, a ciência avança somando descobertas e também por meio de rupturas. Depois da revolução, começa um novo período de ciência normal."],["tb",["Etapa","O que acontece"],[["Ciência normal","Os cientistas resolvem problemas dentro do paradigma, sem questioná-lo."],["Anomalia","Aparece um fato que o paradigma não explica."],["Crise de paradigma","As anomalias se acumulam, surgem versões rivais e se debatem os fundamentos."],["Revolução científica","Um novo paradigma substitui o antigo."]],[2800,6838]],["box","Crise de paradigma é o momento em que as anomalias se acumulam e os fundamentos da teoria passam a ser discutidos. A revolução científica é a troca de um paradigma por outro."],["h1","7. A ciência como produção social"],["h2","7.1 Ciência é trabalho coletivo"],["p","A imagem do **gênio isolado**, que descobre tudo sozinho no laboratório, não corresponde à ciência real. A ciência é uma **atividade coletiva**: depende de universidades, institutos de pesquisa, financiamento, equipamentos e de muitas pessoas trabalhando juntas. As vacinas da covid-19 produzidas no Brasil pelo **Instituto Butantan** e pela **Fiocruz** dependeram de dinheiro público, de pesquisadores formados em universidades públicas e de milhares de voluntários."],["h2","7.2 Como a comunidade científica controla seus resultados"],["p","O sociólogo **Robert Merton** (1910–2003) descreveu valores que orientam a comunidade científica. Entre eles estão o **universalismo** (um resultado é julgado pelas provas, e não por quem o apresentou) e o **ceticismo organizado** (toda afirmação deve ser examinada e criticada pelos colegas antes de ser aceita)."],["p","Um mecanismo importante é a **revisão por pares**: antes de um estudo ser publicado numa revista científica, outros especialistas o avaliam, apontam erros e pedem correções. Por isso, um estudo que circula nas redes como “comprovado”, sem ter passado por essa avaliação, merece desconfiança."],["box","A ciência é uma produção social e coletiva: depende de instituições, dinheiro e muitas pessoas. A revisão por pares é a avaliação de um estudo por outros especialistas antes da publicação."],["h1","8. Neutralidade científica"],["h2","8.1 A ciência é neutra?"],["p","A ideia de **neutralidade científica** afirma que a ciência e a técnica seriam produzidas livres de valores e interesses, apenas em busca da verdade. Muitos filósofos mostram os **limites** dessa ideia: as pesquisas são feitas por pessoas, dentro da sociedade, e sofrem influência de quem as financia, das escolhas dos pesquisadores e dos valores de cada época. Reconhecer esses limites ajuda a exigir transparência e controle público sobre as pesquisas."],["h2","8.2 Conflito de interesses"],["p","Há **conflito de interesses** quando quem financia a pesquisa tem interesse no resultado e pode influenciar o que é produzido. Durante décadas, empresas de cigarro pagaram pesquisas para convencer as pessoas de que o fumo talvez não causasse câncer, embora já soubessem dos riscos. Hoje, grandes empresas de tecnologia investem bilhões em inteligências artificiais de código fechado, chamadas de proprietárias: elas decidem quais dados usar, o que priorizar e o que o público pode saber, e pesquisadores de fora têm dificuldade para examinar esses sistemas."],["h2","8.3 Escolhas humanas dentro da tecnologia"],["p","A tecnologia também carrega as escolhas de quem a produz. Câmeras de **reconhecimento facial** usadas na segurança pública erram mais ao identificar pessoas negras, porque foram treinadas com bancos de fotos pouco variados. Assim, preconceitos e desigualdades da sociedade podem entrar na técnica, mesmo quando ela parece apenas um cálculo."],["box","A neutralidade científica tem limites: quem financia a pesquisa pode influenciar seus resultados (conflito de interesses), e escolhas humanas podem levar preconceitos para dentro da tecnologia."],["h1","9. Quadro-resumo"],["tb",["Autor/tema","Época","Ideias-chave","Exemplo atual"],[["Platão","c. 428–348 a.C. (Grécia)","Doxa (opinião sem justificativa) × episteme (conhecimento com razões e provas).","Boato sobre vacinas × estudos que comparam vacinados e não vacinados."],["Aristóteles","384–322 a.C. (Grécia)","Techné: saber-fazer prático, voltado a produzir algo.","Paneleiras de Goiabeiras; pedreiro que aprendeu o ofício na prática."],["Francis Bacon","1561–1626 (Inglaterra)","Saber é poder; método indutivo; domínio da natureza.","Tecnologia agrícola com drones, sensores e sementes de laboratório."],["Escola de Frankfurt (Horkheimer e Adorno)","Século XX (Alemanha)","Razão instrumental: eficiência dos meios sem discutir os fins.","Algoritmos de entrega que punem trabalhadores; notificações de madrugada."],["Círculo de Viena","Décadas de 1920 e 1930","Critério de verificação: confirmar pela experiência.","Testes repetidos que confirmam uma hipótese."],["Karl Popper","1902–1994 (Áustria)","Falseabilidade; crítica à pseudociência.","Cursos de “mentalização” e horóscopos que explicam qualquer resultado."],["Thomas Kuhn","1922–1996 (EUA)","Paradigma, ciência normal, anomalia, crise e revolução científica.","Teoria dos germes na Medicina; órbita de Mercúrio e Einstein."],["Ciência como produção social","Estudos do século XX","Atividade coletiva; revisão por pares; conflito de interesses; limites da neutralidade.","Vacinas do Butantan e da Fiocruz; pesquisas pagas pela indústria do cigarro; reconhecimento facial."]],[1900,1500,3300,2938]],["h1","10. Glossário"],["gl",[["Anomalia","Fato que o paradigma aceito não consegue explicar (Kuhn)."],["Ceticismo organizado","Valor da comunidade científica segundo o qual toda afirmação deve ser examinada pelos colegas antes de ser aceita (Merton)."],["Ciência normal","Período em que os cientistas resolvem problemas dentro do paradigma, sem questioná-lo (Kuhn)."],["Conflito de interesses","Situação em que quem financia ou conduz a pesquisa tem interesse no resultado e pode influenciá-lo."],["Crise de paradigma","Momento em que as anomalias se acumulam, surgem versões rivais e os fundamentos da teoria passam a ser debatidos (Kuhn)."],["Doxa","Opinião, crença sem justificativa (Platão)."],["Episteme","Conhecimento verdadeiro e justificado, apoiado em razões e provas (Platão)."],["Falseabilidade","Possibilidade de uma teoria ser testada e mostrada falsa por algum resultado; critério de cientificidade de Popper."],["Gênio isolado","Imagem da ciência como obra de uma pessoa sozinha, que não corresponde ao trabalho coletivo da pesquisa."],["Indução","Raciocínio que parte de casos particulares observados para chegar a uma lei geral."],["Método","Caminho organizado de investigação: observação, hipótese, experimento e conclusão."],["Neutralidade científica","Ideia de que a ciência seria produzida livre de valores e interesses."],["Paradigma","Modelo compartilhado por uma comunidade científica, com teorias, métodos e exemplos de solução (Kuhn)."],["Pseudociência","Saber que se apresenta como ciência, mas não pode ser testado nem refutado."],["Razão instrumental","Razão que busca apenas os meios mais eficientes, sem discutir se os fins são justos (Escola de Frankfurt)."],["Revisão por pares","Avaliação de um estudo por outros especialistas antes da publicação."],["Revolução científica","Substituição de um paradigma por outro (Kuhn)."],["Techné","Saber-fazer prático, voltado a produzir algo (Aristóteles)."],["Universalismo","Valor segundo o qual um resultado científico é julgado pelas provas, e não por quem o apresentou (Merton)."],["Verificação","Critério segundo o qual uma afirmação científica deve poder ser confirmada pela experiência (Círculo de Viena)."]]]],"secs":{"1":"Filosofia e ciência: opinião, conhecimento e saber-fazer","2":"Ciência e técnica","3":"Método","4":"Verificação e falseabilidade","5":"Paradigma e ciência normal","6":"Crise de paradigma e revolução científica","7":"A ciência como produção social","8":"Neutralidade científica","9":"Quadro-resumo","10":"Glossário"},"qsec":{"1":1,"2":4,"3":6,"4":5,"5":2,"6":2,"7":5,"8":8,"9":1,"10":7,"11":1,"12":4,"13":6,"14":6,"15":2,"16":2,"17":5,"18":8,"19":1,"20":7,"21":2,"22":1,"23":4,"24":5,"25":1},"questoes":[{"t":["Em um grupo de mensagens da família, uma tia escreveu: “Vacina faz mais mal do que bem, todo mundo sabe disso.” Um primo que estuda Enfermagem respondeu com dados de pesquisas, mostrou que várias doenças diminuíram depois das campanhas de vacinação e apresentou estudos que comparam pessoas vacinadas e não vacinadas. Depois, perguntou à tia quais eram as razões dela."],"q":"Segundo Platão, a fala da tia e a resposta do primo são exemplos, nessa ordem, de","a":["episteme e doxa, pois a tia fala com certeza e o primo só repete o que leu.","techné e episteme, pois a tia tem um saber prático e o primo explica as causas.","doxa e episteme, pois a tia tem crença sem justificativa e o primo apresenta razões.","doxa e doxa, pois toda afirmação é só opinião e nenhuma vale mais que a outra.","episteme e episteme, pois os dois estão convencidos daquilo que afirmam."]},{"t":["Um curso vendido na internet promete: “Se você mentalizar seus objetivos todos os dias, o universo vai ajudar você a conquistá-los. Se der certo, foi a força do seu pensamento. Se não der certo, é porque você não mentalizou com força suficiente.”"],"q":"De acordo com Karl Popper, essa promessa não pode ser considerada científica por falta de","a":["falseabilidade, pois nenhum resultado possível poderia mostrar que ela está errada.","verificação, pois ninguém jamais conseguiu realizar um objetivo dessa forma.","popularidade, pois poucas pessoas acreditam nesse tipo de promessa na internet.","autoridade, pois o curso não foi criado por um cientista com diploma reconhecido.","matematização, pois a promessa não usa números nem gráficos em sua explicação."]},{"t":["Antes de Copérnico, a astronomia explicava o universo com a Terra parada no centro. Com o tempo, esse modelo passou a precisar de cada vez mais ajustes para prever o movimento dos planetas. Os astrônomos criavam versões diferentes do mesmo modelo, e nenhuma funcionava bem, e alguns começaram a discutir se as próprias bases da teoria estavam corretas."],"q":"Segundo Thomas Kuhn, esse momento da história da astronomia é um exemplo de","a":["ciência normal, pois os astrônomos resolviam problemas sem questionar o modelo.","revolução científica, pois o modelo com o Sol no centro já era aceito por todos.","neutralidade científica, pois os astrônomos não tinham interesses nem valores.","problema da indução, pois os astrônomos observaram poucos planetas no céu.","crise de paradigma, pois surgiam versões rivais e se debatiam os fundamentos."]},{"t":["A física de Newton explicava com enorme sucesso o movimento dos planetas. A órbita de Mercúrio, porém, apresentava um pequeno desvio que os cálculos não conseguiam explicar. Durante décadas, muitos astrônomos trataram esse desvio como erro de medição ou como um problema a ser resolvido mais tarde, e continuaram usando a física de Newton."],"q":"Para Thomas Kuhn, o desvio na órbita de Mercúrio é um exemplo de","a":["paradigma, pois era uma teoria compartilhada por toda a comunidade científica.","anomalia, pois era um fato que o paradigma da época não conseguia explicar.","revolução científica, pois levou ao abandono imediato da física de Newton.","ciência normal, pois foi resolvido com facilidade pelas regras do paradigma.","falseabilidade, pois provou de vez que toda a física de Newton estava errada."]},{"t":["Uma rede de supermercados instalou caixas de autoatendimento e um programa que calcula o menor número possível de funcionários em cada turno. Os custos caíram e os lucros aumentaram. Em nenhum momento a empresa discutiu o que aconteceria com os trabalhadores demitidos, com a sobrecarga dos que ficaram ou com os idosos que têm dificuldade de usar as máquinas."],"q":"Para pensadores da Escola de Frankfurt, como Horkheimer e Adorno, a atitude da empresa é um exemplo de","a":["episteme, pois a empresa buscou conhecer as causas e os princípios dos fenômenos.","neutralidade da técnica, pois as máquinas não envolvem escolhas nem interesses.","techné, pois os funcionários aprenderam um saber-fazer prático com os colegas.","razão instrumental, pois buscou só a eficiência dos meios, sem discutir os fins.","ciência normal, pois a empresa resolveu problemas dentro de um paradigma aceito."]},{"t":["Uma empresa de tecnologia agrícola publicou nas redes sociais a seguinte propaganda: “Com drones, sensores no solo e sementes desenvolvidas em laboratório, você controla cada detalhe da sua lavoura. Quem conhece a natureza faz ela produzir o máximo.”"],"q":"A propaganda retoma uma ideia do filósofo Francis Bacon, resumida na expressão “saber é poder”. Para Bacon, o conhecimento científico tem como objetivo principal o(a)","a":["domínio da natureza, pois conhecer as causas permite controlar e usar a natureza.","admiração, pois o saber serve apenas para admirar a natureza, sem mudá-la.","opinião, pois o conhecimento depende do gosto e dos costumes de cada pessoa.","tradição, pois a verdade sobre a natureza está nos textos dos sábios antigos.","preservação, pois o saber deve proteger a natureza de toda ação humana."]},{"t":["Em todos os cursos de Medicina e Enfermagem, os estudantes aprendem que muitas doenças são causadas por microrganismos. Essa teoria orienta a esterilização de instrumentos, a higiene nos hospitais e a pesquisa de vacinas. Ela aparece nos livros didáticos, nos exercícios dos manuais e nas aulas práticas, e é aceita por toda a comunidade médica."],"q":"No sentido dado por Thomas Kuhn, a teoria dos germes é um paradigma porque funciona como","a":["opinião individual, pois cada médico decide sozinho como explicar as doenças.","lei eterna, pois foi descoberta de uma vez e nunca poderá ser substituída.","modelo compartilhado, pois reúne teorias, métodos e exemplos de uma comunidade.","método universal, pois vale da mesma forma para todas as ciências e épocas.","hipótese isolada, pois ainda não foi aceita por nenhum grupo de cientistas."]},{"t":["Grandes empresas de tecnologia investem bilhões de dólares em inteligências artificiais de código fechado, também chamadas de proprietárias. Essas empresas decidem quais dados usar no treinamento, quais funções recebem prioridade e o que o público pode saber sobre o funcionamento dos sistemas. Pesquisadores que não trabalham nessas empresas têm dificuldade para examinar esses sistemas, que são feitos para gerar lucro a seus donos."],"q":"A situação descrita é um exemplo de","a":["neutralidade científica, pois a tecnologia é produzida livre de valores e interesses.","universalismo, pois os resultados são julgados apenas pelas provas apresentadas.","ceticismo organizado, pois qualquer cientista pode examinar livremente os sistemas.","gênio isolado, pois cada sistema é criado por uma única pessoa trabalhando sozinha.","conflito de interesses, pois quem financia a pesquisa influencia o que é produzido."]},{"t":["Durante um dia, uma estudante anotou situações que viu em casa, na escola e no celular. Na aula de Filosofia, percebeu que cada uma podia ser explicada por um conceito estudado: dois de Platão, um de Aristóteles e um da Escola de Frankfurt.","Relacione cada conceito, na coluna 1, à situação anotada pela estudante, na coluna 2.","**Coluna 1**","(1) Doxa (Platão): opinião, crença sem justificativa.","(2) Episteme (Platão): conhecimento apoiado em razões e provas.","(3) Techné (Aristóteles): saber-fazer aprendido na prática e voltado a produzir algo.","(4) Razão instrumental (Escola de Frankfurt): busca só os meios mais eficientes, sem pensar se os fins fazem bem às pessoas.","**Coluna 2**","( ) No ponto de ônibus, um senhor disse: \"Amanhã vai chover, tenho certeza\". Quando perguntaram por quê, ele respondeu só que sentia isso.","( ) O pai dela, que é pedreiro, levantou o muro do quintal sem consultar livros, usando o que aprendeu na prática com colegas mais velhos.","( ) Na rádio da escola, uma colega disse que a água do córrego do bairro está poluída e provou com análises de laboratório e com os limites permitidos por lei.","( ) Um aplicativo de vídeos enviou notificações de madrugada para que ela assistisse mais e visse mais anúncios, sem se importar com o sono dela."],"q":"A sequência correta, de cima para baixo, é","a":["2 – 3 – 1 – 4","1 – 4 – 2 – 3","3 – 1 – 2 – 4","1 – 3 – 2 – 4","1 – 3 – 4 – 2"]},{"t":["Um jornal publicou uma reportagem sobre a ciência no Brasil e no mundo. A matéria mostrava que a ciência é feita por pessoas, dentro da sociedade, e por isso sofre influência dela. Cada trecho da reportagem trazia um caso diferente.","Relacione cada ideia da coluna 1 ao caso da reportagem que ela explica, na coluna 2.","**Coluna 1**","(1) Ciência como atividade coletiva: a pesquisa depende de instituições, dinheiro e muitas pessoas trabalhando juntas.","(2) Conflito de interesses: quem paga a pesquisa pode influenciar o resultado.","(3) Revisão por pares: outros especialistas avaliam o estudo antes de ele ser publicado.","(4) Limites da neutralidade: escolhas humanas podem levar preconceitos e desigualdades para dentro da tecnologia.","**Coluna 2**","( ) \"Um estudo sobre um suplemento circulou nas redes como 'comprovado'. Quando outros especialistas o analisaram antes da publicação numa revista, encontraram erros de método e pediram correções.\"","( ) \"As vacinas da covid-19 produzidas pelo Instituto Butantan e pela Fiocruz dependeram de dinheiro público, de pesquisadores formados em universidades públicas e de milhares de voluntários.\"","( ) \"Câmeras de reconhecimento facial usadas na segurança pública erram mais ao identificar pessoas negras, porque foram treinadas com bancos de fotos pouco variados.\"","( ) \"Durante décadas, empresas de cigarro pagaram pesquisas para convencer as pessoas de que o fumo talvez não causasse câncer, embora já soubessem dos riscos.\""],"q":"A sequência correta, de cima para baixo, é","a":["3 – 1 – 4 – 2","1 – 3 – 4 – 2","3 – 2 – 4 – 1","3 – 1 – 2 – 4","4 – 1 – 3 – 2"]},{"t":["Um influenciador de Vila Velha publicou um vídeo dizendo: “Água com limão em jejum cura gastrite. Eu tomo todos os dias e confio.” Uma gastroenterologista respondeu nos comentários com estudos que explicam as causas da gastrite, como a bactéria _H. pylori_ e o uso frequente de certos remédios, e mostrou que o limão pode até piorar a irritação do estômago."],"q":"Segundo Platão, a fala da médica é um exemplo de","a":["doxa, pois ela também apenas confia na própria experiência pessoal.","techné, pois ela usa um saber prático para preparar um remédio caseiro.","razão instrumental, pois ela busca apenas o meio mais rápido de curar.","episteme, pois ela apoia o que afirma em razões, causas e provas.","paradigma, pois a opinião dela é a mesma de todos os seguidores do vídeo."]},{"t":["Em um trabalho de Ciências, um estudante de Colatina observou 500 cisnes em fotos de parques do Brasil e da Europa. Todos eram brancos, e ele concluiu: “Está comprovado que todos os cisnes são brancos.” A professora mostrou, então, a foto de um cisne negro da Austrália."],"q":"Para Karl Popper, o caso mostra que","a":["muitas observações iguais não comprovam uma lei geral, mas uma observação contrária pode refutá-la.","a conclusão do estudante era científica porque foi confirmada por 500 observações.","uma teoria só é científica quando ninguém consegue imaginar um caso contrário.","a foto do cisne negro deve ser descartada, pois contraria a maioria dos casos.","o número de observações é o único critério para decidir se algo é ciência."]},{"t":["No século XVIII, os químicos explicavam a queima com a teoria do “flogisto”, uma substância que sairia dos materiais quando eles queimam. Porém, alguns metais ficavam mais pesados depois de queimados, o que a teoria não explicava. Os químicos criaram versões diferentes da teoria para dar conta do problema, sem chegar a um acordo, até que Lavoisier propôs que a queima envolve a combinação com um gás, o oxigênio."],"q":"Segundo Thomas Kuhn, o período em que os químicos criavam versões rivais da teoria do flogisto, sem acordo, corresponde a uma","a":["fase de ciência normal, pois ninguém questionava a teoria aceita.","neutralidade científica, pois os químicos não tinham valores nem interesses.","crise de paradigma, pois as anomalias levaram a versões rivais e ao debate dos fundamentos.","revisão por pares, pois os químicos publicavam artigos avaliados por colegas.","razão instrumental, pois os químicos só queriam produzir metais mais baratos."]},{"t":["Em 1915, Albert Einstein apresentou a teoria da relatividade geral. Ela explicou o desvio da órbita de Mercúrio, que a física de Newton não conseguia explicar, e mudou a forma como os cientistas entendiam o espaço e o tempo. Com os anos, a comunidade de físicos passou a adotar a nova teoria como base de suas pesquisas."],"q":"Para Thomas Kuhn, a adoção da teoria de Einstein pela comunidade de físicos é um exemplo de","a":["anomalia, pois a nova teoria era um fato que ninguém conseguia explicar.","revolução científica, pois um novo paradigma substituiu o antigo.","ciência normal, pois os físicos continuaram sem questionar a física de Newton.","doxa, pois a nova teoria era só uma opinião pessoal de Einstein.","gênio isolado, pois a ciência avança apenas pelo trabalho de uma pessoa."]},{"t":["Uma escola particular passou a usar um programa que monta a grade de aulas com o menor número possível de professores, para economizar. Os custos caíram, mas as turmas ficaram com mais de 50 estudantes, e os professores passaram a dar aulas em três turnos. A direção considerou o resultado “excelente” e não discutiu os efeitos na aprendizagem nem na saúde dos trabalhadores."],"q":"De acordo com Horkheimer e Adorno, a atitude da direção revela","a":["a razão instrumental, que busca a eficiência dos meios sem discutir se os fins são bons.","a episteme, pois a direção procurou conhecer as causas dos problemas da escola.","a techné, pois os professores aprenderam um novo saber-fazer com os colegas.","a neutralidade da técnica, pois o programa não carrega escolhas humanas.","a revisão por pares, pois os professores avaliaram o programa antes de usá-lo."]},{"t":["Pesquisadores do Incaper, instituto de pesquisa agropecuária do Espírito Santo, estudam o solo, o clima e a genética do café conilon. Com esse conhecimento, desenvolvem variedades mais produtivas e resistentes à seca, que os agricultores do norte do estado usam para colher mais em menos área."],"q":"A situação se aproxima da ideia de Francis Bacon porque mostra que","a":["o conhecimento deve apenas contemplar a natureza, sem interferir nela.","a verdade sobre a lavoura está nos livros dos sábios antigos.","o saber depende apenas da opinião e do costume de cada agricultor.","a ciência deve impedir qualquer mudança humana na natureza.","conhecer as causas naturais permite controlar a natureza e usá-la a favor das pessoas."]},{"t":["Nas aulas de Biologia, os estudantes aprendem que as espécies de seres vivos se transformam ao longo do tempo pela seleção natural. Essa teoria orienta pesquisas sobre vacinas, sobre a resistência das bactérias aos antibióticos e sobre a conservação de espécies. Ela aparece nos livros didáticos, nos exercícios e nas pesquisas das universidades, e é aceita pela comunidade de biólogos."],"q":"Para Thomas Kuhn, a teoria da evolução ocupa na Biologia o lugar de","a":["uma anomalia, pois é um fato que os biólogos não conseguem explicar.","uma opinião particular, pois cada biólogo a interpreta como quiser.","um paradigma, pois é o modelo compartilhado que orienta teorias, métodos e problemas.","uma pseudociência, pois não pode ser testada por nenhuma observação.","uma crise, pois os biólogos discutem se as bases da teoria estão corretas."]},{"t":["Uma pesquisa divulgada em sites de notícias concluiu que refrigerantes açucarados “não têm relação com o aumento da obesidade”. Jornalistas descobriram depois que o estudo foi totalmente pago por uma associação de fabricantes de bebidas, que ajudou a escolher as perguntas e aprovou o texto antes da divulgação."],"q":"O caso é um exemplo de","a":["universalismo, pois o estudo foi julgado apenas pelas provas apresentadas.","neutralidade científica, pois a pesquisa foi feita sem valores nem interesses.","techné, pois os pesquisadores usaram um saber prático aprendido no trabalho.","conflito de interesses, pois quem pagou a pesquisa tinha interesse no resultado.","revolução científica, pois o estudo substituiu o paradigma da nutrição."]},{"t":["Em uma semana, um estudante de Cariacica anotou situações do dia a dia e as relacionou aos conceitos estudados em Filosofia.","Relacione cada conceito, na coluna 1, à situação anotada pelo estudante, na coluna 2.","**Coluna 1**","(1) Doxa (Platão): opinião, crença sem justificativa.","(2) Episteme (Platão): conhecimento apoiado em razões e provas.","(3) Techné (Aristóteles): saber-fazer aprendido na prática e voltado a produzir algo.","(4) Razão instrumental (Escola de Frankfurt): busca só os meios mais eficientes, sem pensar se os fins fazem bem às pessoas.","**Coluna 2**","( ) A avó dele faz panelas de barro em Goiabeiras com a técnica que aprendeu com a mãe, sem nunca ter lido um livro sobre o assunto.","( ) Na feira de ciências, uma colega mostrou, com medições feitas durante um mês, que a sala de aula mais quente era a que não tinha árvores por perto.","( ) Um aplicativo de transporte aumentou o preço das corridas durante uma enchente, porque a procura cresceu, sem considerar a situação das pessoas.","( ) Um vizinho garantiu que “manga com leite faz mal”, mas, quando perguntaram por quê, disse apenas que sempre ouviu isso."],"q":"A sequência correta, de cima para baixo, é","a":["3 – 2 – 4 – 1","2 – 3 – 4 – 1","3 – 4 – 2 – 1","3 – 2 – 1 – 4","1 – 2 – 4 – 3"]},{"t":["Uma revista de divulgação científica publicou uma série de reportagens mostrando que a ciência é feita dentro da sociedade.","Relacione cada ideia da coluna 1 ao caso da reportagem que ela explica, na coluna 2.","**Coluna 1**","(1) Ciência como atividade coletiva: a pesquisa depende de instituições, dinheiro e muitas pessoas trabalhando juntas.","(2) Conflito de interesses: quem paga a pesquisa pode influenciar o resultado.","(3) Revisão por pares: outros especialistas avaliam o estudo antes de ele ser publicado.","(4) Limites da neutralidade: escolhas humanas podem levar preconceitos e desigualdades para dentro da tecnologia.","**Coluna 2**","( ) \"Uma fabricante de agrotóxicos financiou um estudo que concluiu que seu produto não oferece riscos à saúde de quem trabalha na lavoura.\"","( ) \"Um programa usado por empresas para escolher currículos passou a descartar mais mulheres, porque foi treinado com dados de contratações antigas, feitas quase só com homens.\"","( ) \"O telescópio James Webb só foi possível graças à cooperação de agências espaciais de vários países e ao trabalho de milhares de engenheiros e cientistas.\"","( ) \"Antes de aceitar um artigo sobre um novo tratamento, uma revista científica o enviou a três especialistas, que pediram novos testes.\""],"q":"A sequência correta, de cima para baixo, é","a":["4 – 2 – 1 – 3","2 – 1 – 4 – 3","2 – 4 – 3 – 1","2 – 4 – 1 – 3","3 – 4 – 1 – 2"]},{"tipo":"arraste","t":["Uma empresa de entregas usa um algoritmo que calcula a rota mais rápida e o menor custo para cada pedido. O sistema funciona muito bem, mas os entregadores trabalham até 12 horas por dia e recebem punições automáticas quando atrasam. Ninguém na empresa pergunta se esse modo de trabalhar é justo para as pessoas."],"q":"Que nome os pensadores da Escola de Frankfurt dão a esse tipo de razão, que busca apenas a eficiência dos meios sem discutir os fins?","f":"Arraste a resposta correta para o campo indicado: {0}","b":["Razão instrumental","Episteme","Techné"]},{"tipo":"arraste","t":["Em um almoço de domingo, o avô disse ao neto: \"Nunca durma de cabelo molhado, porque isso dá pneumonia. Sempre ouvi dizer isso.\" A tia, que é médica, explicou que a pneumonia é causada por microrganismos, como vírus e bactérias, e mostrou estudos que comprovam isso. Ela lembrou que o cabelo molhado pode causar desconforto, mas não causa a doença."],"q":"Segundo Platão, que nomes recebem, respectivamente, a crença do avô e o conhecimento apresentado pela tia?","f":"Arraste a resposta correta para o campo indicado: {0}","b":["Doxa e episteme","Episteme e doxa","Techné e episteme"]},{"tipo":"arraste","t":["Um canal de vídeos afirma que pulseiras magnéticas “equilibram a energia do corpo”. Quando alguém melhora, o canal diz que foi a pulseira. Quando alguém não melhora, diz que a pessoa “tinha a energia muito bloqueada”. Nenhum resultado possível é aceito como prova de que a pulseira não funciona."],"q":"Que nome Karl Popper dá ao critério que falta a essa afirmação: a possibilidade de uma teoria ser testada e mostrada falsa por algum resultado?","f":"Arraste a resposta correta para o campo indicado: {0}","b":["Falseabilidade","Verificação","Paradigma"]},{"tipo":"arraste","t":["Em um laboratório da Universidade Federal do Espírito Santo, uma equipe de pesquisadores passa meses testando o efeito de um remédio já conhecido em diferentes doses. Eles seguem as teorias e os métodos aceitos pela comunidade médica e resolvem os problemas que aparecem sem questionar as bases da Medicina atual."],"q":"Segundo Thomas Kuhn, como se chama esse período de trabalho científico dentro de um paradigma aceito, sem questioná-lo?","f":"Arraste a resposta correta para o campo indicado: {0}","b":["Ciência normal","Revolução científica","Crise de paradigma"]},{"tipo":"arraste","t":["Em Goiabeiras, bairro de Vitória, as paneleiras modelam as panelas de barro com as mãos, queimam as peças a céu aberto e as pintam com tinta de casca de árvore. Elas aprenderam o ofício com as mães e as avós, observando e praticando desde cedo, e cada panela pronta mostra o domínio desse saber."],"q":"Que nome Aristóteles dá a esse saber-fazer aprendido na prática e voltado a produzir algo?","f":"Arraste a resposta correta para o campo indicado: {0}","b":["Techné","Doxa","Episteme"]}],"k":"CzdTWEMuDSQGEVAEFEQ5GAlOXgAdSRkBFhkMSxkCExNEQYXt/SQDBRtBAlg+Cx9QFhNPLpfo8wRfUKraVE9HAUIIAFhLSkkoTREiBQwbQQ5dPwYRUApSXD4QSApEH1AMHlQBDAFCA0EXQQEaExgFPx9bVKLGDXpFFQAMAVkuGA1EB0tQORIGBE01QREVscILRUcMQTMJEwAEFUxwCxVQFAdIJlUOD0EEUAew1wpNB0wDFRNaRAZHHBQ1TAIbDxtMcByz0wpSTDhVGg9XpsUMAFpHMEl2QE1QIEQZFQIMNR8SFUEKVSADGRMEUlw+FAQfWAACSQERFhgJWREFHU1EDaTHQTMJEwAOT0IlTxSzz1JIOQcJCkJLUDkcBkUEFl4fQRwECgESAEEkCRIABE9dPwsVAgwTDTkQDhtZptFEHxVfTQNMHBUTQU5DAQwNIwkAFggDRDQOFBVPWAFrGkgNXwwEqtoGDAJFSRVBIg4UGQIfQSANExVBC0QjGxkeAgdEOVULB+7PHgoa async function gerarApostilaPDF(PDFLib, D) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const doc = await PDFDocument.create();
  doc.setTitle(D.cab.titulo + " – " + (D.rod || "Apostila"));
  doc.setSubject(D.cab.componente + " – " + D.cab.serie);
  doc.setLanguage("pt-BR");
  const FT = {
    r: await doc.embedFont(StandardFonts.Helvetica),
    b: await doc.embedFont(StandardFonts.HelveticaBold),
    i: await doc.embedFont(StandardFonts.HelveticaOblique),
    bi: await doc.embedFont(StandardFonts.HelveticaBoldOblique)
  };
  const C = {
    tx: rgb(0.12, 0.12, 0.12), cor: rgb(0.478, 0.243, 0.071), lar: rgb(0.784, 0.38, 0.118),
    hd: rgb(0.957, 0.851, 0.769), bx: rgb(0.992, 0.945, 0.906), bd: rgb(0.7, 0.7, 0.7), cz: rgb(0.42, 0.42, 0.42)
  };
  // A4, margens de 1 cm
  const PW = 595.28, PH = 841.89, M = 28.35, X0 = M, W = PW - 2 * M, TOP = PH - M, BOT = M + 16;
  const pages = []; let page, y;
  const nova = () => { page = doc.addPage([PW, PH]); pages.push(page); y = TOP; };
  nova();
  const noTopo = () => Math.abs(y - TOP) < 0.5;

  // caracteres fora do WinAnsi viram equivalentes seguros
  const sane = s => s.replace(/[‐‑]/g, "-").replace(/ /g, " ")
    .replace(/[^\u0000-ÿ–—‘’‚“”„†‡•…‰‹›€™ŒœŠšŸŽžƒˆ˜]/g, "?");

  function parse(t, base) {
    const out = []; const re = /(\*\*[^*]+\*\*|_[^_]+_)/g; let i = 0, m;
    while ((m = re.exec(t))) {
      if (m.index > i) out.push({ t: t.slice(i, m.index), s: base });
      const s = m[0];
      if (s.startsWith("**")) out.push({ t: s.slice(2, -2), s: base === "i" ? "bi" : "b" });
      else out.push({ t: s.slice(1, -1), s: base === "b" ? "bi" : "i" });
      i = m.index + s.length;
    }
    if (i < t.length) out.push({ t: t.slice(i), s: base });
    return out;
  }
  function palavras(runs, size) {
    const ws = []; let cur = null;
    for (const r of runs) {
      for (const p of sane(r.t).split(/(\s+)/)) {
        if (p === "") continue;
        if (/^\s+$/.test(p)) { if (cur) { ws.push(cur); cur = null; } continue; }
        const f = FT[r.s]; const seg = { t: p, f, w: f.widthOfTextAtSize(p, size) };
        if (!cur) cur = { segs: [], w: 0 };
        cur.segs.push(seg); cur.w += seg.w;
      }
    }
    if (cur) ws.push(cur);
    return ws;
  }
  // divide palavra maior que a largura disponível (só em colunas muito estreitas)
  function partir(w, maxW, size) {
    const f = w.segs[0].f; const txt = w.segs.map(s => s.t).join(""); const hy = f.widthOfTextAtSize("-", size);
    const out = []; let acc = "";
    for (const ch of txt) {
      if (f.widthOfTextAtSize(acc + ch, size) + hy > maxW && acc) { out.push(acc + "-"); acc = ch; } else acc += ch;
    }
    if (acc) out.push(acc);
    return out.map(t => ({ segs: [{ t, f, w: f.widthOfTextAtSize(t, size) }], w: f.widthOfTextAtSize(t, size) }));
  }
  function quebra(ws0, maxW, size) {
    const sp = FT.r.widthOfTextAtSize(" ", size); const L = []; let cur = [], cw = 0;
    const ws = []; ws0.forEach(w => { if (w.w > maxW) ws.push(...partir(w, maxW, size)); else ws.push(w); });
    for (const w of ws) {
      if (cur.length && cw + sp + w.w > maxW) { L.push({ ws: cur, w: cw, last: false }); cur = []; cw = 0; }
      cw = cur.length ? cw + sp + w.w : w.w; cur.push(w);
    }
    if (cur.length) L.push({ ws: cur, w: cw, last: true });
    return L;
  }
  // texto justificado: a última linha do parágrafo fica alinhada à esquerda
  function desenha(line, x, yb, maxW, size, color) {
    const sp = FT.r.widthOfTextAtSize(" ", size); const n = line.ws.length; let gap = sp;
    if (!line.last && n > 1) gap = (maxW - line.ws.reduce((a, w) => a + w.w, 0)) / (n - 1);
    let cx = x;
    for (const w of line.ws) { for (const s of w.segs) { page.drawText(s.t, { x: cx, y: yb, size, font: s.f, color }); cx += s.w; } cx += gap; }
  }
  // coloca linhas evitando linha órfã (sozinha no fim) e viúva (sozinha no topo)
  function colocaLinhas(L, x, maxW, size, lh, color, bullet) {
    let i = 0;
    while (i < L.length) {
      const rest = L.length - i; const avail = Math.floor((y - BOT + 0.01) / lh);
      let k = rest <= avail ? rest : avail;
      if (k < rest && rest - k === 1) k -= 1;
      if (k < rest && k < 2) { nova(); continue; }
      for (let j = 0; j < k; j++) {
        const yb = y - size;
        if (bullet && i + j === 0) page.drawText("•", { x: x - 10, y: yb, size, font: FT.b, color: C.lar });
        desenha(L[i + j], x, yb, maxW, size, color); y -= lh;
      }
      i += k;
      if (i < L.length) nova();
    }
  }
  const S = 10.5, LH = 14.6;
  function paragrafo(t, o = {}) {
    const size = o.size || S, lh = o.lh || LH, ind = o.indent || 0;
    const L = quebra(palavras(parse(t, o.base || "r"), size), W - ind, size);
    if (!noTopo()) y -= (o.before || 0);
    colocaLinhas(L, X0 + ind, W - ind, size, lh, o.color || C.tx, o.bullet);
    y -= (o.after ?? 5);
  }
  function titulo(t, nivel) {
    const size = nivel === 1 ? 15 : 12, lh = size * 1.3;
    if (!noTopo()) y -= nivel === 1 ? 14 : 8;
    const L = quebra(palavras(parse(t, "b"), size), W, size);
    L.forEach(l => { desenha({ ...l, last: true }, X0, y - size, W, size, nivel === 1 ? C.cor : C.lar); y -= lh; });
    y -= nivel === 1 ? 5 : 3;
  }
  function tabela(cab, linhas, ws, size) {
    const tot = ws.reduce((a, b) => a + b, 0); const cw = ws.map(w => w / tot * W); const pad = 4, lh = size * 1.32;
    const prep = (row, b) => {
      const cells = row.map((t, k) => quebra(palavras(parse(t, b ? "b" : "r"), size), cw[k] - 2 * pad, size));
      return { cells, h: Math.max(...cells.map(c => c.length)) * lh + 2 * pad - (lh - size) + 2 };
    };
    const H = prep(cab, true); const R = linhas.map(r => prep(r, false));
    const drawRow = (row, fill) => {
      let x = X0;
      row.cells.forEach((c, k) => {
        page.drawRectangle({ x, y: y - row.h, width: cw[k], height: row.h, color: fill, borderColor: C.bd, borderWidth: 0.6 });
        let yy = y - pad - size * 0.9;
        c.forEach(l => { desenha(l, x + pad, yy, cw[k] - 2 * pad, size, C.tx); yy -= lh; });
        x += cw[k];
      });
      y -= row.h;
    };
    if (!noTopo()) y -= 3;
    if (y - (H.h + R[0].h) < BOT) nova();
    drawRow(H, C.hd);
    for (const r of R) { if (y - r.h < BOT) { nova(); drawRow(H, C.hd); } drawRow(r, undefined); }
    y -= 10;
  }
  function alturaCaixa(t) {
    const size = S, lh = LH, pad = 8, bar = 4; const iw = W - 2 * pad - bar;
    const L = quebra(palavras(parse(t, "r"), size), iw, size);
    return { L, h: pad + 15 + L.length * lh + pad - (lh - size) + 2, iw, pad, bar };
  }
  function caixa(t) {
    const { L, h, iw, pad, bar } = alturaCaixa(t);
    if (!noTopo()) y -= 6;
    if (y - h < BOT) nova();
    page.drawRectangle({ x: X0, y: y - h, width: W, height: h, color: C.bx, borderColor: C.lar, borderWidth: 0.8 });
    page.drawRectangle({ x: X0, y: y - h, width: bar, height: h, color: C.lar });
    page.drawText("PARA LEMBRAR", { x: X0 + bar + pad, y: y - pad - 8, size: 9, font: FT.b, color: C.cor });
    let yy = y - pad - 15;
    L.forEach(l => { desenha(l, X0 + bar + pad, yy - S, iw, S, C.tx); yy -= LH; });
    y -= h + 10;
  }
  // altura mínima para começar um bloco (para não deixar título sozinho)
  function minAltura(k) {
    const b = D.conteudo[k]; if (!b) return 0;
    const [tp, a, bb, c] = b;
    if (tp === "h1") return 15 * 1.3 + 19 + minAltura(k + 1);
    if (tp === "h2") return 12 * 1.3 + 11 + minAltura(k + 1);
    if (tp === "p") { const n = quebra(palavras(parse(a, "r"), S), W, S).length; return Math.min(n, 2) * LH; }
    if (tp === "ul" || tp === "gl") return 2 * LH;
    if (tp === "box") return alturaCaixa(a).h + 6;
    if (tp === "tb") return 60;
    return 0;
  }

        fant.style.left = (e.clientX - fant.offsetWidth / 2) + "px"; fant.style.top = (e.clientY - fant.offsetHeight / 2) + "px";
        fant.style.visibility = "hidden";
        const el = document.elementFromPoint(e.clientX, e.clientY);
        fant.style.visibility = "";
        const l = el && el.closest ? el.closest(".lac") : null;
        if (alvo && alvo !== l) alvo.classList.remove("sobre");
        alvo = l && lacs.includes(l) ? l : null; if (alvo) alvo.classList.add("sobre");
      };
      const fim = () => {
        c.removeEventListener("pointermove", move); c.removeEventListener("pointerup", fim); c.removeEventListener("pointercancel", fim);
        c.classList.remove("arrastando");
        if (fant) { fant.remove(); arrastou = true; setTimeout(() => { arrastou = false; }, 0); if (alvo) { alvo.classList.remove("sobre"); coloca(+c.dataset.b, +alvo.dataset.l); } }
      };
      c.addEventListener("pointermove", move); c.addEventListener("pointerup", fim); c.addEventListener("pointercancel", fim);
    });
  });
  const leit = $("#q-leit");
  const libera = () => {
    limpaTick();
    S.leitRest = 0; if (!S.liberadaEm) S.liberadaEm = agora(); salva();
    liberado = true; leit.hidden = true; pinta();
  };
  const pintaLeit = () => {
    leit.hidden = false;
    leit.classList.toggle("pausado", document.hidden);
    leit.textContent = document.hidden ? "⏸ Página em segundo plano: o tempo de leitura está parado."
      : "🔒 Tempo mínimo de leitura: as respostas serão liberadas em " + S.leitRest + " s.";
  };
  pinta();
  if (!GUARD || S.leitRest <= 0) libera();
  else {
    pintaLeit();
    tick = setInterval(() => {
      if (!GUARD) return libera();
      if (document.hidden) return pintaLeit();
      S.leitRest--; salva();
      if (S.leitRest <= 0) libera(); else pintaLeit();
    }, 1000);
  }
  conf.onclick = () => {
    if (fill.some(x => x == null) || S.respondida) return;
    const certo = gab()[qi][0];
    const ok = fill.every((b,i) => b === certo[i]);
    const e = Math.round((agora() - (S.liberadaEm || agora())) / 1000);
    const rapida = GUARD && e < RAPIDA;
    const r = { f: fill.slice(), ok, t: agora(), e, r: rapida };
    (S.resp[qi] = S.resp[qi] || []).push(r);
    S.pendente = null; S.respondida = true;
    S.fs = rapida ? (S.fs||0) + 1 : 0;
    if (!ok){
      if (GUARD) S.pausaAte = agora() + PAUSA*1000;
      const nf = S.fila.length, min = nf > 0 ? 1 : 0;
      S.fila.splice(min + Math.floor(Math.random() * (nf - min + 1)), 0, qi);
    }
    if (GUARD && S.fs >= SEQ_RAPIDA){ S.fs = 0; S.rushN = (S.rushN||0) + 1; S.rushAte = agora() + PAUSA_RITMO*1000; }
    salva(); mostra();
  };
}

/* ---------- resultado ---------- */
function estat(){
  const prim = Q.map((_,qi) => { const r = (S.resp[qi]||[])[0]; return !!(r && r.ok); });
  const acertos1 = prim.filter(Boolean).length;
  const todas = todasResp(), total = todas.length;
  const acertos = todas.filter(r => r.ok).length, erros = total - acertos;
  const dominadas = Q.filter((_,qi) => (S.resp[qi]||[]).some(r => r.ok)).length;
  const tempos = todas.filter(r => typeof r.e === "number");
  const media = tempos.length ? Math.round(tempos.reduce((s,r)=>s+r.e,0)/tempos.length) : 0;
  const rapida = tempos.length ? Math.min(...tempos.map(r=>r.e)) : 0;
  const apressadas = tempos.filter(r => r.r).length;
  const pctAp = tempos.length ? Math.round(apressadas/tempos.length*100) : 0;
  const nota = (acertos1/Q.length*10).toFixed(1).replace(".",",");
  const dur = (S.fim||agora()) - S.inicio;
  let diag;
  if (pctAp === 0 && !S.rushN) diag = ["ok","Leitura consciente: ritmo adequado em todas as respostas."];
  else if (pctAp < 40 && (S.rushN||0) <= 1) diag = ["alerta","Ritmo irregular: algumas respostas foram dadas rápido demais."];
  else diag = ["ruim","Leitura apressada: muitas respostas sem tempo de reflexão."];
  const limpo = !apressadas && !S.rushN;
  return { prim, acertos1, total, acertos, erros, dominadas, media, rapida, apressadas, pctAp, nota, dur, diag, limpo, nTempos: tempos.length };
}
function resumo(){
  const E = estat();
  const registro = `${S.nome}|${S.turma}|${E.acertos1}|${E.total}|${S.infr.length}|${S.recargas}|${S.rushN||0}|${new Date(S.fim).toISOString()}`;
  const cod = cyrb(registro + "|" + CHAVE).slice(0,10).padEnd(10,"0");
  return Object.assign(E, { registro, codigo: cod.slice(0,5)+"-"+cod.slice(5) });
}
function linhaQuestao(qi){
  const rs = S.resp[qi]||[], sec = DATA.qsec[qi+1], p = rs[0];
  return { pos: S.seq.indexOf(qi), num: String(S.seq.indexOf(qi)+1).padStart(2,"0"), gab: String(qi+1).padStart(2,"0"), sec: `${sec}. ${DATA.secs[sec]}`, prim: p ? (p.ok ? "Acertou" : "Errou") : "Não respondida", ret: String(rs.length) };
}
function todasLinhas(){ return Q.map((_,qi) => linhaQuestao(qi)).sort((a,b) => a.pos - b.pos); }

}

async function relatorioPDF(R, linhas, b, aluno){

    linhasRel(R, aluno).forEach(([tit, rows]) => conteudo.push(["h1", tit], ["tb",["Item","Registro"], rows,[3600,6038]]));
    conteudo.push(["h1","Verificação"], ["tb",["Item","Registro"],[["Código de verificação", R.codigo], ["Registro", R.registro]],[3600,6038]]);
    conteudo.push(["h1","Desempenho por questão"], ["tb",(aluno ? ["Questão","Seção da apostila","1ª tentativa","Tentativas"] : ["Questão","Nº no gabarito","Seção da apostila","1ª tentativa","Tentativas"]), (aluno ? linhas.map(l=>[l.num,l.sec,l.prim,l.ret]) : linhas.map(l=>[l.num,l.gab,l.sec,l.prim,l.ret])),(aluno ? [1100,4900,1800,1838] : [1000,1300,4100,1700,1538])]);
    if (S.infr.length) conteudo.push(["h1","Alertas em ordem cronológica"], ["tb",["Horário","Ocorrência"], S.infr.map(i=>[new Date(i.t).toLocaleTimeString("pt-BR"), i.tipo]),[2000,7638]]);
    const D = { cab: DATA.cab, sub: "Relatório do quiz", rod: "Relatório do quiz",
      cabLinhas: [`**Componente curricular:** ${DATA.cab.componente}. **Série/trimestre:** ${DATA.cab.serie}.`], conteudo };

  } catch(e){ console.error(e); alert("Não foi possível gerar o PDF neste navegador."); }
  b.disabled = false; b.textContent = txt;
}

      if (!f) return true;
      const sec = DATA.qsec[i+1];
      const txt = [q.t.join(" "), q.q, (q.a || q.b).join(" "), q.f || "", G[i][1], `seção ${sec}`, DATA.secs[sec], `questão ${i+1}`].join(" ").toLowerCase();
      return txt.includes(f);
    });
    $("#g-exib").textContent = itens.length;
    $("#g-lista").innerHTML = itens.length ? itens.map(({q,i}) => {
      const sec = DATA.qsec[i+1], c = G[i][0];
      return `<div class="gcard"><div class="ghead"><span class="gnum">Questão ${String(i+1).padStart(2,"0")}</span><span class="gtag">Seção ${sec}: ${esc(DATA.secs[sec])}</span><span class="gresp">✅ ${q.tipo==="arraste" ? "Completar" : "Correta: " + L[c]}</span></div>
        ${q.t.map(t=>`<p>${md(t)}</p>`).join("")}<p class="qcomando">${md(q.q)}</p>
        ${q.tipo==="arraste"
          ? `<div class="gopt certa">${q.f.split(/\{(\d)\}/).map((p,j)=> j%2 ? `<b>[(${+p+1}) ${md(q.b[c[+p]])}]</b>` : md(p)).join("")}</div><div class="gopt"><b>Respostas do quadro:</b> ${q.b.map((b,k)=> c.includes(k) ? `<strong>${md(b)}</strong>` : md(b)).join(" • ")}</div>`
          : q.a.map((a,k)=>`<div class="gopt${k===c?" certa":""}"><b>${L[k]})</b> ${md(a)}</div>`).join("")}
        <div class="gexp"><strong>Justificativa:</strong> ${md(G[i][1])}</div></div>`;
    }).join("") : `<p class="centro">Nenhuma questão encontrada com esse filtro.</p>`;
  };
  $("#g-busca").oninput = lista; lista();
}
function relAluno(){
  const el = $("#rel-area");
  if (!S){ el.innerHTML = `<h2 style="margin-top:0;color:var(--brand)">Relatório</h2><p>O relatório aparece aqui depois que você começar o quiz.</p>`; return; }
  const fim = S.fase === "fim";
  const R = fim ? resumo() : Object.assign(estat(), { codigo: "gerado ao concluir o quiz", registro: "" });
  const linhas = todasLinhas();
  el.innerHTML = `<h2 style="margin-top:0;color:var(--brand)">📊 Relatório de desempenho</h2>
    <div class="tstatus ${fim?"on":"off"}">${fim?"Atividade concluída":"Atividade em andamento"}</div>
    <div class="tw"><table><tbody><tr><th style="width:46%">Estudante</th><td>${esc(S.nome)}</td></tr><tr><th>Turma</th><td>${esc(S.turma)}</td></tr>
    <tr><th>Questões vistas</th><td>${vistas()} de ${Q.length}</td></tr><tr><th>Código de verificação</th><td>${fim?`<span class="codigo">${R.codigo}</span>`:esc(R.codigo)}</td></tr></tbody></table></div>
    <div class="diag ${R.diag[0]}">${esc(R.diag[1])}</div>
    ${tabelaRel(R, true)}
    <h3 class="rel-h">Desempenho por questão</h3>
    <div class="tw"><table><thead><tr><th>Questão</th><th>Seção da apostila</th><th>1ª tentativa</th><th>Tentativas</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${l.num}</td><td>${esc(l.sec)}</td><td class="${l.prim==="Acertou"?"ok-t":l.prim==="Errou"?"no-t":""}">${l.prim}</td><td>${l.ret}</td></tr>`).join("")}</tbody></table></div>
    ${S.infr.length?`<h3 class="rel-h">Alertas em ordem cronológica</h3><div class="tw"><table><tbody>${S.infr.map(i=>`<tr><td style="width:24%">${new Date(i.t).toLocaleTimeString("pt-BR")}</td><td>${esc(i.tipo)}</td></tr>`).join("")}</tbody></table></div>`:""}
    <div class="nav-q" style="margin-top:12px"><button class="btn sec" id="rel-quiz" type="button">${fim?"Ver resultado no quiz":"Voltar ao quiz"}</button><button class="btn" id="rel-pdf" type="button">⬇ Relatório em PDF</button></div>`;
  $("#rel-quiz").onclick = () => abre("#tab-qz","#p-qz");
  $("#rel-pdf").onclick = () => relatorioPDF(R, linhas, $("#rel-pdf"), true);
}
$("#tab-rel").addEventListener("click", relAluno);

function relProf(){
  if (!S) return;
  const R = S.fase === "fim" ? resumo() : Object.assign(estat(), { codigo: "gerado ao concluir", registro: "" });
  const linhas = todasLinhas();
  veu(`<div class="prof">${voltar()}<h2>📊 Relatório do estudante</h2>
    <div class="tstatus ${S.fase==="fim"?"on":"off"}">${S.fase==="fim"?"Atividade concluída":"Atividade em andamento"}</div>
    <div class="tw"><table><tbody><tr><th style="width:46%">Estudante</th><td>${esc(S.nome)}</td></tr><tr><th>Turma</th><td>${esc(S.turma)}</td></tr>
    <tr><th>Questões vistas</th><td>${vistas()} de ${Q.length}</td></tr><tr><th>Código de verificação</th><td>${esc(R.codigo)}</td></tr></tbody></table></div>
    <div class="diag ${R.diag[0]}">${esc(R.diag[1])}</div>
    ${tabelaRel(R)}
    <h3 class="rel-h">Desempenho por questão</h3>
    <div class="tw"><table><thead><tr><th>Questão</th><th>Nº no gabarito</th><th>Seção</th><th>1ª tentativa</th><th>Tentativas</th></tr></thead><tbody>
    ${linhas.map(l=>`<tr><td>${l.num}</td><td>${l.gab}</td><td>${esc(l.sec)}</td><td class="${l.prim==="Acertou"?"ok-t":"no-t"}">${l.prim}</td><td>${l.ret}</td></tr>`).join("")}</tbody></table></div>
    ${S.infr.length?`<h3 class="rel-h">Alertas em ordem cronológica</h3><div class="tw"><table><tbody>${S.infr.map(i=>`<tr><td style="width:24%">${new Date(i.t).toLocaleTimeString("pt-BR")}</td><td>${esc(i.tipo)}</td></tr>`).join("")}</tbody></table></div>`:""}
    <div class="nav-q"><button class="btn" id="m-relpdf" type="button">⬇ Relatório em PDF</button></div></div>`, "prof");
  largo(); ligaVoltar();
  $("#m-relpdf").onclick = () => relatorioPDF(R, linhas, $("#m-relpdf"));
}
function conferirCodigo(){
  veu(`<div class="prof">${voltar()}<h2>🔎 Conferir código de um relatório</h2>
    <p style="font-size:.9rem">Cole a linha <em>Registro</em> e o <em>Código de verificação</em> que aparecem no relatório em PDF do estudante.</p>
    <input class="txt" id="v-reg" placeholder="Registro"><input class="txt" id="v-cod" placeholder="Código (ex.: AB12C-D34EF)" style="margin-top:8px">
    <p id="v-res"></p>
    <div class="nav-q"><button class="btn" id="v-ok" type="button">Conferir</button></div></div>`, "prof");
  ligaVoltar();
  $("#v-ok").onclick = () => {
    const reg = $("#v-reg").value.trim(), cod = $("#v-cod").value.trim().toUpperCase();
    const calc = cyrb(reg + "|" + CHAVE).slice(0,10).padEnd(10,"0"); const fmt = calc.slice(0,5)+"-"+calc.slice(5);
    $("#v-res").innerHTML = reg && cod === fmt ? `<span class="ok-t">Código válido: os dados do registro não foram alterados.</span>` : `<span class="no-t">Código não confere com o registro.</span>`;
  };
}

/* ---------- início ---------- */
function retomada(){
  const E = estat();
  veu(`<h2>💾 Você tem uma atividade em andamento</h2>
    <p>Encontramos o seu progresso salvo neste navegador. Continue de onde parou.</p>
    <div class="tw"><table><tbody>
      <tr><th style="width:46%">Estudante</th><td>${esc(S.nome)} (${esc(S.turma)})</td></tr>
      <tr><th>Início</th><td>${fmtData(S.inicio)}</td></tr>
      <tr><th>Questões vistas</th><td>${vistas()} de ${Q.length}</td></tr>
      <tr><th>Respostas dadas</th><td>${E.total}</td></tr>
    </tbody></table></div>
    <div id="res-senha" hidden><label class="campo" for="res-pw">Senha do professor para reiniciar</label><input class="txt" id="res-pw" type="password" autocomplete="off"><p id="res-erro" class="no-t" hidden>Senha incorreta.</p></div>
    <div class="nav-q"><button class="btn sec" id="res-reini" type="button">🔄 Reiniciar</button><button class="btn" id="res-ok" type="button">▶ Continuar</button></div>`, "retomada");
  $("#res-ok").onclick = () => { fechaVeu(); abre("#tab-qz","#p-qz"); };
  const reinicia = () => {
    const box = $("#res-senha");
    if (box.hidden){ box.hidden = false; $("#res-reini").textContent = "Confirmar reinício"; setTimeout(()=>{const f=$("#res-pw"); if (f) f.focus();},50); return; }
    if (cyrb($("#res-pw").value.trim()) !== SENHA_H){ $("#res-erro").hidden = false; $("#res-pw").value = ""; return; }
    try { localStorage.removeItem(ST_KEY); } catch(e){}
    S = null; limpaTick(); $("#veu-rush").hidden = true; atualizaAlertas(); fechaVeu(); telaInicio(); abre("#tab-qz","#p-qz");
  };
  $("#res-reini").onclick = reinicia;
  $("#res-pw").onkeydown = e => { if (e.key === "Enter") reinicia(); };
}
S = carrega();
atualizaAlertas();
if (S) mostra(); else telaInicio();
if (S && emQuiz()) retomada();
})();
</script>

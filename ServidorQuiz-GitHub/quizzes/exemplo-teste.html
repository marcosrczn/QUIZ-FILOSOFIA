<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste do servidor — Filosofia</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f4f1ea;color:#1d2433;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:640px;margin:0 auto;padding:32px 16px}
  h1{font-family:Georgia,serif;font-weight:600;margin:0 0 4px}
  .c{background:#fffdf8;border:1px solid #e2dccf;border-radius:14px;padding:20px;margin-top:18px}
  label{display:block;font-weight:600;font-size:14px;margin-top:12px}
  input{width:100%;font:inherit;padding:9px 11px;border:1px solid #cfd5e1;border-radius:8px;margin-top:4px}
  button{font:inherit;font-weight:600;background:#1f4e8c;color:#fff;border:0;border-radius:9px;padding:10px 20px;margin-top:16px;cursor:pointer}
  .alt{display:block;width:100%;text-align:left;background:#fff;color:#1d2433;border:1px solid #cfd5e1;margin-top:8px}
  .alt:hover{border-color:#1f4e8c}
  .r{margin-top:12px;font-weight:600}
  small{color:#5d6577}
</style>
</head>
<body>
<main>
  <h1>Quiz de teste</h1>
  <small>Objeto de conhecimento: introdução à Filosofia. Objetivo: testar o servidor com um quiz curto.</small>
  <div class="c" id="tela"></div>
</main>
<script>
var CHAVE='teste_servidor_progresso';
var Q=[
  {p:'Quem afirmou “Só sei que nada sei”?',a:['Sócrates','Aristóteles','Descartes','Kant'],c:0},
  {p:'A palavra “filosofia” significa:',a:['Amor à sabedoria','Estudo da natureza','Arte de falar bem','Busca do poder'],c:0},
  {p:'O mito da caverna foi escrito por:',a:['Platão','Heráclito','Tales','Epicuro'],c:0}
];
var E=JSON.parse(localStorage.getItem(CHAVE)||'null')||{nome:'',turma:'',atual:0,respostas:[],alertas:[],concluido:false};
function salvar(){localStorage.setItem(CHAVE,JSON.stringify(E))}
document.addEventListener('visibilitychange',function(){if(document.hidden&&E.nome&&!E.concluido){E.alertas.push({tipo:'troca de aba',hora:new Date().toISOString()});salvar()}});
function tela(){
  var t=document.getElementById('tela');
  if(!E.nome){
    t.innerHTML='<label for="nome">Nome completo</label><input id="nome"><label for="turma">Turma</label><input id="turma"><button id="ir">Começar</button>';
    document.getElementById('ir').onclick=function(){var n=nome.value.trim(),tu=turma.value.trim();if(n.split(' ').length<2||!tu){alert('Preencha nome e sobrenome e a turma.');return}E.nome=n;E.turma=tu;salvar();tela()};
    return;
  }
  if(E.atual>=Q.length&&!E.discursiva){
    t.innerHTML='<small>Questão '+(Q.length+1)+' de '+(Q.length+1)+'</small><p><b><label for="disc">Com suas palavras, o que significa dizer que a filosofia começa com o espanto?</label></b></p><textarea id="disc" rows="5" style="width:100%;font:inherit;padding:10px;border:1px solid #cfd5e1;border-radius:8px"></textarea><button id="envDisc">Enviar resposta</button>';
    document.getElementById('envDisc').onclick=function(){var v=document.getElementById('disc').value.trim();if(v.length<10){alert('Escreva pelo menos uma frase.');return}E.discursiva=v;salvar();tela()};
    return;
  }
  if(E.atual>=Q.length){E.concluido=true;salvar();t.innerHTML='<b>Concluído!</b><p>Acertos: '+E.respostas.filter(function(r){return r.correta}).length+' de '+Q.length+'</p>';return}
  var q=Q[E.atual];
  t.innerHTML='<small>Questão '+(E.atual+1)+' de '+Q.length+'</small><p><b>'+q.p+'</b></p>'+q.a.map(function(x,i){return'<button class="alt" data-i="'+i+'">'+x+'</button>'}).join('');
  [].forEach.call(t.querySelectorAll('.alt'),function(b){b.onclick=function(){
    var i=+b.getAttribute('data-i'),ok=i===q.c;
    E.respostas.push({questao:E.atual+1,escolhida:q.a[i],correta:ok});E.atual++;salvar();tela();
  }});
}
tela();
</script>
</body>
</html>

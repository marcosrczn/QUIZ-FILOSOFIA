<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Filosofia da Ciência | Apostila e Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef;--surface:#fff;--surface-2:#eef3f2;--ink:#1c232b;--ink-2:#4b5560;
  --accent:#0d5a61;--accent-2:#13808a;--accent-ink:#fff;--line:#d5ddda;--box:#e7f2f0;
  --ok:#1f7a45;--ok-bg:#e3f4ea;--bad:#b4372f;--bad-bg:#fbe7e5;--warn:#8a5a00;--warn-bg:#fdf3dc;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11171b;--surface:#182126;--surface-2:#1f2b31;--ink:#e6ecee;--ink-2:#a7b4ba;
  --accent:#5cc3c8;--accent-2:#7fd6da;--accent-ink:#0b1a1d;--line:#2c3a41;--box:#1c3134;
  --ok:#6fd49a;--ok-bg:#183326;--bad:#f28b82;--bad-bg:#3a1d1b;--warn:#f0c46a;--warn-bg:#3a2e14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{
  --bg:#11171b;--surface:#182126;--surface-2:#1f2b31;--ink:#e6ecee;--ink-2:#a7b4ba;
  --accent:#5cc3c8;--accent-2:#7fd6da;--accent-ink:#0b1a1d;--line:#2c3a41;--box:#1c3134;
  --ok:#6fd49a;--ok-bg:#183326;--bad:#f28b82;--bad-bg:#3a1d1b;--warn:#f0c46a;--warn-bg:#3a2e14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.62 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  text-align:justify;hyphens:auto;-webkit-hyphens:auto;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
.hero{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.hero .wrap{padding-top:22px;padding-bottom:18px;position:relative}
.eyebrow{font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 6px;padding-right:52px;text-align:left}
h1{font-size:clamp(1.4rem,4.2vw,2.05rem);line-height:1.2;margin:0 0 12px;text-align:left;padding-right:52px;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0 0 10px;font-size:.92rem;color:var(--ink-2)}
.meta b{color:var(--ink)}
.objs{margin:0 0 10px;font-size:.92rem}
.objs b{display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.84rem;text-align:left}
.goal{margin:0;font-size:.95rem;background:var(--box);border-left:4px solid var(--accent);padding:8px 12px;border-radius:4px}
.theme-btn{position:absolute;top:18px;right:16px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:20px;height:20px}
:root{--tabs-h:72px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;box-shadow:0 2px 8px rgba(20,30,40,.05)}
.tabs .wrap{display:flex;gap:10px}
.tab{appearance:none;flex:1;max-width:260px;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:1.12rem;font-weight:800;
  padding:12px 18px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);cursor:pointer;transition:background .15s,color .15s}
.tab svg{width:22px;height:22px;flex:none}
.tab:hover{background:var(--box)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 10px rgba(13,90,97,.28)}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
main{padding:20px 0 40px}
[hidden]{display:none!important}
.panel-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.dl-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 16px;padding:0 2px;font-size:.86rem;color:var(--ink-2);text-align:left}
.dl-bar>span{margin-right:2px}
.dl-chip{appearance:none;font:inherit;font-size:.84rem;font-weight:600;color:var(--ink-2);background:transparent;border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.dl-chip svg{width:14px;height:14px;flex:none}
.dl-chip:hover{color:var(--accent);border-color:var(--accent)}
.btn{appearance:none;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn svg{width:18px;height:18px;flex:none}
.note{font-size:.86rem;color:var(--ink-2);margin:10px 0 0}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.toc b{font-size:.92rem}
.toc ol{margin:6px 0 0;padding-left:20px;columns:2;column-gap:28px;font-size:.92rem}
.toc a{color:var(--accent);text-decoration:none}
.toc a:hover{text-decoration:underline}
article{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 26px 26px;box-shadow:var(--shadow)}
article h2{font-size:1.38rem;color:var(--accent);margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent);text-align:left;scroll-margin-top:calc(var(--tabs-h) + 12px)}
article h2.flash{animation:flash 2s ease}
@keyframes flash{0%,40%{background:var(--box)}100%{background:transparent}}
article h3{font-size:1.07rem;color:var(--accent);margin:20px 0 6px;text-align:left}
article p{margin:0 0 10px}
article ul,article ol{margin:0 0 12px;padding-left:24px}
article li{margin-bottom:5px}
article li::marker{color:var(--accent);font-weight:700}
.tbl{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
th{background:var(--surface-2);font-weight:700}
tr:last-child td,tr:last-child th{border-bottom:0}
td+td,th+th,th+td{border-left:1px solid var(--line)}
table.small{font-size:.83rem;min-width:760px}
.box{background:var(--box);border-left:4px solid var(--accent);border-radius:6px;padding:10px 14px;margin:8px 0 16px}
.box b.lab{color:var(--accent)}
/* quiz */
.qtop{position:sticky;top:var(--tabs-h);z-index:4}
.qstats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:.92rem;margin-bottom:8px;text-align:left}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:1.25rem;color:var(--accent);text-align:left}
.qnum{font-size:.8rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;text-align:left}
.ctx{margin:0 0 12px}
.cmd{font-weight:700;margin:0 0 12px}
.timer{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 12px;margin:0 0 12px;text-align:left}
.opts{display:grid;gap:8px;margin:0 0 12px;padding:0;list-style:none}
.opt{width:100%;appearance:none;font:inherit;color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;text-align:left}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;font-weight:800;color:var(--accent);min-width:22px}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--box);box-shadow:0 0 0 1px var(--accent) inset}
.opt.correct{background:var(--ok-bg);border-color:var(--ok)}
.opt.correct .l{color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .l{color:var(--bad)}
.opt.dim{opacity:.55}
.fb{border-radius:9px;padding:10px 14px;margin:0 0 12px}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb.no{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb p{margin:0 0 6px}.fb p:last-child{margin:0}
.fb .v{font-weight:800}
.fb.ok .v{color:var(--ok)}.fb.no .v{color:var(--bad)}
.linkbtn{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
.qnav{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;margin:0 0 12px;text-align:left}
.field label{font-weight:700;font-size:.92rem}
.field input{font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
.row2{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.rules{margin:0 0 14px;padding-left:20px}
.rules li{margin-bottom:4px}
.big{font-size:2.6rem;font-weight:800;color:var(--accent);line-height:1;margin:6px 0;text-align:center}
.center{text-align:center}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--accent)}
.stat span{font-size:.82rem;color:var(--ink-2)}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.mid{background:var(--warn-bg);color:var(--warn)}.tag.no{background:var(--bad-bg);color:var(--bad)}
.back-quiz{position:fixed;right:16px;bottom:16px;z-index:20;box-shadow:var(--shadow)}
.overlay{position:fixed;inset:0;background:rgba(10,15,20,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:var(--shadow);text-align:left}
.modal h2{margin:0 0 10px;color:var(--accent);font-size:1.2rem}
footer{border-top:1px solid var(--line);padding:16px 0 28px;font-size:.85rem;color:var(--ink-2)}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prof-link{appearance:none;border:0;background:none;color:var(--ink-2);font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.noprint{display:none}
@media (max-width:600px){
  body{font-size:15.5px;text-align:left}
  .goal,article p,.ctx{text-align:left}
  article{padding:4px 14px 18px}
  .tab{max-width:none;font-size:1.02rem;padding:11px 10px}
  .toc ol{columns:1}
  .card{padding:14px}
  .row2{grid-template-columns:1fr}
  .btn{width:100%}
  .qnav .btn{width:auto;flex:1}
}
@media print{body>*{display:none!important}.noprint{display:block!important;font:18px sans-serif;padding:40px}}
</style>
</head>
<body>
<div class="noprint">Para imprimir, use os botões de download (PDF ou Word) na aba Apostila.</div>
<header class="hero">
  <div class="wrap">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <div class="meta" id="meta"></div>
    <div class="objs"><b>Objetos de conhecimento</b><ul class="chips" id="objs"></ul></div>
    <p class="goal" id="goal"></p>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Alternar modo claro ou escuro" title="Modo claro ou escuro">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<nav class="tabs" aria-label="Seções">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" id="tab-apostila" aria-controls="panel-apostila" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>1. Apostila</button>
    <button class="tab" role="tab" id="tab-quiz" aria-controls="panel-quiz" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>2. Quiz</button>
  </div>
</nav>
<main class="wrap">
  <section id="panel-apostila" role="tabpanel" aria-labelledby="tab-apostila">
    <nav class="panel-card toc" aria-label="Sumário"><b>Sumário</b><ol id="toc"></ol></nav>
    <div class="dl-bar" aria-label="Downloads"><span>Baixar para estudar ou imprimir:</span><button class="dl-chip" type="button" data-file="apostilaPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Apostila em PDF</button><button class="dl-chip" type="button" data-file="quizPdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Quiz em PDF</button><button class="dl-chip" type="button" data-file="apostilaDocx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Apostila em Word</button><button class="dl-chip" type="button" data-file="quizDocx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Quiz em Word</button></div>
    <article id="apostila"></article>
  </section>
  <section id="panel-quiz" role="tabpanel" aria-labelledby="tab-quiz" hidden>
    <div class="panel-card qtop" id="qtop" hidden>
      <div class="qstats"><span id="qpos"></span><span id="qcycle"></span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="qbar"><i></i></div>
    </div>
    <div id="quiz"></div>
  </section>
</main>
<footer><div class="wrap"><span id="footTxt"></span><button class="prof-link" id="profBtn" type="button">Área do professor</button></div></footer>
<button class="btn back-quiz" id="backQuiz" type="button" hidden>Voltar ao quiz</button>
<div id="modalRoot"></div>

<script>
var DATA = {"meta": {"titulo": "Filosofia da Ciência: como o conhecimento científico é produzido", "componente": "Filosofia", "serie": "1ª série, 3º trimestre", "habilidades": "EM13CHS301 e EM13CHS303", "objetos": ["Ciência e técnica", "Filosofia e Ciência/ Filosofia da Ciência", "Método", "Verificação", "Paradigma", "Crise de paradigma", "A ciência como produção social", "Neutralidade científica"], "objetivo": "Compreender a ciência como construção humana, histórica e revisável, analisando seus métodos, paradigmas e relações com a sociedade.", "unidade": "Filosofia da Ciência"}, "apostila": [{"t": "h2", "s": "Introdução"}, {"t": "p", "s": "Vacinas, celulares, previsão do tempo, urnas eletrônicas: a ciência está em quase tudo o que fazemos. Ao mesmo tempo, circulam nas redes sociais “pesquisas” falsas, remédios milagrosos e ataques a cientistas. Como saber em que confiar?"}, {"t": "p", "s": "A **Filosofia da Ciência** não faz experimentos. Ela pergunta: o que torna um conhecimento científico? Como a ciência muda ao longo do tempo? Ela é neutra? Quem a produz e para quê?"}, {"t": "p", "s": "Esta apostila apresenta as respostas de alguns pensadores importantes a essas perguntas. Cada seção traz um pouco de história, as ideias centrais e exemplos do Brasil e do Espírito Santo. No fim de cada seção há um quadro **Para lembrar**. No final, você encontra um quadro-resumo e um glossário."}, {"t": "p", "s": "**Habilidades trabalhadas:** EM13CHS301 e EM13CHS303, que tratam de produção, descarte de resíduos, consumo e sustentabilidade. Por isso, vários exemplos ligam a ciência ao meio ambiente e ao consumo."}, {"t": "h2", "s": "1. Filosofia e Ciência"}, {"t": "h3", "s": "Contexto histórico"}, {"t": "p", "s": "No século VI a.C., em cidades gregas como Mileto, pensadores como **Tales** passaram a explicar a natureza por causas naturais, e não por mitos. Nascia a filosofia, que naquela época incluía o estudo da natureza, dos números, dos astros e do ser humano. Durante cerca de dois mil anos, quem estudava a natureza era chamado de “filósofo natural”."}, {"t": "h3", "s": "Opinião e conhecimento: Platão"}, {"t": "p", "s": "**Platão** (séc. V–IV a.C.) distinguiu dois tipos de crença:"}, {"t": "table", "head": ["", "Opinião (*doxa*)", "Conhecimento (*episteme*)"], "rows": [["O que é", "Crença que pode ser verdadeira ou falsa, sem justificativa", "Crença verdadeira apoiada em razões"], ["De onde vem", "Aparências, costume, “ouvi dizer”", "Raciocínio, argumentos, provas"], ["Pode ser debatida?", "Muda facilmente, sem critério", "Pode ser examinada e defendida com razões"]]}, {"t": "p", "s": "Para Platão, ter uma opinião não basta: conhecer é saber **dar razões** para aquilo em que se acredita. Por isso, a frase “opinião não se discute” não vale para questões sobre fatos. Quem afirma algo sobre o mundo deve mostrar suas razões."}, {"t": "p", "s": "**Exemplo atual:** quando alguém diz “na minha opinião, a Terra é plana”, a pergunta filosófica é: quais são as razões? Fotos de satélite, a sombra redonda da Terra nos eclipses lunares e a navegação são razões que apoiam o conhecimento de que a Terra é aproximadamente esférica."}, {"t": "h3", "s": "A separação entre ciências e filosofia"}, {"t": "p", "s": "As ciências nasceram **dentro da filosofia** e foram se tornando independentes, sobretudo a partir do **século XVII**. Nesse período, Galileu e Newton passaram a estudar a natureza com experimentos e matemática. A principal obra de **Isaac Newton**, de 1687, ainda se chamava *Princípios matemáticos da filosofia natural*. Depois vieram a química (séc. XVIII), a biologia (séc. XIX) e as ciências humanas, como a sociologia e a psicologia (séc. XIX e XX)."}, {"t": "p", "s": "Isso não significa que a filosofia tenha perdido o sentido. As duas fazem perguntas diferentes:"}, {"t": "table", "head": ["Ciência", "Filosofia"], "rows": [["Pergunta **como** as coisas funcionam e o que é possível fazer", "Pergunta pelos **fundamentos**: o que é conhecer, o que é verdade, o que **devemos** fazer"], ["Responde com experimentos, dados e medições", "Responde com conceitos, argumentos e análise crítica"], ["Ex.: é possível editar genes de embriões?", "Ex.: é certo editar genes de embriões? Quem decide?"]]}, {"t": "p", "s": "**Exemplo atual:** em 2018, um cientista chinês anunciou o nascimento de bebês com genes editados e foi condenado em seu país. A ciência mostrou que a técnica era possível. Se ela deve ser usada, e em que casos, é uma pergunta ética, que exige reflexão filosófica e debate público."}, {"t": "h3", "s": "Epistemologia"}, {"t": "p", "s": "A parte da filosofia que estuda o conhecimento chama-se **epistemologia** (ou teoria do conhecimento). Ela pergunta: como sabemos que algo é verdadeiro? O que torna uma teoria confiável? Essas perguntas não são respondidas por um experimento de laboratório, pois tratam dos **fundamentos** de todo experimento. A Filosofia da Ciência é uma parte da epistemologia."}, {"t": "box", "s": "As ciências nasceram dentro da filosofia e se separaram dela principalmente a partir do século XVII. A ciência investiga como o mundo funciona; a filosofia examina os fundamentos do conhecimento e o que devemos fazer. Conhecer, para Platão, é ter uma crença justificada por razões, e não apenas uma opinião."}, {"t": "h2", "s": "2. Ciência e técnica"}, {"t": "h3", "s": "Aristóteles: *techné* e *episteme*"}, {"t": "p", "s": "**Contexto:** Aristóteles (384–322 a.C.) foi aluno de Platão e estudou praticamente todos os campos do saber, da biologia à política. Ele organizou os tipos de conhecimento humano."}, {"t": "p", "s": "Para Aristóteles, a **técnica** (*techné*, em grego) é um verdadeiro saber: o saber-fazer de quem produz algo seguindo regras, como o médico, o construtor ou o artesão. Ela está voltada à **produção** de um resultado. Já a **ciência** (*episteme*) busca conhecer as **causas e os princípios** das coisas, aquilo que explica **por que** algo é como é."}, {"t": "table", "head": ["", "Técnica (*techné*)", "Ciência (*episteme*)"], "rows": [["Objetivo", "Produzir, fazer algo", "Explicar, conhecer as causas"], ["Pergunta principal", "Como fazer?", "Por que é assim?"], ["Exemplo", "Fazer uma panela de barro resistente", "Explicar por que a argila queimada resiste ao calor"]]}, {"t": "p", "s": "Na Antiguidade, técnica e ciência eram atividades bem separadas. Ciência não era sinônimo de laboratório, e a técnica não era vista como “saber teórico”."}, {"t": "p", "s": "**Exemplo atual:** as paneleiras de Goiabeiras, em Vitória, dominam uma técnica tradicional reconhecida como patrimônio cultural do Brasil. Um pesquisador que explica, com física e química, a resistência da panela faz um trabalho de ciência. São saberes diferentes, e ambos são conhecimento."}, {"t": "h3", "s": "Bacon: conhecer para dominar a natureza"}, {"t": "p", "s": "**Contexto:** Francis Bacon (1561–1626) foi um filósofo e político inglês. Viveu no início da ciência moderna, quando as grandes navegações e as invenções (bússola, pólvora, imprensa) mostravam o poder transformador do conhecimento."}, {"t": "p", "s": "Bacon defendeu que o objetivo da ciência é **melhorar a vida humana** e dar ao ser humano **poder sobre a natureza**. Sua ideia costuma ser resumida pela expressão “saber é poder”: quem conhece as causas dos fenômenos pode controlá-los e usá-los. Com isso, a ciência moderna passou a se unir à técnica: conhecer a natureza e transformá-la tornaram-se partes do mesmo projeto."}, {"t": "p", "s": "**Exemplo atual:** esse projeto trouxe remédios, energia elétrica e aumento da produção de alimentos. Mas também contribuiu para o desmatamento, a poluição e a crise hídrica. No Espírito Santo, grande parte da Mata Atlântica original foi derrubada. Por isso, muitos pesquisadores hoje criticam a ideia de **dominar** a natureza e defendem **conviver** com ela de modo sustentável."}, {"t": "h3", "s": "Escola de Frankfurt: a razão instrumental"}, {"t": "p", "s": "**Contexto:** a Escola de Frankfurt reuniu pensadores alemães do século XX, como **Max Horkheimer** e **Theodor Adorno**. Eles viveram o nazismo, as guerras mundiais e a indústria cultural de massa, e se perguntaram como uma sociedade tão avançada tecnicamente pôde produzir tanta destruição."}, {"t": "p", "s": "Para eles, a razão moderna foi se tornando **razão instrumental**: uma razão que só calcula **os meios mais eficientes** para atingir um objetivo, sem perguntar se esse objetivo é justo ou bom para as pessoas. A técnica, então, parece neutra e “apenas eficiente”, mas pode servir à dominação e ao lucro sem que os **fins humanos** sejam discutidos."}, {"t": "p", "s": "**Exemplo atual:** um aplicativo de entregas usa algoritmos que calculam a rota mais rápida e o menor custo. O sistema é eficiente, mas os entregadores enfrentam jornadas longas e punições automáticas. A pergunta crítica é: eficiente para quem e para quê?"}, {"t": "h3", "s": "Técnica, consumo e lixo eletrônico"}, {"t": "p", "s": "As decisões técnicas não são neutras nem naturais: elas envolvem **interesses econômicos** e geram **consequências socioambientais**. Celulares que deixam de receber atualizações em poucos anos estimulam a troca frequente e aumentam o lixo eletrônico. Essa situação é chamada de obsolescência programada quando o produto é feito para durar pouco. Isso não quer dizer que toda tecnologia seja ruim. Quer dizer que as escolhas técnicas podem e devem ser discutidas pela sociedade."}, {"t": "box", "s": "Para Aristóteles, técnica é saber-fazer voltado à produção, e ciência é conhecimento das causas. Bacon uniu ciência e domínio da natureza, ideia hoje criticada pela crise ambiental. A Escola de Frankfurt alerta que a razão instrumental busca eficiência sem discutir os fins humanos."}, {"t": "h2", "s": "3. Método"}, {"t": "p", "s": "**Método** (do grego *méthodos*, “caminho”) é o conjunto de procedimentos usados para chegar a um conhecimento confiável. No século XVII, com a chamada Revolução Científica, vários pensadores discutiram qual seria o melhor caminho. Antes disso, era comum aceitar como verdade o que diziam os textos antigos, como os de Aristóteles, ou as autoridades religiosas."}, {"t": "h3", "s": "Francis Bacon: a indução organizada"}, {"t": "p", "s": "Em sua obra *Novo Órganon* (1620), Bacon criticou quem tira conclusões apressadas ou se apoia na autoridade dos antigos. Ele também alertou para os **ídolos**: preconceitos e ilusões que atrapalham o pensamento, como confiar demais nas primeiras impressões ou nas palavras usadas pelo senso comum."}, {"t": "p", "s": "Seu método é a **indução**: partir da **observação de muitos casos particulares** para chegar a uma **lei geral**. Mas não é qualquer observação. Bacon propôs registrar os casos de forma **sistemática**, em tabelas:"}, {"t": "ul", "items": ["casos em que o fenômeno **aparece**;", "casos em que o fenômeno **não aparece**, embora as condições sejam parecidas;", "casos em que ele aparece **com mais ou menos intensidade**."]}, {"t": "p", "s": "Comparando essas tabelas, o investigador descobre a causa do fenômeno."}, {"t": "p", "s": "**Exemplo atual:** a Defesa Civil registra por anos onde houve e onde não houve deslizamentos, anotando a inclinação, a chuva e a vegetação. Comparando os dados, chega a uma regra geral sobre as áreas de risco."}, {"t": "h3", "s": "Galileu Galilei: experimento e matemática"}, {"t": "p", "s": "**Galileu** (1564–1642) foi um físico e astrônomo italiano. Na tradição de Aristóteles, o movimento era explicado pelas **qualidades** e pelas **finalidades** de cada corpo: uma pedra cairia porque seu “lugar natural” é embaixo. Galileu mudou essa forma de explicar."}, {"t": "p", "s": "Para ele, a natureza deve ser estudada por meio de **experimentos controlados** e descrita em **linguagem matemática**. Ele mediu, por exemplo, o tempo que bolas levavam para descer planos inclinados e encontrou relações numéricas entre distância e tempo. Nascia a física moderna."}, {"t": "p", "s": "**Exemplo atual:** quando estudantes soltam bolinhas em uma rampa, medem o tempo com o celular e montam uma tabela para encontrar uma relação matemática, estão seguindo o caminho de Galileu."}, {"t": "h3", "s": "René Descartes: as regras do método"}, {"t": "p", "s": "**Descartes** (1596–1650) foi um filósofo e matemático francês. Em uma época de dúvidas e disputas entre escolas, ele buscou um caminho seguro para a razão. Em *Discurso do método* (1637), propôs quatro regras:"}, {"t": "ol", "items": ["**Evidência:** só aceitar como verdadeiro o que for claro e distinto, sem nenhuma dúvida, evitando a pressa e o preconceito.", "**Análise:** dividir cada dificuldade em quantas partes forem necessárias.", "**Ordem (síntese):** conduzir o pensamento do **mais simples ao mais complexo**.", "**Enumeração:** fazer revisões completas para ter certeza de que nada foi esquecido."]}, {"t": "p", "s": "Descartes confiava mais na **razão** do que nos sentidos, que às vezes nos enganam."}, {"t": "p", "s": "**Exemplo atual:** uma turma que investiga os alagamentos de sua rua divide o problema em partes (galerias, lixo, impermeabilização), começa pela parte mais simples e, no fim, revisa tudo. Esse é o caminho de Descartes."}, {"t": "h3", "s": "O método hipotético-dedutivo"}, {"t": "p", "s": "A ciência atual costuma combinar observação e raciocínio no **método hipotético-dedutivo**:"}, {"t": "ol", "items": ["Diante de um problema, o pesquisador formula uma **hipótese** (uma explicação provisória).", "**Deduz** consequências: “Se a hipótese for verdadeira, então deve acontecer tal coisa.”", "**Testa** essas consequências com observações ou experimentos.", "Se o resultado contrariar a previsão, a hipótese é rejeitada ou revista. Se confirmar, ela é mantida, mas continua aberta a novos testes."]}, {"t": "p", "s": "**Exemplo atual:** agentes de saúde suspeitam que pneus velhos explicam o aumento da dengue. Deduzem que, se retirarem os pneus, os focos devem diminuir. Retiram os pneus e acompanham os números."}, {"t": "h3", "s": "Comparando os métodos"}, {"t": "table", "head": ["Pensador", "Ponto de partida", "Caminho", "Palavra-chave"], "rows": [["Bacon", "Observação de muitos casos", "Do particular ao geral, com tabelas", "Indução"], ["Galileu", "Experimento controlado", "Medir e expressar em números", "Matematização"], ["Descartes", "Razão e dúvida", "Dividir, ir do simples ao complexo, revisar", "Análise e ordem"], ["Hipotético-dedutivo", "Problema e hipótese", "Deduzir consequências e testar", "Teste"]]}, {"t": "box", "s": "Bacon defendeu a indução, com observação sistemática de casos; Galileu uniu experimento e matemática; Descartes propôs dividir problemas e ir do simples ao complexo. O método hipotético-dedutivo formula hipóteses, deduz consequências e as testa."}, {"t": "h2", "s": "4. Verificação"}, {"t": "h3", "s": "O problema da indução"}, {"t": "p", "s": "No século XVIII, o filósofo escocês **David Hume** apontou um problema: por mais casos que observemos, nada garante que o próximo será igual. Ver o sol nascer milhares de vezes não **prova** logicamente que ele nascerá amanhã. Esse é o **problema da indução**: o acúmulo de casos favoráveis não garante a verdade de uma afirmação **universal** (que vale para todos os casos, como “todo metal se dilata com o calor”)."}, {"t": "h3", "s": "O Círculo de Viena: o princípio de verificação"}, {"t": "p", "s": "**Contexto:** nas décadas de 1920 e 1930, um grupo de filósofos e cientistas de Viena, na Áustria, ficou conhecido como **Círculo de Viena**. Seus membros, chamados **positivistas lógicos** (como Moritz Schlick e Rudolf Carnap), queriam separar o conhecimento científico de discursos sem base na experiência."}, {"t": "p", "s": "Eles propuseram o **princípio de verificação**: uma afirmação só tem sentido se puder ser **verificada (comprovada) pela experiência**. Afirmações que nenhuma experiência pode comprovar seriam, para eles, sem sentido."}, {"t": "h3", "s": "Karl Popper: a falseabilidade"}, {"t": "p", "s": "**Contexto:** **Karl Popper** (1902–1994), filósofo austríaco que depois viveu na Inglaterra, conviveu com o Círculo de Viena, mas discordou dele. Sua obra *A lógica da pesquisa científica* foi publicada em 1934."}, {"t": "p", "s": "Popper partiu do problema da indução: leis universais **nunca podem ser comprovadas de modo definitivo**, porque sempre pode surgir um caso novo. Mas existe uma **assimetria**: milhões de casos favoráveis não provam uma lei universal, enquanto **um único caso contrário bem estabelecido pode refutá-la** (mostrar que é falsa)."}, {"t": "p", "s": "Por isso, Popper trocou a verificação pela **falseabilidade** (ou refutabilidade) como **critério de demarcação**, isto é, critério para distinguir **ciência de não ciência**:"}, {"t": "ul", "items": ["Uma teoria é **científica** se é formulada de modo que algum fato possível poderia **mostrar que ela está errada**.", "Uma afirmação feita de modo que **nenhum fato** poderia contrariá-la **não é científica**. Isso não quer dizer que seja falsa: quer dizer que ela não pode ser testada.", "O bom cientista procura **testar** suas teorias com rigor, buscando situações que possam refutá-las. Teorias que resistem aos testes ficam **corroboradas**, mas continuam **provisórias**, nunca verdades absolutas."]}, {"t": "table", "head": ["", "Círculo de Viena (verificação)", "Popper (falseabilidade)"], "rows": [["Pergunta", "A afirmação pode ser comprovada pela experiência?", "A afirmação pode ser refutada pela experiência?"], ["Casos favoráveis", "Confirmam a teoria", "Não provam a teoria de forma definitiva"], ["Um caso contrário", "É um problema", "Pode refutar uma lei universal"], ["Status da teoria", "Verificada", "Provisória, corroborada enquanto resistir aos testes"]]}, {"t": "h3", "s": "Exemplos atuais"}, {"t": "ul", "items": ["**Horóscopo:** uma previsão como “esta semana você terá desafios, mas também boas surpresas” serve para qualquer pessoa em qualquer semana. Nenhum fato poderia mostrar que ela errou. Por isso, pelo critério de Popper, **não é científica**. (Popper usava a astrologia como exemplo.)", "**“Remédio” nas redes:** “tomei chá e o resfriado sumiu, e centenas de seguidores dizem o mesmo”. Muitos casos favoráveis não provam a eficácia, pois o resfriado costuma passar sozinho. Seria preciso um teste rigoroso, que comparasse quem tomou e quem não tomou o chá.", "**O sabiá:** depois de ouvir sabiás cantarem em 200 manhãs, alguém conclui que “todos os sabiás só cantam de manhã”. Basta ouvir um sabiá cantando à noite para refutar essa afirmação universal.", "**Einstein e Sobral:** a teoria da relatividade previa que a luz das estrelas se curvaria perto do Sol em um valor preciso. Era uma previsão arriscada, que poderia falhar. Observações do eclipse de 1919, feitas em Sobral (CE) e na África, confirmaram a previsão. Popper via nesse caso um modelo de teoria científica."]}, {"t": "box", "s": "Muitos casos favoráveis não provam uma lei universal, mas um único caso contrário pode refutá-la. Por isso, Popper substituiu a verificação defendida pelo Círculo de Viena pela falseabilidade como critério para separar ciência de não ciência."}, {"t": "h2", "s": "5. Paradigma"}, {"t": "h3", "s": "Contexto"}, {"t": "p", "s": "**Thomas Kuhn** (1922–1996) foi um físico e historiador da ciência norte-americano. Ao estudar a história da ciência, percebeu que ela não avança só acumulando descobertas, uma após a outra. Expôs suas ideias em *A estrutura das revoluções científicas* (1962), um dos livros de filosofia mais lidos do século XX."}, {"t": "h3", "s": "O que é um paradigma"}, {"t": "p", "s": "Para Kuhn, um **paradigma** é o conjunto de **teorias, métodos, problemas considerados importantes e exemplos de soluções** compartilhado por uma **comunidade científica** em certa época. É como uma “forma de ver” que os cientistas aprendem durante a formação, nos livros didáticos e nos exercícios dos manuais."}, {"t": "p", "s": "Um paradigma **não é**:"}, {"t": "ul", "items": ["uma opinião individual de um cientista (ele é **compartilhado** por uma comunidade);", "uma lei eterna (ele é **histórico** e pode ser substituído);", "um método único válido para todas as ciências e épocas (cada área tem os seus paradigmas, que mudam com o tempo)."]}, {"t": "p", "s": "**Exemplo atual:** a **teoria dos germes** (muitas doenças são causadas por microrganismos) é um paradigma da medicina. Ela orienta a esterilização de instrumentos, a higiene hospitalar e a pesquisa de vacinas, e é ensinada em todos os cursos de saúde."}, {"t": "h3", "s": "Ciência normal"}, {"t": "p", "s": "Na maior parte do tempo, os cientistas trabalham **dentro de um paradigma aceito**, sem questionar seus fundamentos. Kuhn chama esse período de **ciência normal**. Nele, os pesquisadores resolvem problemas específicos, que Kuhn compara a **quebra-cabeças**: o paradigma garante que há uma solução, e o desafio é encontrá-la."}, {"t": "p", "s": "**Exemplo atual:** pesquisadores do Incaper, instituto de pesquisa agrícola do Espírito Santo, desenvolvem variedades de café conilon mais resistentes à seca. Eles usam as teorias da genética já aceitas e métodos consagrados para resolver problemas concretos. É ciência normal."}, {"t": "h3", "s": "A resistência a ideias novas"}, {"t": "p", "s": "Como o paradigma orienta o que os cientistas consideram um problema e uma evidência válida, **ideias incompatíveis com ele tendem a enfrentar resistência**, mesmo quando trazem dados favoráveis. Isso não ocorre por maldade: os cientistas avaliam as novidades a partir da “forma de ver” que aprenderam."}, {"t": "p", "s": "**Exemplo histórico:** na década de 1840, o médico **Ignaz Semmelweis** mostrou que a morte de mulheres após o parto caía muito quando os médicos lavavam as mãos. Mesmo assim, foi rejeitado por muitos colegas, pois ainda não se aceitava que agentes invisíveis nas mãos pudessem transmitir doenças. Só décadas depois, com a teoria dos germes, a ideia foi aceita."}, {"t": "box", "s": "Paradigma, para Kuhn, é o conjunto de teorias, métodos e exemplos compartilhado por uma comunidade científica. Na ciência normal, os cientistas resolvem problemas dentro dele, e ideias incompatíveis com o paradigma tendem a sofrer resistência."}, {"t": "h2", "s": "6. Crise de paradigma e revolução científica"}, {"t": "p", "s": "Para Kuhn, a história da ciência alterna longos períodos de ciência normal com mudanças profundas, as **revoluções científicas**. O caminho costuma ser este:"}, {"t": "ol", "items": ["**Ciência normal:** os cientistas resolvem problemas dentro do paradigma.", "**Anomalias:** surgem fatos que o paradigma não consegue explicar. No início, são tratados como erros de medição ou problemas a resolver depois. **Uma anomalia isolada não leva ao abandono imediato** do paradigma.", "**Crise:** quando as anomalias **persistem** e se acumulam, a confiança no paradigma diminui. Surgem **versões rivais** da mesma teoria, nenhuma satisfatória, e os cientistas passam a **debater os fundamentos** da área.", "**Revolução científica:** um novo paradigma, capaz de resolver as anomalias, ganha a adesão da comunidade.", "**Nova ciência normal:** o ciclo recomeça, agora com o novo paradigma."]}, {"t": "h3", "s": "O que muda numa revolução"}, {"t": "p", "s": "Uma revolução não é só uma correção de cálculos. Mudam os **conceitos**, os **problemas** considerados importantes e a própria **visão de mundo** dos cientistas. Kuhn chegou a dizer que, depois de uma revolução, é como se os cientistas passassem a viver em um mundo diferente. A troca de paradigma não se decide só por uma prova lógica: envolve argumentos, evidências e também a persuasão da comunidade. Ainda assim, não é uma escolha arbitrária, como uma votação sem argumentos."}, {"t": "p", "s": "Por isso, para Kuhn, a ciência **não progride de forma linear e cumulativa**: há **rupturas**."}, {"t": "h3", "s": "Exemplos"}, {"t": "ul", "items": ["**Copérnico (séc. XVI):** o modelo com a Terra no centro do universo exigia cada vez mais ajustes, e os astrônomos criavam versões diferentes, nenhuma satisfatória. Era uma crise. Copérnico propôs que a Terra gira em torno do Sol. Com isso, a Terra deixou de ser o centro imóvel do universo, conceitos de movimento foram repensados e surgiram novos problemas. A aceitação foi lenta e cercada de disputas.", "**Newton e Einstein (séc. XX):** a física de Newton explicava com enorme sucesso o movimento dos planetas, mas a órbita de Mercúrio apresentava um pequeno desvio que resistiu por décadas. A teoria da relatividade de Einstein explicou esse desvio, e o eclipse observado em Sobral (CE) em 1919 ajudou a confirmá-la. A física de Newton **não foi descartada como “errada em tudo”**: ela continua útil em muitas situações do dia a dia, mas os conceitos de espaço e tempo mudaram profundamente."]}, {"t": "table", "head": ["Fase", "O que acontece", "Exemplo"], "rows": [["Ciência normal", "Resolução de problemas dentro do paradigma", "Astrônomos calculam órbitas com o modelo geocêntrico"], ["Anomalias", "Fatos que não se encaixam", "Previsões dos planetas que não batem"], ["Crise", "Versões rivais e debate sobre fundamentos", "Vários modelos ajustados, nenhum satisfatório"], ["Revolução", "Novo paradigma é adotado", "Modelo heliocêntrico de Copérnico"]]}, {"t": "box", "s": "Anomalias persistentes podem gerar uma crise de paradigma, marcada por versões rivais e debate sobre os fundamentos. A revolução científica troca o paradigma e transforma conceitos, problemas e a visão de mundo; para Kuhn, a ciência avança com rupturas, e não de forma linear."}, {"t": "h2", "s": "7. A ciência como produção social"}, {"t": "h3", "s": "Contexto"}, {"t": "p", "s": "Durante muito tempo, a ciência foi imaginada como obra de **gênios isolados** que descobrem verdades sozinhos. No século XX, sociólogos e filósofos mostraram outra imagem: a ciência é uma **atividade coletiva e histórica**, feita por pessoas, em instituições, com recursos e em determinado contexto social. Um dos primeiros a estudar isso foi o sociólogo norte-americano **Robert Merton** (1910–2003). Kuhn, ao mostrar o papel das comunidades científicas, reforçou essa visão."}, {"t": "h3", "s": "Ideias centrais"}, {"t": "p", "s": "**1. A ciência depende de condições sociais.** Para existir pesquisa, são necessários universidades, laboratórios, financiamento, formação de cientistas e cooperação entre grupos e países."}, {"t": "p", "s": "**2. A sociedade influencia o que se pesquisa.** Interesses econômicos, políticos e sociais ajudam a definir **quais problemas** recebem atenção e dinheiro. Os temas não são escolhidos apenas pela curiosidade de cada cientista."}, {"t": "p", "s": "**3. O conhecimento é validado coletivamente.** Um resultado só é aceito depois de passar pela **crítica de outros cientistas**. Isso acontece na **revisão por pares**, quando especialistas avaliam um estudo antes da publicação, e nas tentativas de repetir os experimentos. Merton chamou essa atitude de **ceticismo organizado**: a comunidade duvida e examina antes de aceitar. Fama, número de seguidores ou compartilhamentos não validam um estudo."}, {"t": "p", "s": "**4. O valor de uma afirmação não depende de quem a faz.** Merton chamou esse princípio de **universalismo**: um resultado deve ser julgado pelas provas e pelos argumentos, e não pela origem, pelo gênero ou pela cor de quem o apresenta. Mas **quem pode fazer ciência**, e em que condições, depende da sociedade. Por isso, a história da exclusão e da inclusão de grupos sociais faz parte da história do conhecimento."}, {"t": "h3", "s": "Exemplos atuais"}, {"t": "ul", "items": ["**Vacinas da covid-19:** o Instituto Butantan e a Fiocruz produziram vacinas usadas em todo o Brasil. Isso exigiu verbas públicas, acordos internacionais, pesquisadores formados em universidades públicas e milhares de voluntários.", "**Doenças negligenciadas:** doenças como a de Chagas e a leishmaniose afetam sobretudo populações pobres e recebem pouco investimento da indústria farmacêutica, porque dão pouco lucro. No Brasil, boa parte da pesquisa sobre elas é feita por instituições públicas.", "**Estudos sem revisão na pandemia:** estudos ainda não avaliados por outros cientistas circularam nas redes como “prova” de remédios. Depois da revisão, vários foram corrigidos ou retirados por erros de método.", "**Quem faz ciência:** o filme *Estrelas Além do Tempo* mostra matemáticas negras na Nasa dos anos 1960, que enfrentaram a segregação racial. No Brasil, a Lei de Cotas (2012) ampliou o acesso de estudantes de escolas públicas, negros e indígenas às universidades federais, onde se faz grande parte da pesquisa do país."]}, {"t": "box", "s": "A ciência é uma atividade coletiva, que depende de instituições, financiamento e cooperação. Interesses sociais influenciam o que se pesquisa, e o conhecimento é validado pela crítica e revisão da comunidade científica, não pela fama nem pelos compartilhamentos."}, {"t": "h2", "s": "8. Neutralidade científica"}, {"t": "h3", "s": "Contexto"}, {"t": "p", "s": "A partir do século XIX, ganhou força a ideia de que a ciência é **neutra**: ela apenas descreveria os fatos, livre de valores, interesses e escolhas humanas. No século XX, as bombas atômicas, a poluição industrial e o uso da ciência por governos e empresas levaram muitos pensadores, como os da Escola de Frankfurt, a questionar essa ideia."}, {"t": "h3", "s": "Objetividade não é o mesmo que neutralidade"}, {"t": "p", "s": "É preciso separar dois conceitos:"}, {"t": "table", "head": ["", "Objetividade", "Neutralidade"], "rows": [["O que significa", "Buscar resultados que possam ser testados e conferidos por outras pessoas, com métodos controlados", "Ausência total de valores, interesses e escolhas humanas"], ["É possível?", "Sim, é um ideal que a ciência persegue e pode alcançar em grande medida", "É difícil: escolhas e interesses aparecem no tema, no financiamento, nos dados e no uso dos resultados"]]}, {"t": "p", "s": "Para Popper, a objetividade da ciência não vem de cada cientista ser imparcial, e sim da possibilidade de as teorias serem **testadas e criticadas por outros**. Por isso, **submeter um resultado à crítica de pessoas independentes** reduz o peso de interesses particulares."}, {"t": "h3", "s": "Onde aparecem interesses e valores"}, {"t": "ul", "items": ["**Na escolha dos temas e no financiamento:** quem paga a pesquisa pode influenciar o que se estuda e como os resultados são divulgados. Isso se chama **conflito de interesses**.", "**Na construção das tecnologias:** os dados e as escolhas feitas por quem cria um sistema podem **reproduzir desigualdades sociais**.", "**No uso dos resultados:** laudos e estudos podem ser usados por grupos com interesses opostos."]}, {"t": "h3", "s": "Dois erros a evitar"}, {"t": "ol", "items": ["**Achar que a ciência é totalmente neutra**, só porque usa números, gráficos ou procedimentos padronizados.", "**Achar que, como não há neutralidade total, tudo vale o mesmo**: que estudos científicos são meras opiniões ou que todos os laudos se equivalem. A resposta aos interesses não é abandonar a ciência, mas exigir **transparência, revisão e crítica independente**, e ouvir também os grupos afetados."]}, {"t": "h3", "s": "Exemplos atuais"}, {"t": "ul", "items": ["**Indústria do cigarro:** durante décadas, empresas de cigarro financiaram estudos e divulgaram pesquisas que lançavam dúvidas sobre a relação entre fumo e câncer. Documentos internos revelados depois mostraram que elas já conheciam os riscos. Hoje, revistas científicas exigem que os autores declarem quem financiou a pesquisa.", "**Reconhecimento facial:** pesquisas apontam que muitos sistemas usados na segurança pública erram mais ao identificar pessoas negras, porque foram treinados com bancos de imagens pouco diversos. O problema está também na forma como a tecnologia foi feita, e não só no uso.", "**Barragem de Fundão (2015):** o rompimento em Mariana (MG) lançou rejeitos de minério no Rio Doce, que chegaram ao litoral do Espírito Santo. Empresas, órgãos públicos e comunidades atingidas apresentam laudos diferentes sobre a água e os danos. A ciência busca objetividade, mas sua produção e uso envolvem interesses em conflito.", "**Urnas eletrônicas:** antes das eleições, o Tribunal Superior Eleitoral realiza o Teste Público de Segurança, em que especialistas independentes tentam encontrar falhas nas urnas. As falhas encontradas são corrigidas. A crítica externa aumenta a confiança no sistema."]}, {"t": "box", "s": "A ciência busca objetividade, mas não é totalmente neutra, pois interesses e valores aparecem no financiamento, na construção das tecnologias e no uso dos resultados. A resposta não é desacreditar a ciência, e sim exigir transparência e crítica independente."}, {"t": "h2", "s": "9. Ciência no mundo contemporâneo"}, {"t": "p", "s": "As ideias desta apostila ajudam a enfrentar três desafios do Brasil de hoje."}, {"t": "h3", "s": "Desinformação"}, {"t": "p", "s": "Nas redes sociais, “estudos” falsos e relatos pessoais circulam como se fossem provas. A Filosofia da Ciência oferece perguntas úteis para checar uma informação:"}, {"t": "table", "head": ["Pergunta", "Conceito por trás"], "rows": [["Quais são as razões e provas dessa afirmação?", "Opinião x conhecimento (Platão)"], ["São só casos favoráveis ou houve um teste rigoroso?", "Problema da indução e falseabilidade (Popper)"], ["A afirmação poderia ser desmentida por algum fato?", "Critério de demarcação (Popper)"], ["O estudo foi revisado por outros cientistas?", "Validação coletiva e ceticismo organizado (Merton)"], ["Quem financiou e quem ganha com isso?", "Neutralidade e conflito de interesses"]]}, {"t": "h3", "s": "Consumo e meio ambiente"}, {"t": "p", "s": "O projeto moderno de dominar a natureza (Bacon) e a busca de eficiência sem discutir os fins (razão instrumental) ajudam a entender problemas como o lixo eletrônico, o desmatamento e a crise hídrica. A indústria e a publicidade estimulam a troca constante de produtos, criando “necessidades” que geram mais resíduos. Pensar criticamente sobre a técnica é condição para práticas de **consumo responsável** e **sustentabilidade socioambiental**, temas das habilidades EM13CHS301 e EM13CHS303."}, {"t": "h3", "s": "Confiar na ciência sem idolatrá-la"}, {"t": "p", "s": "A ciência é o modo mais confiável que temos para conhecer o mundo natural, mas é uma **construção humana**: provisória, sujeita a revisões e a interesses. Isso não é um defeito que a desqualifica. É exatamente por aceitar a crítica e a revisão que a ciência se corrige ao longo do tempo. Cabe à sociedade, inclusive aos estudantes, participar do debate sobre seus usos."}, {"t": "box", "s": "Os conceitos da Filosofia da Ciência servem para checar informações, discutir o consumo e o meio ambiente e confiar na ciência de forma crítica, entendendo-a como construção humana que se corrige pela crítica."}, {"t": "h2", "s": "Quadro-resumo"}, {"t": "table", "small": true, "widths": [0.15, 0.1, 0.2, 0.3, 0.25], "head": ["Autor/tema", "Época", "Obra", "Ideias-chave", "Exemplo atual"], "rows": [["Platão", "Séc. V–IV a.C.", "*A República*", "Diferença entre opinião (*doxa*) e conhecimento justificado por razões (*episteme*)", "“Na minha opinião, a Terra é plana”"], ["Aristóteles", "Séc. IV a.C.", "*Metafísica*; *Ética a Nicômaco*", "Técnica (*techné*) é saber-fazer voltado à produção; ciência (*episteme*) busca causas", "Paneleiras de Goiabeiras e pesquisa sobre a argila"], ["Filosofia e Ciência", "Da Grécia ao séc. XVII", "Newton, *Princípios matemáticos da filosofia natural* (1687)", "Ciências nascem na filosofia e se separam a partir do séc. XVII; filosofia examina fundamentos e valores", "Debate ético sobre edição genética de embriões"], ["Francis Bacon", "1561–1626", "*Novo Órganon* (1620)", "Indução com observação sistemática; ídolos; conhecer para dominar a natureza", "Mapeamento de áreas de deslizamento; desmatamento da Mata Atlântica"], ["Galileu Galilei", "1564–1642", "*Duas novas ciências* (1638)", "Experimento controlado e linguagem matemática", "Bolinhas na rampa medidas com o celular"], ["René Descartes", "1596–1650", "*Discurso do método* (1637)", "Evidência, análise, ordem do simples ao complexo, enumeração", "Investigação dos alagamentos da rua"], ["Método hipotético-dedutivo", "Ciência atual", "Sem obra única", "Hipótese, dedução de consequências e teste", "Pneus velhos e focos de dengue"], ["David Hume", "Séc. XVIII", "*Investigação sobre o entendimento humano* (1748)", "Problema da indução: casos passados não garantem os futuros", "“Remédio” com muitos relatos favoráveis"], ["Círculo de Viena", "Décadas de 1920–1930", "Sem obra única", "Princípio de verificação: só tem sentido o que a experiência pode comprovar", "Discussões sobre o que é ciência"], ["Karl Popper", "1902–1994", "*A lógica da pesquisa científica* (1934)", "Falseabilidade como critério de demarcação; teorias provisórias; um caso contrário refuta", "Horóscopo; o sabiá que canta à noite"], ["Thomas Kuhn", "1922–1996", "*A estrutura das revoluções científicas* (1962)", "Paradigma, ciência normal, anomalias, crise e revolução", "Teoria dos germes; Copérnico; Einstein e Sobral"], ["Robert Merton", "1910–2003", "Estudos de sociologia da ciência", "Ciência como atividade coletiva; ceticismo organizado; universalismo", "Vacinas do Butantan e da Fiocruz; revisão por pares"], ["Escola de Frankfurt (Horkheimer e Adorno)", "Séc. XX", "*Dialética do esclarecimento* (1947)", "Razão instrumental: eficiência dos meios sem discutir os fins", "Algoritmos dos aplicativos de entrega"], ["Neutralidade científica", "Debate dos séc. XX e XXI", "Sem obra única", "Ciência busca objetividade, mas envolve interesses; exige transparência e crítica", "Cigarro; reconhecimento facial; Fundão; teste das urnas"]]}, {"t": "h2", "s": "Glossário"}, {"t": "ul", "items": ["**Anomalia:** fato que o paradigma vigente não consegue explicar.", "**Ceticismo organizado:** atitude da comunidade científica de duvidar e examinar criticamente um resultado antes de aceitá-lo (Merton).", "**Ciência (*episteme*):** para os gregos, conhecimento das causas e dos princípios, justificado por razões.", "**Ciência normal:** período em que os cientistas resolvem problemas dentro de um paradigma aceito, sem questionar seus fundamentos (Kuhn).", "**Círculo de Viena:** grupo de filósofos e cientistas das décadas de 1920 e 1930 que defendeu o princípio de verificação.", "**Conflito de interesses:** situação em que interesses particulares, como os de quem financia uma pesquisa, podem influenciar seus resultados.", "**Corroboração:** situação de uma teoria que resistiu a testes rigorosos; ela é mantida, mas continua provisória (Popper).", "**Crise de paradigma:** fase em que anomalias persistentes abalam a confiança no paradigma, surgem versões rivais e os fundamentos são debatidos (Kuhn).", "**Critério de demarcação:** critério para distinguir o que é ciência do que não é.", "**Dedução:** raciocínio que tira uma conclusão necessária a partir de premissas, como em “se a hipótese for verdadeira, então deve acontecer tal coisa”.", "***Doxa*:** palavra grega para opinião, crença sem justificativa segura.", "**Epistemologia:** parte da filosofia que estuda o conhecimento, seus fundamentos e seus limites; também chamada de teoria do conhecimento.", "**Falseabilidade:** característica de uma teoria formulada de modo que algum fato possível poderia mostrar que ela está errada; para Popper, é o que torna uma teoria científica.", "**Hipótese:** explicação provisória para um problema, que deve ser testada.", "**Hipotético-dedutivo (método):** método que formula hipóteses, deduz suas consequências e as testa por observação ou experimento.", "**Ídolos:** para Bacon, preconceitos e ilusões que atrapalham o conhecimento.", "**Indução:** raciocínio que parte de casos particulares para chegar a uma conclusão geral.", "**Lei universal:** afirmação que vale para todos os casos de certo tipo, como “todo metal se dilata com o calor”.", "**Método:** conjunto de procedimentos usados para chegar a um conhecimento confiável; do grego *méthodos*, “caminho”.", "**Neutralidade científica:** ideia de que a ciência estaria livre de valores, interesses e escolhas humanas.", "**Objetividade:** busca de resultados que possam ser testados e conferidos por outras pessoas, independentemente de quem os produziu.", "**Obsolescência programada:** prática de fabricar produtos para durarem pouco ou ficarem ultrapassados rapidamente, estimulando novas compras.", "**Paradigma:** conjunto de teorias, métodos, problemas e exemplos compartilhado por uma comunidade científica em certa época (Kuhn).", "**Positivismo lógico:** corrente do Círculo de Viena que valorizava a lógica e a experiência como bases do conhecimento.", "**Princípio de verificação:** ideia de que uma afirmação só tem sentido se puder ser comprovada pela experiência.", "**Problema da indução:** dificuldade apontada por Hume: casos observados no passado não garantem logicamente que os próximos serão iguais.", "**Razão instrumental:** razão que só calcula os meios mais eficientes para um objetivo, sem discutir se os fins são justos (Escola de Frankfurt).", "**Refutar:** mostrar que uma afirmação ou teoria é falsa.", "**Revisão por pares:** avaliação de um estudo por outros especialistas antes de sua publicação.", "**Revolução científica:** substituição de um paradigma por outro, com mudança de conceitos, problemas e visão de mundo (Kuhn).", "**Técnica (*techné*):** para Aristóteles, saber-fazer voltado à produção de algo, seguindo regras.", "**Universalismo:** princípio de que um resultado científico deve ser julgado pelas provas, e não por quem o apresenta (Merton)."]}], "quiz": [{"tema": "A ciência como produção social", "ctx": "Durante a pandemia de covid-19, o Instituto Butantan, em São Paulo, e a Fiocruz, no Rio de Janeiro, produziram vacinas aplicadas em todo o país, inclusive no Espírito Santo. Esse trabalho envolveu verbas públicas, acordos com laboratórios de outros países, centenas de pesquisadores formados em universidades públicas e testes com milhares de voluntários.", "cmd": "A situação descrita evidencia que a ciência", "opts": ["é obra de gênios isolados, sem relação com as condições sociais da época.", "avança apenas quando se mantém distante das demandas e problemas da sociedade.", "depende de instituições, financiamento e cooperação, sendo atividade coletiva.", "resulta da aplicação mecânica de um método, sem nenhuma influência do contexto.", "só é válida quando seus resultados são aprovados pela maioria da população."], "exp": "A produção das vacinas dependeu de instituições, verbas públicas, cooperação internacional e voluntários. A ciência é uma atividade coletiva e social, e não obra de gênios isolados.", "sec": 7, "secTitle": "7. A ciência como produção social"}, {"tema": "Neutralidade científica", "ctx": "Governos estaduais brasileiros passaram a usar câmeras de reconhecimento facial na segurança pública. Pesquisas nacionais e internacionais, porém, apontam que muitos desses sistemas erram mais ao identificar pessoas negras, pois foram treinados com bancos de imagens pouco diversos. Há registros de pessoas abordadas por engano.", "cmd": "O caso põe em questão a ideia de neutralidade científica porque", "opts": ["escolhas humanas na criação da tecnologia podem reproduzir desigualdades.", "toda tecnologia é necessariamente nociva e deveria ser proibida na segurança.", "dados numéricos são sempre objetivos e, por esse motivo, não podem conter erros.", "a ciência só é neutra quando produzida por empresas privadas e independentes.", "o erro decorre só do uso feito pelos policiais, e não de como o sistema é feito."], "exp": "Os sistemas erram mais com pessoas negras por causa dos bancos de imagens usados no treino. Escolhas feitas na construção da tecnologia podem reproduzir desigualdades, e o problema não está só no uso.", "sec": 8, "secTitle": "8. Neutralidade científica"}, {"tema": "Método (Descartes)", "ctx": "Após chuvas fortes, uma turma de uma escola estadual da Grande Vitória decidiu investigar por que sua rua alaga. Os estudantes separaram o problema em partes: o tamanho das galerias pluviais, o lixo jogado nas bocas de lobo e a impermeabilização dos terrenos. Começaram pela parte mais simples, avançaram para as mais complicadas e, no fim, revisaram tudo para conferir se nada foi esquecido.", "cmd": "O procedimento da turma aproxima-se do método proposto por René Descartes, que recomenda", "opts": ["acumular observações até que a natureza revele, por si mesma, as suas leis gerais.", "aceitar como verdadeiro aquilo que é defendido pelas autoridades no assunto.", "testar as hipóteses procurando ativamente situações que possam refutá-las.", "confiar nos sentidos como fonte segura e suficiente de todo o conhecimento.", "dividir as dificuldades em partes e conduzir o pensamento do simples ao complexo."], "exp": "Dividir o problema em partes, ir do simples ao complexo e revisar tudo são regras do Discurso do método. Buscar a refutação de hipóteses é uma ideia de Popper, e não de Descartes.", "sec": 3, "secTitle": "3. Método"}, {"tema": "Ciência e técnica (Aristóteles)", "ctx": "As paneleiras de Goiabeiras, em Vitória, fazem panelas de barro com técnicas passadas de geração em geração. Seu ofício é reconhecido como patrimônio cultural imaterial do Brasil. Um engenheiro de materiais da Ufes estuda essas panelas para explicar, com teorias da física e da química, por que a argila queimada resiste tão bem ao calor.", "cmd": "Com base na distinção feita por Aristóteles entre técnica (techné) e ciência (episteme), conclui-se que", "opts": ["o saber das paneleiras não é conhecimento, pois não envolve entendimento algum.", "a técnica é saber-fazer voltado à produção; a ciência busca as causas.", "técnica e ciência são idênticas, pois ambas dependem de laboratórios modernos.", "a ciência só surgiu com a técnica moderna, inexistindo antes da indústria.", "a técnica é um saber puramente teórico; a ciência, saber manual e repetitivo."], "exp": "Para Aristóteles, a techné é um saber-fazer voltado à produção, e a episteme busca as causas e os princípios. As duas são formas de conhecimento.", "sec": 2, "secTitle": "2. Ciência e técnica"}, {"tema": "Filosofia e Ciência", "ctx": "Em um debate na escola, um estudante afirmou: “A filosofia não serve para nada, porque a ciência já explica tudo.” A professora respondeu que, historicamente, física, astronomia e biologia faziam parte da filosofia. Lembrou que Isaac Newton chamou sua principal obra, de 1687, de Princípios matemáticos da filosofia natural.", "cmd": "A resposta da professora indica que", "opts": ["a filosofia surgiu depois da ciência moderna, só para criticar suas descobertas.", "ciência e filosofia sempre foram áreas separadas, desde a Grécia antiga.", "a ciência moderna eliminou as questões filosóficas, que perderam o sentido.", "as ciências nasceram na filosofia e se separaram dela sobretudo no século XVII.", "a filosofia grega já usava o método experimental e matemático da física atual."], "exp": "As ciências nasceram dentro da filosofia, como “filosofia natural”, e se tornaram independentes sobretudo a partir do século XVII, com Galileu e Newton.", "sec": 1, "secTitle": "1. Filosofia e Ciência"}, {"tema": "Verificação (Popper e a indução)", "ctx": "Uma influenciadora digital publicou: “Tomei chá de alho com limão e meu resfriado sumiu em cinco dias. Centenas de seguidores comentaram que aconteceu o mesmo com eles. Está comprovado!” Médicos lembraram que o resfriado comum costuma passar sozinho em poucos dias.", "cmd": "Do ponto de vista de Karl Popper, o problema do raciocínio da influenciadora é que", "opts": ["o acúmulo de casos favoráveis não garante a verdade de uma afirmação geral.", "a afirmação é falsa porque foi publicada em rede social, e não em uma revista.", "a ciência só aceita afirmações confirmadas por um número mínimo de pessoas.", "remédios caseiros não podem, por princípio, ser estudados pelo método científico.", "a experiência pessoal é sempre a forma mais segura de verificar uma hipótese."], "exp": "Pelo problema da indução, muitos casos favoráveis não provam uma afirmação geral. Seria preciso um teste rigoroso, ainda mais porque o resfriado passa sozinho.", "sec": 4, "secTitle": "4. Verificação"}, {"tema": "Paradigma (ciência normal)", "ctx": "Pesquisadores do Incaper, instituto de pesquisa agrícola do Espírito Santo, desenvolvem novas variedades de café conilon mais resistentes à seca. Eles partem das teorias da genética já aceitas, usam métodos consagrados de cruzamento e avaliação e se dedicam a resolver problemas específicos, sem questionar os fundamentos da genética.", "cmd": "Segundo Thomas Kuhn, esse tipo de atividade é chamado de", "opts": ["revolução científica, pois toda pesquisa nova rompe com as teorias anteriores.", "anarquismo metodológico, já que cada pesquisador escolhe o próprio método.", "ciência normal, em que se resolvem problemas dentro de um paradigma aceito.", "falseamento, pois o objetivo central é derrubar a teoria genética vigente.", "crise de paradigma, pois a comunidade discorda sobre os fundamentos da área."], "exp": "Resolver problemas específicos com teorias e métodos aceitos, sem questionar os fundamentos, é o que Kuhn chama de ciência normal.", "sec": 5, "secTitle": "5. Paradigma"}, {"tema": "Crise de paradigma (anomalias)", "ctx": "A física de Newton explicava com enorme sucesso o movimento dos planetas, mas a órbita de Mercúrio apresentava um pequeno desvio que, por décadas, ninguém conseguiu explicar. A teoria da relatividade de Einstein explicou esse desvio. Em 1919, observações de um eclipse feitas em Sobral, no Ceará, ajudaram a confirmar uma previsão de Einstein sobre o desvio da luz.", "cmd": "À luz das ideias de Thomas Kuhn, o episódio mostra que", "opts": ["uma anomalia isolada obriga os cientistas a abandonar o paradigma de imediato.", "a nova teoria apenas somou dados à anterior, sem mudar seus conceitos centrais.", "a ciência progride de forma linear e cumulativa, sem nenhum tipo de ruptura.", "a física de Newton foi abandonada por ter se mostrado errada em todos os casos.", "anomalias persistentes podem gerar crise e abrir espaço a um novo paradigma."], "exp": "A anomalia de Mercúrio persistiu por décadas e só foi resolvida pela relatividade. Para Kuhn, uma anomalia isolada não derruba o paradigma de imediato, mas anomalias persistentes podem gerar crise.", "sec": 6, "secTitle": "6. Crise de paradigma e revolução científica"}, {"tema": "A ciência como produção social", "ctx": "Doenças como a de Chagas e a leishmaniose atingem principalmente populações pobres. Por isso, recebem pouco investimento da indústria farmacêutica e são chamadas de “doenças negligenciadas”. No Brasil, boa parte das pesquisas sobre elas é feita por instituições públicas.", "cmd": "A situação mostra que", "opts": ["os temas de pesquisa são definidos pela curiosidade pessoal de cada cientista.", "interesses econômicos e sociais influenciam quais problemas a ciência investiga.", "doenças de populações pobres não podem ser estudadas pelo método científico.", "a ciência é neutra, pois o que ela investiga independe de quem a financia.", "o mercado garante que todas as doenças recebam investimentos proporcionais."], "exp": "Doenças que dão pouco lucro recebem pouco investimento privado. Interesses econômicos e sociais influenciam quais problemas a ciência investiga.", "sec": 7, "secTitle": "7. A ciência como produção social"}, {"tema": "Neutralidade científica (conflito de interesses)", "ctx": "Durante décadas, empresas de cigarro financiaram estudos e divulgaram pesquisas que lançavam dúvidas sobre a relação entre fumo e câncer. Documentos internos revelados depois mostraram que essas empresas já conheciam os riscos. Hoje, revistas científicas exigem que os autores declarem quem financiou a pesquisa.", "cmd": "O caso permite concluir que", "opts": ["a ciência deve ser rejeitada sempre que houver financiamento de empresas.", "estudos científicos são meras opiniões, equivalentes a quaisquer outras.", "a neutralidade é garantida pelo uso de números e gráficos nas pesquisas.", "conflitos de interesse afetam a pesquisa e exigem transparência e crítica.", "só o governo produz ciência confiável, pois não tem nenhum interesse próprio."], "exp": "O caso do cigarro mostra um conflito de interesses. A resposta não é rejeitar a ciência, e sim exigir transparência, como declarar quem financiou o estudo, e revisão crítica.", "sec": 8, "secTitle": "8. Neutralidade científica"}, {"tema": "Método (Bacon)", "ctx": "A Defesa Civil de um município capixaba registrou, durante dez anos, os locais onde ocorreram deslizamentos de terra e também os morros onde eles não ocorreram. Para cada caso, anotou a inclinação do terreno, a quantidade de chuva e a presença de vegetação. Comparando as tabelas, os técnicos chegaram a uma regra geral sobre as áreas de maior risco.", "cmd": "Esse procedimento se aproxima do método defendido por Francis Bacon, que propunha", "opts": ["partir de princípios evidentes da razão e deduzir deles todas as conclusões.", "aceitar a autoridade dos pensadores antigos como base de toda investigação.", "confiar nas primeiras impressões dos sentidos, sem nenhum registro sistemático.", "negar que a observação tenha papel relevante na produção do conhecimento.", "observar e comparar casos de forma sistemática para chegar a leis gerais."], "exp": "Registrar onde o fenômeno ocorre e onde não ocorre, e comparar as tabelas para chegar a uma lei geral, é a indução sistemática proposta por Bacon.", "sec": 3, "secTitle": "3. Método"}, {"tema": "Ciência e técnica (razão instrumental)", "ctx": "Um aplicativo de entregas usa algoritmos para calcular a rota mais rápida, o preço de cada corrida e a nota de cada entregador. O sistema é muito eficiente para reduzir custos. Porém, entregadores relatam jornadas longas, ganhos instáveis e punições automáticas sem chance de defesa.", "cmd": "Para pensadores da Escola de Frankfurt, como Max Horkheimer, situações como essa revelam que", "opts": ["a técnica moderna é neutra e apenas amplia a liberdade dos trabalhadores.", "a razão reduzida à eficiência dos meios pode deixar de questionar os fins.", "a tecnologia digital já resolveu os conflitos entre trabalho e capital.", "a técnica é só o saber manual dos artesãos, sem relação com a ciência.", "os algoritmos não afetam a vida social, pois são apenas cálculos neutros."], "exp": "Para a Escola de Frankfurt, a razão instrumental calcula os meios mais eficientes sem discutir se os fins são justos para as pessoas.", "sec": 2, "secTitle": "2. Ciência e técnica"}, {"tema": "Filosofia e Ciência (questões de valor)", "ctx": "Técnicas de edição genética já permitem alterar o DNA de embriões humanos. Em 2018, um cientista chinês anunciou o nascimento de bebês com genes editados e foi condenado em seu país. O caso gerou debate mundial: mesmo que a técnica funcione, devemos usá-la? Em quais casos? Quem decide?", "cmd": "O debate mostra uma diferença entre ciência e filosofia, pois", "opts": ["a ciência mostra o que é possível; o que se deve fazer exige reflexão filosófica.", "a filosofia deve decidir os resultados dos experimentos, substituindo o laboratório.", "a ciência não tem relação alguma com valores, nem mesmo em suas aplicações práticas.", "as questões éticas se resolvem automaticamente à medida que a técnica avança.", "a filosofia só se ocupa de temas do passado, sem relevância para a ciência atual."], "exp": "A ciência mostrou que editar genes de embriões é possível. Decidir se devemos fazê-lo, e em que casos, é uma questão ética, que exige reflexão filosófica.", "sec": 1, "secTitle": "1. Filosofia e Ciência"}, {"tema": "Verificação (falseabilidade)", "ctx": "Um perfil de horóscopo em uma rede social publicou: “Nesta semana, você enfrentará alguns desafios, mas também terá boas surpresas.” Muitos seguidores comentaram que a previsão “acertou em cheio”.", "cmd": "De acordo com o critério de Karl Popper, esse tipo de previsão", "opts": ["é científica, pois muitas pessoas confirmam que as previsões se realizaram.", "é falsa, pois Popper provou que os astros não influenciam a vida humana.", "é científica, porque se baseia na observação dos astros pela astronomia.", "não é científica, pois é formulada de modo que nenhum fato poderia refutá-la.", "não é científica, pois não foi publicada por uma universidade reconhecida."], "exp": "A previsão é tão vaga que nenhum fato poderia contrariá-la. Pelo critério de falseabilidade de Popper, ela não é científica, o que não é o mesmo que estar provado que é falsa.", "sec": 4, "secTitle": "4. Verificação"}, {"tema": "Paradigma (conceito)", "ctx": "Em cursos de Medicina, os estudantes aprendem nos livros didáticos que muitas doenças são causadas por microrganismos. Essa teoria orienta a esterilização de instrumentos, a higiene nos hospitais e a pesquisa de vacinas. Os exercícios dos manuais mostram como aplicá-la, e quem a rejeita não é reconhecido como membro da comunidade médica.", "cmd": "No sentido dado por Thomas Kuhn, a teoria dos germes funciona como um paradigma, isto é,", "opts": ["uma opinião individual de cada cientista sobre um fenômeno qualquer da natureza.", "uma lei natural eterna, descoberta de uma vez por todas pela ciência moderna.", "um conjunto de teorias, métodos e exemplos compartilhado por uma comunidade.", "um método único e universal, válido para todas as ciências e todas as épocas.", "uma hipótese provisória que ainda não foi aceita por nenhum grupo de pesquisa."], "exp": "Para Kuhn, paradigma é o conjunto de teorias, métodos e exemplos compartilhado por uma comunidade científica. Ele é histórico e não é uma lei eterna.", "sec": 5, "secTitle": "5. Paradigma"}, {"tema": "Crise de paradigma (revolução científica)", "ctx": "No século XVI, Nicolau Copérnico propôs que a Terra gira em torno do Sol. A mudança não alterou apenas cálculos astronômicos: a Terra deixou de ser vista como centro imóvel do universo, conceitos de movimento tiveram de ser repensados e surgiram novos problemas a investigar. A aceitação foi lenta e cercada de disputas.", "cmd": "Segundo Thomas Kuhn, episódios como esse mostram que", "opts": ["a troca de paradigma ocorre por simples votação, sem qualquer argumento racional.", "a mudança de paradigma transforma conceitos, problemas e a visão de mundo.", "o novo paradigma surge sem conflitos e é aceito de imediato pelos cientistas.", "a revolução apenas corrigiu cálculos astronômicos e manteve a visão anterior.", "a ciência só progride quando a religião aprova as suas novas teorias e conceitos."], "exp": "A revolução copernicana mudou conceitos, problemas e a visão de mundo, e não apenas cálculos. A aceitação foi lenta, com disputas e argumentos.", "sec": 6, "secTitle": "6. Crise de paradigma e revolução científica"}, {"tema": "A ciência como produção social (revisão coletiva)", "ctx": "Durante a pandemia, alguns estudos ainda não avaliados por outros cientistas circularam nas redes sociais como “prova” da eficácia de certos remédios. Depois, ao passarem pela análise de especialistas, vários foram corrigidos ou retirados por erros de método.", "cmd": "O episódio mostra que o conhecimento científico", "opts": ["é validado quando o estudo recebe muitos compartilhamentos nas redes sociais.", "é definido pelo cientista mais famoso da área, cuja palavra encerra o debate.", "dispensa revisão, pois todo estudo divulgado já é uma verdade comprovada.", "depende apenas da intenção honesta de cada pesquisador, trabalhando sozinho.", "é validado coletivamente, pela crítica e revisão da comunidade científica."], "exp": "Um estudo só é aceito depois de passar pela crítica de outros cientistas (revisão por pares, ceticismo organizado), e não pela fama ou pelos compartilhamentos.", "sec": 7, "secTitle": "7. A ciência como produção social"}, {"tema": "Neutralidade científica", "ctx": "Em 2015, o rompimento da barragem de Fundão, em Mariana (MG), lançou rejeitos de minério no Rio Doce, que chegaram ao litoral do Espírito Santo. Desde então, estudos sobre a qualidade da água e os danos aos pescadores são disputados entre empresas, órgãos públicos e comunidades atingidas, cada um apresentando seus próprios laudos.", "cmd": "Sobre a neutralidade científica, o caso permite concluir que", "opts": ["laudos técnicos são sempre neutros, pois seguem procedimentos padronizados.", "as comunidades atingidas nada têm a contribuir para o conhecimento do caso.", "a ciência busca objetividade, mas seu uso envolve interesses em conflito.", "a ciência deve ser descartada nesses casos, valendo só a experiência local.", "a objetividade é impossível; logo, todos os laudos técnicos têm o mesmo valor."], "exp": "A ciência busca objetividade, mas os laudos sobre Fundão são produzidos e usados por grupos com interesses diferentes. Isso não significa que todos os laudos valham o mesmo.", "sec": 8, "secTitle": "8. Neutralidade científica"}, {"tema": "Método (Galileu)", "ctx": "Em uma aula de Física, os estudantes soltaram bolinhas em uma rampa inclinada e mediram, com o cronômetro do celular, o tempo gasto em cada trecho. Depois, organizaram os dados em uma tabela e encontraram uma relação matemática entre distância e tempo. O experimento recria um dos estudos de Galileu Galilei.", "cmd": "A contribuição de Galileu para o método da ciência moderna consistiu em", "opts": ["unir experimentação controlada e linguagem matemática no estudo da natureza.", "explicar o movimento pelas qualidades e finalidades naturais de cada corpo.", "basear o conhecimento na autoridade dos textos antigos e das escrituras sagradas.", "dispensar a observação, deduzindo todas as leis apenas a partir da razão pura.", "rejeitar a matemática por ser incapaz de descrever os fenômenos naturais."], "exp": "Galileu uniu experimentos controlados, como o plano inclinado, à descrição matemática. Explicar o movimento por qualidades e finalidades era a visão de Aristóteles.", "sec": 3, "secTitle": "3. Método"}, {"tema": "Ciência e técnica", "ctx": "Celulares deixam de receber atualizações em poucos anos e se tornam lentos, o que leva muitas pessoas a trocar de aparelho. O Brasil está entre os maiores geradores de lixo eletrônico das Américas, e grande parte desse material é descartada sem reciclagem adequada.", "cmd": "Uma reflexão filosófica sobre a técnica permite afirmar que", "opts": ["toda inovação técnica representa sempre um progresso para a humanidade.", "a técnica é neutra, cabendo apenas ao consumidor o descarte dos aparelhos.", "a troca frequente é um fenômeno natural, sem relação com decisões humanas.", "as escolhas técnicas envolvem interesses econômicos e efeitos socioambientais.", "a única solução é abandonar a tecnologia e voltar de vez à produção artesanal."], "exp": "A troca frequente de celulares resulta de decisões técnicas ligadas a interesses econômicos e gera consequências socioambientais, como o lixo eletrônico.", "sec": 2, "secTitle": "2. Ciência e técnica"}, {"tema": "Filosofia e Ciência (doxa e episteme)", "ctx": "Em um grupo de mensagens, um participante escreveu: “Na minha opinião, a Terra é plana. E opinião não se discute.” Outro respondeu com fotos de satélite, cálculos sobre a sombra da Terra nos eclipses e relatos de navegação, e perguntou: “Quais são suas razões?”", "cmd": "A resposta do segundo participante retoma uma distinção feita por Platão entre", "opts": ["opiniões, que valem tanto quanto o conhecimento, pois a verdade é relativa.", "sentidos e razão, defendendo que só os sentidos dão conhecimento seguro.", "filosofia e ciência, mostrando que a filosofia rejeita as evidências.", "opinião (doxa) e conhecimento sustentado por boas razões (episteme).", "maioria e minoria, sendo verdadeiro aquilo em que mais pessoas acreditam."], "exp": "Platão distingue a opinião (d

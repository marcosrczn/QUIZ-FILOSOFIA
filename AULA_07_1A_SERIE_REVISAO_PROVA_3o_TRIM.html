oxa) do conhecimento justificado por razões (episteme). Pedir as razões é exigir conhecimento, e não apenas opinião.", "sec": 1, "secTitle": "1. Filosofia e Ciência"}, {"tema": "Verificação (refutação)", "ctx": "Um estudante observou, durante 200 manhãs, que os sabiás-laranjeira do seu bairro cantavam ao amanhecer e concluiu: “Todos os sabiás só cantam de manhã.” Numa noite, porém, ouviu um sabiá cantando perto de um poste iluminado.", "cmd": "Segundo Karl Popper, esse episódio ilustra que", "opts": ["uma única observação contrária pode refutar uma afirmação universal.", "duzentas observações provam de forma definitiva a afirmação geral feita.", "observações feitas à noite não têm valor científico e devem ser ignoradas.", "quanto mais casos favoráveis, mais a teoria se torna uma verdade absoluta.", "afirmações universais não podem ser testadas de nenhuma maneira possível."], "exp": "Para Popper, muitos casos favoráveis não provam uma lei universal, mas um único caso contrário pode refutá-la.", "sec": 4, "secTitle": "4. Verificação"}, {"tema": "Paradigma (resistência a novas ideias)", "ctx": "Na década de 1840, o médico Ignaz Semmelweis percebeu que a morte de mulheres após o parto caía muito quando os médicos lavavam as mãos antes de atendê-las. Mesmo com dados favoráveis, sua proposta foi rejeitada por muitos colegas. Na época, ainda não se aceitava a ideia de que doenças podiam ser transmitidas por agentes invisíveis nas mãos.", "cmd": "À luz das ideias de Thomas Kuhn, a rejeição da proposta se explica porque", "opts": ["os médicos recusaram a ideia apenas por maldade ou por vaidade pessoal.", "a ideia foi aceita de imediato pelos colegas, pois os dados eram claros.", "os paradigmas não influenciam o modo como os cientistas avaliam evidências.", "a lavagem das mãos foi recusada por contrariar uma lei do Estado na época.", "ideias incompatíveis com o paradigma vigente tendem a sofrer resistência."], "exp": "Para Kuhn, o paradigma orienta como os cientistas avaliam evidências. Por isso, ideias incompatíveis com ele tendem a sofrer resistência, mesmo com dados favoráveis.", "sec": 5, "secTitle": "5. Paradigma"}, {"tema": "Crise de paradigma (características)", "ctx": "Antes de Copérnico, a astronomia baseada na Terra no centro do universo precisava de cada vez mais ajustes para prever o movimento dos planetas. Astrônomos criavam versões diferentes do mesmo modelo, nenhuma plenamente satisfatória, e alguns começaram a duvidar das próprias bases da teoria.", "cmd": "Para Thomas Kuhn, esse quadro caracteriza uma crise de paradigma, na qual", "opts": ["a ciência normal funciona tranquilamente, sem problemas não resolvidos.", "os cientistas abandonam a ciência e passam a aceitar qualquer explicação.", "surgem versões rivais da teoria e os fundamentos passam a ser questionados.", "a teoria vigente é confirmada de imediato por novas observações dos astros.", "os cientistas param de pesquisar até que uma autoridade decida a questão."], "exp": "Na crise de paradigma surgem versões rivais da teoria, nenhuma satisfatória, e os cientistas passam a questionar os fundamentos da área.", "sec": 6, "secTitle": "6. Crise de paradigma e revolução científica"}, {"tema": "A ciência como produção social", "ctx": "O filme Estrelas Além do Tempo retrata matemáticas negras que trabalharam na Nasa nos anos 1960 e enfrentaram segregação racial. No Brasil, a Lei de Cotas, de 2012, ampliou o acesso de estudantes de escolas públicas, negros e indígenas às universidades federais, onde se produz grande parte da pesquisa científica do país.", "cmd": "Os dois exemplos ajudam a compreender que", "opts": ["a origem social dos cientistas não tem relação com a produção científica.", "quem faz ciência e em que condições é parte da história do conhecimento.", "a ciência é uma atividade naturalmente reservada a poucos talentos inatos.", "as políticas de inclusão diminuem necessariamente a qualidade da pesquisa.", "o valor de uma descoberta depende do gênero e da origem de quem a fez."], "exp": "Quem pode fazer ciência, e em que condições, depende da sociedade. Já o valor de uma descoberta deve ser julgado pelas provas, e não pela origem de quem a fez (universalismo).", "sec": 7, "secTitle": "7. A ciência como produção social"}, {"tema": "Neutralidade científica (crítica independente)", "ctx": "Antes das eleições, o Tribunal Superior Eleitoral realiza o Teste Público de Segurança: especialistas independentes, de universidades e de outras instituições, tentam encontrar falhas nas urnas eletrônicas. Os problemas encontrados são corrigidos e os sistemas são testados de novo.", "cmd": "Do ponto de vista da filosofia da ciência, esse procedimento contribui para a confiabilidade porque", "opts": ["a confiança depende apenas da autoridade de quem desenvolveu o sistema.", "os testes públicos provam que nenhum sistema técnico pode apresentar falhas.", "a objetividade é garantida quando apenas técnicos do governo avaliam as urnas.", "a crítica externa é desnecessária quando a tecnologia já é bastante avançada.", "a crítica independente reduz o peso de interesses particulares no sistema."], "exp": "A objetividade vem da possibilidade de os resultados serem testados e criticados por outros. A crítica independente reduz o peso de interesses particulares.", "sec": 8, "secTitle": "8. Neutralidade científica"}, {"tema": "Método (hipotético-dedutivo)", "ctx": "Agentes de saúde de um município capixaba suspeitaram que o aumento de casos de dengue estava ligado a pneus velhos acumulados em um terreno. Raciocinaram: “Se essa hipótese estiver certa, depois da remoção dos pneus os focos do mosquito e os casos na região devem diminuir.” Removeram os pneus e acompanharam os números nas semanas seguintes.", "cmd": "O procedimento corresponde ao método hipotético-dedutivo, pois os agentes", "opts": ["começaram sem hipóteses, apenas acumulando dados ao acaso no bairro.", "formularam uma hipótese, deduziram consequências e as testaram.", "aceitaram a explicação mais popular entre os moradores do bairro.", "evitaram testar a hipótese para não correr o risco de refutá-la.", "consideraram a hipótese verdadeira antes de qualquer observação."], "exp": "Os agentes formularam uma hipótese, deduziram uma consequência (os focos devem cair) e a testaram na prática: esse é o método hipotético-dedutivo.", "sec": 3, "secTitle": "3. Método"}, {"tema": "Ciência e técnica (Bacon e o domínio da natureza)", "ctx": "No século XVII, Francis Bacon defendeu que conhecer a natureza é uma forma de ganhar poder sobre ela, colocando-a a serviço das necessidades humanas. Hoje, a perda de grande parte da Mata Atlântica do Espírito Santo, a erosão do solo e a crise hídrica fazem muitos pesquisadores repensarem essa relação.", "cmd": "A situação permite afirmar que", "opts": ["a ciência moderna nasceu desinteressada de qualquer aplicação prática.", "a técnica antiga já tinha como meta o domínio total e ilimitado da natureza.", "o projeto de domínio da natureza não gerou nenhuma consequência ambiental.", "a ciência moderna associou conhecer a dominar a natureza, ideia hoje criticada.", "o domínio da natureza foi uma ideia grega, rejeitada pelos pensadores modernos."], "exp": "Bacon associou conhecer a natureza a dominá-la, projeto da ciência moderna. A crise ambiental leva hoje muitos a criticar essa ideia.", "sec": 2, "secTitle": "2. Ciência e técnica"}, {"tema": "Filosofia e Ciência (epistemologia)", "ctx": "Depois de uma aula sobre vacinas, uma estudante perguntou: “Como podemos ter certeza de que uma teoria científica é verdadeira? O que faz um conhecimento ser confiável?” O professor de Biologia respondeu que essa pergunta não se resolve com um experimento de laboratório.", "cmd": "A pergunta da estudante é", "opts": ["epistemológica, pois reflete sobre os fundamentos do próprio conhecimento.", "de física experimental, que pode ser resolvida com medições em laboratório.", "sem sentido, pois a ciência dispensa qualquer tipo de justificação racional.", "de opinião pessoal, sem possibilidade de debate racional entre as pessoas.", "exclusiva da religião, sem qualquer relação com a ciência ou a filosofia."], "exp": "Perguntar o que torna um conhecimento confiável é uma questão de epistemologia, a parte da filosofia que estuda os fundamentos do conhecimento.", "sec": 1, "secTitle": "1. Filosofia e Ciência"}, {"tema": "Verificação (verificacionismo e falseabilidade)", "ctx": "Uma agência de checagem recebeu a frase: “Só tem sentido aquilo que pode ser comprovado pela experiência.” Um checador lembrou que essa ideia foi defendida no século XX pelos positivistas lógicos do Círculo de Viena. Lembrou também que Karl Popper criticou esse critério, pois leis universais, como “todo metal se dilata com o calor”, nunca podem ser comprovadas de modo definitivo.", "cmd": "Diante dessa dificuldade, Popper respondeu", "opts": ["concordando, pois todas as leis científicas podem ser comprovadas de vez.", "afirmando que a experiência não tem papel algum na avaliação de teorias.", "propondo a falseabilidade como critério para distinguir o que é ciência.", "defendendo que apenas a metafísica produz conhecimento verdadeiro e seguro.", "sustentando que as teorias científicas são verdades absolutas e imutáveis."], "exp": "Como leis universais não podem ser comprovadas de vez, Popper propôs a falseabilidade como critério de demarcação entre ciência e não ciência.", "sec": 4, "secTitle": "4. Verificação"}], "k": "402222222211341340120023011111"};

<script>
(function(){
"use strict";
var M = DATA.meta, Q = DATA.quiz, LET = ["A","B","C","D","E"];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function inl(s){return esc(s).replace(/\*\*\*(.+?)\*(.*?)\*\*/g,"<strong><em>$1</em>$2</strong>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>");}
function plain(s){return String(s).replace(/\*/g,"");}
function ans(i){var c=+DATA.k.charAt(i);return ((c-i*3-2)%5+50)%5;}
function $(id){return document.getElementById(id);}

/* ---------- armazenamento ---------- */
var store = {
  get:function(){try{var s=localStorage.getItem(CFG.chave);return s?JSON.parse(s):null;}catch(e){return null;}},
  set:function(v){try{localStorage.setItem(CFG.chave,JSON.stringify(v));}catch(e){}},
  del:function(){try{localStorage.removeItem(CFG.chave);}catch(e){}}
};
var S = store.get() || {fase:"inicio"};
function save(){ store.set(S); }

/* ---------- cabeçalho ---------- */
$("eyebrow").textContent = "Unidade curricular: " + M.unidade + " · " + M.serie;
$("title").textContent = M.titulo;
$("meta").innerHTML = "<span><b>Componente:</b> "+esc(M.componente)+"</span><span><b>Série:</b> "+esc(M.serie)+"</span><span><b>Habilidades:</b> "+esc(M.habilidades)+"</span>";
$("objs").innerHTML = M.objetos.map(function(o){return "<li>"+esc(o)+"</li>";}).join("");
$("goal").innerHTML = "<b>Objetivo:</b> "+esc(M.objetivo);
$("footTxt").textContent = M.unidade + " · " + M.serie;

/* ---------- apostila ---------- */
var html="", toc="";
DATA.apostila.forEach(function(b){
  if(b.t==="h2"){var m=/^(\d+)\./.exec(b.s);var id=m?"s"+m[1]:"s-"+b.s.toLowerCase().replace(/[^a-z]+/g,"");
    html+='<h2 id="'+id+'">'+inl(b.s)+'</h2>';toc+='<li><a href="#'+id+'">'+inl(b.s.replace(/^\d+\.\s*/,""))+'</a></li>';}
  else if(b.t==="h3") html+="<h3>"+inl(b.s)+"</h3>";
  else if(b.t==="p") html+="<p>"+inl(b.s)+"</p>";
  else if(b.t==="ul"||b.t==="ol") html+="<"+b.t+">"+b.items.map(function(i){return "<li>"+inl(i)+"</li>";}).join("")+"</"+b.t+">";
  else if(b.t==="box") html+='<div class="box"><b class="lab">Para lembrar:</b> '+inl(b.s)+"</div>";
  else if(b.t==="table"){
    html+='<div class="tbl"><table'+(b.small?' class="small"':'')+'><thead><tr>'+b.head.map(function(h){return '<th scope="col">'+inl(h)+"</th>";}).join("")+"</tr></thead><tbody>";
    b.rows.forEach(function(r){html+="<tr>"+r.map(function(c,i){return (i===0&&b.head[0]==="")?'<th scope="row">'+inl(c)+"</th>":"<td>"+inl(c)+"</td>";}).join("")+"</tr>";});
    html+="</tbody></table></div>";
  }
});
$("apostila").innerHTML=html; $("toc").innerHTML=toc;

/* ---------- downloads ---------- */
var NAMES={apostilaPdf:["apostila-filosofia-da-ciencia.pdf","application/pdf"],quizPdf:["quiz-filosofia-da-ciencia.pdf","application/pdf"],
  apostilaDocx:["apostila-filosofia-da-ciencia.docx","application/vnd.openxmlformats-officedocument.wordprocessingml.document"],
  quizDocx:["quiz-filosofia-da-ciencia.docx","application/vnd.openxmlformats-officedocument.wordprocessingml.document"]};
function b64ToBytes(b64){var bin=atob(b64),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function download(bytes,name,type){
  var blob=new Blob([bytes],{type:type}),url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url);},4000);
}
Array.prototype.forEach.call(document.querySelectorAll("[data-file]"),function(b){
  b.addEventListener("click",function(){var k=b.getAttribute("data-file");download(b64ToBytes(FILES[k]),NAMES[k][0],NAMES[k][1]);});
});

/* ---------- tema ---------- */
var root=document.documentElement;
try{var th=localStorage.getItem("fc-theme");if(th)root.setAttribute("data-theme",th);}catch(e){}
$("themeBtn").addEventListener("click",function(){
  var cur=root.getAttribute("data-theme")||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  var nx=cur==="dark"?"light":"dark";root.setAttribute("data-theme",nx);try{localStorage.setItem("fc-theme",nx);}catch(e){}
});

/* ---------- abas ---------- */
var tabs=[$("tab-apostila"),$("tab-quiz")], aba=0;
function tabsH(){var n=document.querySelector(".tabs");if(n)root.style.setProperty("--tabs-h",n.offsetHeight+"px");}
tabsH();window.addEventListener("resize",tabsH);
function show(i){
  aba=i;
  tabs.forEach(function(t,k){t.setAttribute("aria-selected",k===i?"true":"false");t.tabIndex=k===i?0:-1;$(t.getAttribute("aria-controls")).hidden=k!==i;});
  $("backQuiz").hidden = !(i===0 && (S.fase==="questao"||S.fase==="pausa"));
  if(i===1) render();
}
tabs.forEach(function(t,k){
  t.addEventListener("click",function(){show(k);window.scrollTo(0,0);});
  t.addEventListener("keydown",function(e){if(e.key==="ArrowRight"||e.key==="ArrowLeft"){var j=(k+1)%2;show(j);tabs[j].focus();}});
});
$("backQuiz").addEventListener("click",function(){show(1);window.scrollTo(0,0);});
function irSecao(n){
  show(0);var h=$("s"+n);if(!h)return;
  h.scrollIntoView({block:"start"});h.classList.remove("flash");void h.offsetWidth;h.classList.add("flash");
}

function fmt(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r;}

/* ---------- proteções ---------- */
function bloqueia(e){ if(!(e.target&&e.target.tagName==="INPUT")) e.preventDefault(); }
["copy","cut","contextmenu","dragstart","selectstart"].forEach(function(ev){document.addEventListener(ev,bloqueia);});
document.addEventListener("keydown",function(e){
  var k=(e.key||"").toLowerCase(), c=e.ctrlKey||e.metaKey;
  if(e.key==="F12"||(c&&e.shiftKey&&(k==="i"||k==="j"||k==="c"))||(c&&(k==="u"||k==="s"||k==="p"))||(c&&k==="c"&&!(e.target&&e.target.tagName==="INPUT"))){
    e.preventDefault();e.stopPropagation();aviso("Esta ação está desativada nesta página.");
  }
},true);
window.addEventListener("beforeprint",function(){if(S.fase==="questao"||S.fase==="pausa")registra("tentativa de impressão");});
function registra(tipo){ if(!S.eventos) S.eventos=[]; S.eventos.push({t:Date.now(),tipo:tipo}); save(); }
var saiu=false;
document.addEventListener("visibilitychange",function(){
  if(document.hidden && (S.fase==="questao"||S.fase==="pausa")){ saiu=true; S.saidas=(S.saidas||0)+1; registra("saiu da aba"); }
  else if(!document.hidden && saiu){ saiu=false; aviso("Você saiu desta aba durante o quiz. Isso fica registrado no relatório ("+S.saidas+" saída"+(S.saidas>1?"s":"")+")."); }
});
function aviso(msg){
  var r=$("modalRoot");
  r.innerHTML='<div class="overlay" role="dialog" aria-modal="true"><div class="modal"><h2>Atenção</h2><p>'+esc(msg)+'</p><div class="qnav"><button class="btn" id="okAviso" type="button">Entendi</button></div></div></div>';
  $("okAviso").addEventListener("click",function(){r.innerHTML="";});$("okAviso").focus();
}

/* ---------- quiz ---------- */
var box=$("quiz"), tick=null;
function stop(){ if(tick){clearInterval(tick);tick=null;} }
function primeira(){ var n=0; Q.forEach(function(q,i){ if(S.res&&S.res[i]&&S.res[i][0]===ans(i)) n++; }); return n; }
function finalOk(){ var n=0; Q.forEach(function(q,i){ var r=S.res&&S.res[i]; if(r&&r[r.length-1]===ans(i)) n++; }); return n; }

function stats(){
  var top=$("qtop");
  if(S.fase!=="questao"){top.hidden=true;return;}
  top.hidden=false;
  var fila=S.fila, pos=S.pos;
  $("qpos").innerHTML="<b>Questão "+(fila[Math.min(pos,fila.length-1)]+1)+"</b> · "+Math.min(pos+1,fila.length)+" de "+fila.length+" neste ciclo";
  $("qcycle").textContent = S.ciclo===1 ? "Ciclo 1 de "+CFG.ciclos : "Retomada "+(S.ciclo-1)+" de "+(CFG.ciclos-1);
  var p=(pos/fila.length)*100; $("qbar").firstElementChild.style.width=p+"%";$("qbar").setAttribute("aria-valuenow",Math.round(p));
}

function render(){
  stop(); stats();
  $("backQuiz").hidden = !(aba===0 && (S.fase==="questao"||S.fase==="pausa"));
  if(S.fase==="inicio") return telaInicio();
  if(S.fase==="questao") return telaQuestao();
  if(S.fase==="pausa") return telaPausa();
  if(S.fase==="fim") return telaFim();
}

function telaInicio(){
  box.innerHTML='<div class="card"><h2>Antes de começar</h2>'+
   '<ul class="rules">'+
   '<li>O quiz tem <b>30 questões</b> e é feito <b>individualmente</b>.</li>'+
   '<li>Cada questão fica alguns segundos só para leitura antes de liberar as alternativas.</li>'+
   '<li>Se errar, você verá a seção da apostila para reler. A resposta correta não é mostrada.</li>'+
   '<li>Ao final de cada ciclo, as questões erradas voltam em até '+(CFG.ciclos-1)+' retomadas.</li>'+
   '<li>A nota considera os acertos de primeira. As retomadas aparecem no relatório.</li>'+
   '<li>Sair desta aba, copiar ou imprimir durante o quiz fica registrado no relatório.</li>'+
   '<li>Seu progresso fica salvo neste aparelho e navegador.</li></ul>'+
   '<div class="row2"><div class="field"><label for="nome">Nome completo</label><input id="nome" autocomplete="name" maxlength="80"></div>'+
   '<div class="field"><label for="turma">Turma</label><input id="turma" maxlength="20"></div></div>'+
   '<div class="qnav"><button class="btn" type="button" id="comecar">Começar o quiz</button></div></div>';
  $("comecar").addEventListener("click",function(){
    var n=$("nome").value.trim(), t=$("turma").value.trim();
    if(n.length<5||n.indexOf(" ")<0){aviso("Digite seu nome completo.");return;}
    if(!t){aviso("Digite sua turma.");return;}
    S.nome=n;S.turma=t;S.inicio=Date.now();S.res={};S.ciclo=1;S.fila=Q.map(function(_,i){return i;});S.pos=0;S.fase="questao";S.saidas=0;S.eventos=[];
    S.hist=[];save();render();window.scrollTo(0,0);
  });
}

function telaQuestao(){
  if(S.pos>=S.fila.length) return fimCiclo();
  var i=S.fila[S.pos], q=Q[i], st=S.atual&&S.atual.i===i ? S.atual : (S.atual={i:i,lido:0,resp:null,conf:false,pausa:0});
  save();
  function draw(){
    var liberado=st.lido>=CFG.tempoQuestao, conf=st.conf, certa=conf&&st.resp===ans(i);
    var h='<div class="card"><p class="qnum">Questão '+(i+1)+(S.ciclo>1?' · retomada':'')+'</p><p class="ctx">'+inl(q.ctx)+'</p><p class="cmd">'+inl(q.cmd)+'</p>';
    if(!liberado) h+='<div class="timer" role="status"><span>Leia com atenção. As alternativas serão liberadas em <b>'+fmt(CFG.tempoQuestao-st.lido)+'</b>.</span></div>';
    h+='<ul class="opts">';
    q.opts.forEach(function(o,k){
      var cls="";
      if(conf){ if(k===st.resp) cls=certa?" correct":" wrong"; else cls=" dim"; }
      else if(st.resp===k) cls=" sel";
      h+='<li><button type="button" class="opt'+cls+'" data-k="'+k+'"'+((!liberado||conf)?" disabled":"")+' aria-pressed="'+(st.resp===k)+'"><span class="l">'+LET[k]+')</span><span class="t">'+inl(o)+'</span></button></li>';
    });
    h+="</ul>";
    if(conf){
      if(certa) h+='<div class="fb ok" role="status"><p class="v">Você acertou!</p><p>'+inl(q.exp)+'</p></div>';
      else {
        var restam=CFG.pausaErro-st.pausa;
        h+='<div class="fb no" role="status"><p class="v">Resposta incorreta.</p>'+
          '<p>Releia a seção <button type="button" class="linkbtn" id="irSec">'+esc(q.secTitle)+'</button> da apostila.'+(S.ciclo<CFG.ciclos?' Esta questão volta na retomada.':'')+'</p>'+
          '<p><b>Pausa para pensar:</b> o que exatamente o enunciado pergunta? Qual ideia da seção '+q.sec+' responde a essa pergunta?</p>'+
          (restam>0?'<p>Continue em <b>'+fmt(restam)+'</b>.</p>':'')+'</div>';
      }
    }
    h+='<div class="qnav">';
    if(!conf) h+='<button type="button" class="btn" id="confirma"'+(st.resp===null?" disabled":"")+'>Confirmar resposta</button>';
    else h+='<button type="button" class="btn" id="proxima"'+((!certa&&st.pausa<CFG.pausaErro)?" disabled":"")+'>'+(S.pos===S.fila.length-1?"Concluir ciclo":"Próxima questão")+'</button>';
    h+="</div></div>";
    box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll(".opt"),function(b){
      b.addEventListener("click",function(){st.resp=+b.getAttribute("data-k");save();draw();});
    });
    if($("irSec")) $("irSec").addEventListener("click",function(){irSecao(q.sec);});
    if($("confirma")) $("confirma").addEventListener("click",function(){
      st.conf=true; if(!S.res[i]) S.res[i]=[]; S.res[i].push(st.resp);
      S.hist.push({q:i,c:S.ciclo,r:st.resp,t:Date.now()}); save(); draw();
      var fb=box.querySelector(".fb"); if(fb) fb.scrollIntoView({block:"nearest",behavior:"smooth"});
    });
    if($("proxima")) $("proxima").addEventListener("click",function(){S.pos++;S.atual=null;save();render();window.scrollTo(0,0);});
  }
  draw();
  tick=setInterval(function(){
    if(document.hidden||aba!==1) return;
    if(st.lido<CFG.tempoQuestao){st.lido++;save();if(st.lido>=CFG.tempoQuestao)draw();else{var tm=box.querySelector(".timer b");if(tm)tm.textContent=fmt(CFG.tempoQuestao-st.lido);}}
    else if(st.conf&&st.resp!==ans(i)&&st.pausa<CFG.pausaErro){st.pausa++;save();draw();}
  },1000);
}

function fimCiclo(){
  var erradas=S.fila.filter(function(i){var r=S.res[i];return r[r.length-1]!==ans(i);});
  if(erradas.length===0||S.ciclo>=CFG.ciclos){ S.fase="fim"; S.fim=Date.now(); save(); return render(); }
  S.fila=erradas; S.pos=0; S.ciclo++; S.fase="pausa"; S.pausaT=0; S.atual=null; save(); render();
}

function telaPausa(){
  var secs={}; S.fila.forEach(function(i){secs[Q[i].sec]=Q[i].secTitle;});
  function draw(){
    var falta=CFG.pausaCiclo-S.pausaT;
    var h='<div class="card"><h2>Pausa reflexiva</h2><p>Você terminou o ciclo '+(S.ciclo-1)+'. Ficaram <b>'+S.fila.length+'</b> questão(ões) para a retomada '+(S.ciclo-1)+'.</p>'+
      '<p>Antes de continuar, releia estas seções da apostila:</p><ul class="rules">';
    Object.keys(secs).sort(function(a,b){return a-b;}).forEach(function(n){h+='<li><button type="button" class="linkbtn" data-sec="'+n+'">'+esc(secs[n])+'</button></li>';});
    h+='</ul><p>Pense: o que você respondeu e por que achou que estava certo? Que palavra do enunciado você deixou passar?</p>'+
      (falta>0?'<div class="timer" role="status"><span>A retomada será liberada em <b>'+fmt(falta)+'</b>. O tempo conta com esta página aberta, na apostila ou no quiz.</span></div>':'')+
      '<div class="qnav"><button type="button" class="btn" id="retomar"'+(falta>0?" disabled":"")+'>Iniciar retomada</button></div></div>';
    box.innerHTML=h;
    Array.prototype.forEach.call(box.querySelectorAll("[data-sec]"),function(b){b.addEventListener("click",function(){irSecao(b.getAttribute("data-sec"));});});
    $("retomar").addEventListener("click",function(){S.fase="questao";save();render();window.scrollTo(0,0);});
  }
  draw();
  tick=setInterval(function(){ if(document.hidden) return; if(S.pausaT<CFG.pausaCiclo){S.pausaT++;save();if(aba===1)draw();} },1000);
}

function codigo(){
  var s=S.nome+"|"+S.turma+"|"+S.inicio+"|"+JSON.stringify(S.res)+"|"+(S.saidas||0), h=2166136261;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}
  return ("00000000"+h.toString(16)).slice(-8).toUpperCase();
}
function situacao(i){
  var r=S.res[i]; if(!r) return ["Não respondida","no"];
  if(r[0]===ans(i)) return ["Acertou de primeira","ok"];
  if(r[r.length-1]===ans(i)) return ["Acertou na retomada "+(r.length-1),"mid"];
  return ["Não acertou","no"];
}
function dataHora(t){var d=new Date(t);function p(n){return(n<10?"0":"")+n;}return p(d.getDate())+"/"+p(d.getMonth()+1)+"/"+d.getFullYear()+" "+p(d.getHours())+":"+p(d.getMinutes());}
function duracao(){var s=Math.round((S.fim-S.inicio)/1000);var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+" h ":"")+m+" min";}

function telaFim(){
  var p=primeira(), f=finalOk(), nota=(p/Q.length*10).toFixed(1).replace(".",",");
  var rev={}; Q.forEach(function(q,i){if(situacao(i)[1]!=="ok") rev[q.sec]=q.secTitle;});
  var h='<div class="card"><h2>Relatório do quiz</h2>'+
    '<p><b>Estudante:</b> '+esc(S.nome)+' · <b>Turma:</b> '+esc(S.turma)+'</p>'+
    '<p><b>Início:</b> '+dataHora(S.inicio)+' · <b>Fim:</b> '+dataHora(S.fim)+' · <b>Duração:</b> '+duracao()+'</p>'+
    '<p class="big">'+nota+'</p><p class="center">Nota (acertos de primeira)</p>'+
    '<div class="res-grid"><div class="stat"><b>'+p+'/'+Q.length+'</b><span>Acertos de primeira</span></div>'+
    '<div class="stat"><b>'+f+'/'+Q.length+'</b><span>Acertos após as retomadas</span></div>'+
    '<div class="stat"><b>'+(S.saidas||0)+'</b><span>Saídas da aba</span></div>'+
    '<div class="stat"><b>'+codigo()+'</b><span>Código do relatório</span></div></div>';
  var ks=Object.keys(rev).sort(function(a,b){return a-b;});
  if(ks.length) h+='<p><b>Seções para revisar:</b> '+ks.map(function(n){return '<button type="button" class="linkbtn" data-sec="'+n+'">'+esc(rev[n])+'</button>';}).join(" · ")+'</p>';
  h+='<div class="tbl"><table><thead><tr><th scope="col">Questão</th><th scope="col">Conteúdo</th><th scope="col">Resultado</th></tr></thead><tbody>';
  Q.forEach(function(q,i){var s=situacao(i);h+='<tr><td>'+(i+1)+'</td><td>'+esc(q.tema)+'</td><td><span class="tag '+s[1]+'">'+s[0]+'</span></td></tr>';});
  h+='</tbody></table></div><p class="note">Baixe o relatório e envie ao professor conforme a orientação da turma.</p>'+
    '<div class="qnav"><button type="button" class="btn" id="relPdf">Baixar relatório em PDF</button></div></div>';
  box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll("[data-sec]"),function(b){b.addEventListener("click",function(){irSecao(b.getAttribute("data-sec"));});});
  $("relPdf").addEventListener("click",function(){download(relatorioPdf(false),"relatorio-quiz-"+slug(S.nome)+".pdf","application/pdf");});
}
function slug(s){return s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}

/* ---------- PDF do relatório (gerador simples, Helvetica, A4, margem de 1 cm) ---------- */
function relatorioPdf(comGabarito){
  var p=primeira(), f=finalOk(), nota=(p/Q.length*10).toFixed(1).replace(".",",");
  var L=[];
  function add(t,o){o=o||{};L.push({t:t,s:o.s||10,b:!!o.b,c:o.c||[0.11,0.14,0.18],g:o.g||0});}
  add("RELATÓRIO DO QUIZ | Unidade curricular: "+M.unidade+" | "+M.serie,{s:9,b:true,c:[0.05,0.35,0.38]});
  add(M.titulo,{s:15,b:true,c:[0.05,0.35,0.38],g:4});
  add("Estudante: "+S.nome+"     Turma: "+S.turma,{s:11,b:true,g:6});
  add("Início: "+dataHora(S.inicio)+"     Fim: "+dataHora(S.fim)+"     Duração: "+duracao());
  add("Nota (acertos de primeira): "+nota+"     Acertos de primeira: "+p+"/"+Q.length+"     Após as retomadas: "+f+"/"+Q.length,{b:true,g:4});
  add("Saídas da aba durante o quiz: "+(S.saidas||0)+"     Código do relatório: "+codigo());
  add("Resultado por questão",{s:11.5,b:true,c:[0.05,0.35,0.38],g:10});
  Q.forEach(function(q,i){
    var s=situacao(i)[0], r=S.res[i]||[];
    var marc=r.map(function(x){return LET[x];}).join(", ");
    add((i<9?"0":"")+(i+1)+"   "+q.tema+"   |   "+s+(comGabarito?"   |   Marcou: "+(marc||"-")+"   |   Gabarito: "+LET[ans(i)]:""),{s:9.5,g:1});
  });
  if((S.eventos||[]).length){
    add("Registros durante o quiz",{s:11.5,b:true,c:[0.05,0.35,0.38],g:10});
    S.eventos.slice(0,40).forEach(function(e){add(dataHora(e.t)+"   "+e.tipo,{s:9.5});});
  }
  return pdfSimples(L, "Relatório | "+M.unidade);
}
function pdfSimples(lines, rodape){
  var W=595.28,H=841.89,MG=28.35,y,pages=[],cur=null;
  function latin(s){var o="";for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);o+=c<256?s[i]:(c===8211||c===8212?"-":c===8220||c===8221?'"':c===8216||c===8217?"'":"?");}return o;}
  function escP(s){return latin(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");}
  function newPage(){cur=[];pages.push(cur);y=H-MG-12;}
  function wrap(t,size){var max=Math.floor((W-2*MG)/(size*0.5)),words=t.split(" "),out=[],line="";
    words.forEach(function(w){if((line+" "+w).trim().length>max){out.push(line);line=w;}else line=(line?line+" ":"")+w;});if(line)out.push(line);return out;}
  newPage();
  lines.forEach(function(l){
    y-=l.g;
    wrap(l.t,l.s).forEach(function(tx){
      if(y-l.s*1.35<MG+20){newPage();}
      cur.push("BT /"+(l.b?"F2":"F1")+" "+l.s+" Tf "+l.c.join(" ")+" rg "+MG+" "+(y-l.s).toFixed(2)+" Td ("+escP(tx)+") Tj ET");
      y-=l.s*1.38;
    });
  });
  var objs=[],n=pages.length;
  objs.push("<< /Type /Catalog /Pages 2 0 R >>");
  var kids=[];for(var i=0;i<n;i++)kids.push((5+i*2)+" 0 R");
  objs.push("<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  pages.forEach(function(pg,k){
    var foot="0.6 0.65 0.68 RG 0.5 w "+MG+" "+(MG+12)+" m "+(W-MG)+" "+(MG+12)+" l S BT /F1 8.5 Tf 0.29 0.33 0.38 rg "+MG+" "+MG+" Td ("+escP(rodape)+") Tj ET BT /F1 8.5 Tf 0.29 0.33 0.38 rg "+(W-MG-60)+" "+MG+" Td ("+escP("Página "+(k+1)+" de "+n)+") Tj ET";
    var content=pg.join("\n")+"\n"+foot;
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+W+" "+H+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(6+k*2)+" 0 R >>");
    objs.push("<< /Length "+latin(content).length+" >>\nstream\n"+latin(content)+"\nendstream");
  });
  var out="%PDF-1.4\n",off=[];
  objs.forEach(function(o,i){off.push(out.length);out+=(i+1)+" 0 obj\n"+latin(o)+"\nendobj\n";});
  var x=out.length;out+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
  off.forEach(function(o){out+=("0000000000"+o).slice(-10)+" 00000 n \n";});
  out+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+x+"\n%%EOF";
  var u=new Uint8Array(out.length);for(var j=0;j<out.length;j++)u[j]=out.charCodeAt(j)&255;return u;
}

/* ---------- área do professor ---------- */
function sha256(str){
  function rr(n,x){return(x>>>n)|(x<<(32-n));}
  var K=[],Hh=[],pr=2,c=0;
  function isP(n){for(var f=2;f*f<=n;f++)if(n%f===0)return false;return true;}
  while(c<64){if(isP(pr)){if(c<8)Hh[c]=(Math.pow(pr,1/2)*4294967296)|0;K[c]=(Math.pow(pr,1/3)*4294967296)|0;c++;}pr++;}
  var bytes=unescape(encodeURIComponent(str)),l=bytes.length*8,w=[],i,j;
  bytes+="\x80";while(bytes.length%64-56)bytes+="\x00";
  for(i=0;i<bytes.length;i++){j=bytes.charCodeAt(i);w[i>>2]|=j<<((3-i)%4)*8;}
  w[w.length]=(l/4294967296)|0;w[w.length]=l;
  var H2=Hh.slice(0);
  for(j=0;j<w.length;){var W2=w.slice(j,j+=16),old=H2.slice(0);
    for(i=0;i<64;i++){var w15=W2[i-15],w2=W2[i-2],a=H2[0],e=H2[4];
      var t1=H2[7]+(rr(6,e)^rr(11,e)^rr(25,e))+((e&H2[5])^(~e&H2[6]))+K[i]+(W2[i]=(i<16)?W2[i]:(W2[i-16]+(rr(7,w15)^rr(18,w15)^(w15>>>3))+W2[i-7]+(rr(17,w2)^rr(19,w2)^(w2>>>10)))|0);
      var t2=(rr(2,a)^rr(13,a)^rr(22,a))+((a&H2[1])^(a&H2[2])^(H2[1]&H2[2]));
      H2=[(t1+t2)|0].concat(H2);H2[4]=(H2[4]+t1)|0;H2.length=8;}
    for(i=0;i<8;i++)H2[i]=(H2[i]+old[i])|0;}
  var hex="";for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(H2[i]>>(j*8))&255;hex+=((b<16)?"0":"")+b.toString(16);}return hex;
}
$("profBtn").addEventListener("click",function(){
  var r=$("modalRoot");
  r.innerHTML='<div class="overlay" role="dialog" aria-modal="true"><div class="modal"><h2>Área do professor</h2>'+
    '<div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="off"></div>'+
    '<div class="qnav"><button class="btn ghost" id="fechaP" type="button">Cancelar</button><button class="btn" id="entraP" type="button">Entrar</button></div></div></div>';
  $("senha").focus();
  $("fechaP").addEventListener("click",function(){r.innerHTML="";});
  function entra(){ if(sha256($("senha").value)===CFG.senhaHash) menuProf(); else { $("senha").value=""; $("senha").placeholder="Senha incorreta"; } }
  $("entraP").addEventListener("click",entra);
  $("senha").addEventListener("keydown",function(e){if(e.key==="Enter")entra();});
});
function menuProf(){
  var r=$("modalRoot"), h='<div class="overlay" role="dialog" aria-modal="true"><div class="modal"><h2>Área do professor</h2>';
  if(S.nome) h+='<p><b>Progresso neste aparelho:</b> '+esc(S.nome)+' ('+esc(S.turma)+'), etapa: '+({inicio:"início",questao:"respondendo",pausa:"pausa reflexiva",fim:"concluído"}[S.fase])+(S.fase==="fim"?', nota '+(primeira()/Q.length*10).toFixed(1).replace(".",",")+', código '+codigo():'')+'.</p>';
  h+='<div class="tbl"><table><thead><tr><th scope="col">Questão</th><th scope="col">Gabarito</th><th scope="col">Seção</th></tr></thead><tbody>';
  Q.forEach(function(q,i){h+='<tr><td>'+(i+1)+'</td><td><b>'+LET[ans(i)]+'</b></td><td>'+esc(q.secTitle)+'</td></tr>';});
  h+='</tbody></table></div><div class="qnav">'+
    (S.fase==="fim"?'<button class="btn ghost" id="relProf" type="button">Relatório com gabarito (PDF)</button>':'')+
    '<button class="btn ghost" id="zera" type="button">Reiniciar neste aparelho</button>'+
    '<button class="btn" id="fechaM" type="button">Fechar</button></div></div></div>';
  r.innerHTML=h;
  $("fechaM").addEventListener("click",function(){r.innerHTML="";});
  $("zera").addEventListener("click",function(){ if(confirm("Apagar o progresso salvo neste aparelho?")){store.del();S={fase:"inicio"};save();r.innerHTML="";render();show(0);} });
  if($("relProf")) $("relProf").addEventListener("click",function(){download(relatorioPdf(true),"relatorio-gabarito-"+slug(S.nome)+".pdf","application/pdf");});
}

/* ---------- início ---------- */
show(S.fase==="inicio"?0:1);
})();
</script>
</body>
</html>
